# charness:gate-policy local-gate-subset-mirror
# Every quality step below verbatim re-runs a repo-owned validator the
# canonical local gate already enforces (see maintainer-local-enforcement.md
# §Local-gate-subset mirror workflows) — adding a step that is NOT in the
# local gate graph disqualifies the marker.
# Authored by the 2026-06-10 next-queue goal (slice 3). The local
# run-quality --release / pre-push gate is the maintainer-machine bundle
# proof; this workflow adds a remote authoritative LIGHT layer that catches a
# bypass (a direct push without the local hooks) and mirrors the changed-line
# mutation gate into a CI-PR check. It is repo-local CI config: installed-
# plugin consumer repos inherit nothing from it.
#
# Deliberately NOT the full run-quality broad gate: specdown, the
# agent-browser runtime gates, and the full local check queue stay
# local/scheduled surfaces (see mutation-tests.yml for the scheduled deeper
# check). Each step below invokes a repo-owned validator directly, so the
# rules stay single-source — this file only schedules them.

name: Quality Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core deterministic gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Setup Node
        # check-markdown.sh resolves markdownlint-cli2 via npm exec; npm ci
        # pins it to the lockfile version instead of fetching latest.
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install core gate dependencies
        # ruff pinned so the bypass-catcher only reds on repo regressions,
        # not on new upstream lint rules.
        run: pip install -r packaging/bootstrap-requirements.txt "ruff==0.15.10"

      - name: Lint (ruff)
        # Invokes the repo-owned entrypoint rather than retyping its path list, which is
        # what this workflow's `local-gate-subset-mirror` marker claims of every step.
        # The retyped copy this replaced had drifted: it omitted skills/shared/scripts,
        # so ten shared-contract scripts were invisible to the bypass-catcher.
        run: ./scripts/check-python-lint.sh

      - name: Validate plugin packaging export
        run: python3 scripts/validate_packaging.py --repo-root .

      - name: Validate committed plugin export drift
        run: python3 scripts/validate_packaging_committed.py --repo-root .

      - name: Validate doc links
        run: python3 scripts/check_doc_links.py --repo-root .

      # Its sibling above scans the authoring tree and deliberately not
      # `plugins/**`, so a link broken only by the export transform is invisible
      # to it. Both gates share a staged-`.md` commit trigger that does NOT scope
      # either of them — a link verdict also flips when the TARGET is renamed,
      # which stages no `.md` at all — so this remote step is the layer that
      # catches that case on a push. In the local gate graph via run-quality.sh
      # and the commit-time plan, so the subset-mirror marker above holds.
      - name: Validate plugin-mirror doc links
        run: python3 scripts/check_plugin_doc_links.py --repo-root .

      - name: Validate plugin-dir references
        run: python3 scripts/check_plugin_dir_references.py --repo-root .

      - name: Validate markdown
        run: ./scripts/check-markdown.sh

      - name: Validate workflow action majors
        run: python3 scripts/check_github_actions.py --repo-root .

  changed-line-mutation-mirror:
    # The same blocking signal as the local pre-push teeth
    # (check_changed_line_mutation_coverage), run with the gate's own coverage
    # probe — the env recipe matches mutation-tests.yml, which already runs this
    # suite in CI. Head defaults to HEAD, so the verdict covers the change as it
    # lands.
    #
    # Runs on direct pushes to main as well as PRs, and the push arm is the point.
    # This file's own header says it exists to "catch a bypass (a direct push
    # without the local hooks)", but while this job was PR-only it did not: the
    # local pre-push gate defuses itself on the direct-push path
    # (--skip-if-no-coverage / --require-fresh-coverage / --allow-dirty all exit 0
    # when the author has not first paid for the ~10min coverage producer), so a
    # direct push to main had NO blocking changed-line signal anywhere. The
    # scheduled cron caught it up to 3 hours later and auto-filed an issue — which
    # is #219 -> #251 -> #260 -> #320 -> #321 -> #335 -> #453, seven instances of
    # one class. This closes it at the first remote gate instead of the cron.
    name: Changed-line mutation coverage (push/PR mirror)
    # A push with no usable base (branch creation, or a force-push whose `before`
    # is unreachable) has no range to analyze; the cron still covers those.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install suite dependencies
        run: pip install -r packaging/mutation-requirements.txt

      - name: Install JS dependencies
        run: npm ci

      - name: Install validation binaries
        run: |
          if ! command -v tokei >/dev/null 2>&1; then
            cargo --version
            cargo install tokei
          fi
          tokei --version

      - name: Changed-line mutation coverage gate
        # --write-fresh-marker selects the plain (no dynamic_context) probe:
        # the changed-line verdict only needs executed-vs-missing lines, and
        # the per-test-context export is the documented multi-GB blow-up. The
        # fingerprint marker it writes is ephemeral in CI.
        env:
          # PR: the merge target. Push: the commit main was at before this push,
          # so the analyzed range is exactly what the push added.
          CHANGED_LINE_BASE_SHA: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.sha
                || github.event.before }}
        run: |
          if ! git cat-file -e "$CHANGED_LINE_BASE_SHA^{commit}" 2>/dev/null; then
            echo "base $CHANGED_LINE_BASE_SHA is unreachable (force-push or truncated history);" \
                 "no range to analyze, leaving this to the scheduled mutation run." >&2
            exit 0
          fi
          python3 scripts/check_changed_line_mutation_coverage.py --repo-root . \
            --base-sha "$CHANGED_LINE_BASE_SHA" \
            --write-fresh-marker
