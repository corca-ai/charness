schema_version: release.run_plan.v1
envelope_version: charness.run_plan_envelope.v1
required_reads:
- path: references/index.md
  why: Manual progressive-disclosure map for release references.
  size_bytes: 1030
- path: references/version-policy.md
  why: Use when choosing or checking a target bump.
  size_bytes: 3090
- path: references/critique-boundary.md
  why: Read before task-completing release mutation; planner currently lacks critique
    proof.
  size_bytes: 8691
- path: references/publication-boundary.md
  why: Tag, workflow, public visibility, and issue-close boundaries are not terminal
    green.
  size_bytes: 6849
- path: references/install-refresh.md
  why: Adapter declares a post-publish install refresh command.
  size_bytes: 1727
- path: references/real-host-proof.md
  why: Adapter declares release-time real-host proof triggers.
  size_bytes: 2404
next_action:
  kind: inspect_only
  reason: No target selector was provided; review current release state and choose
    publish-current/part/set-version.
gate_packets:
- id: current-release
  trust_model: hard drift facts; its embedded fresh-checkout block is `not_established`
    (declared, not run here)
  cost_tier: cheap
  command: python3 "$SKILL_DIR/scripts/current_release.py" --repo-root .
  purpose: release surface, version drift, worktree, and declared fresh-checkout probes
  run_when: always before release mutation
- id: fresh-checkout-probes
  trust_model: executed probe verdict; exit 1 on a failing probe, exit 3 if invoked
    without --run-probes
  cost_tier: cheap
  command: python3 "$SKILL_DIR/scripts/check_fresh_checkout_probes.py" --repo-root
    . --run-probes --detail
  purpose: execute the repo-declared fresh-checkout probes in a temp clone of this
    branch
  run_when: always; the publish helper re-runs them after the version bump, before
    tag push
- id: real-host-proof
  trust_model: trigger detector, not the proof itself; exit 3 and no `required` key
    when the changed scope is empty
  cost_tier: cheap
  command: python3 "$SKILL_DIR/scripts/check_real_host_proof.py" --repo-root . --detail
  purpose: determine whether release-time human/host proof is required
  run_when: always before closeout claims
- id: requested-review-gate
  trust_model: advisory when no requested_review_commands are configured
  cost_tier: cheap
  command: python3 "$SKILL_DIR/scripts/check_requested_review_gate.py" --repo-root
    . --skip-commands --detail
  purpose: surface configured requested-review enforcement posture
  run_when: before publish; execute commands in the publish helper
