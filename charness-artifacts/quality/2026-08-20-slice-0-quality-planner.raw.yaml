structural_review_packet:
  required: true
  target_skill:
    requested: null
    status: unspecified
    path: null
    note: No target skill was provided; answer the structural packet for the selected
      quality scope before recommending fixes.
  write_artifact_signals:
  - 'Target boundary:'
  - 'Ambient repo findings:'
  - 'prose review result:'
  - 'structural review result:'
  - 'Recommended Next Quality Moves:'
  quality_move_card:
    applies_to: recommended moves only
    fields:
    - capability_needed
    - current_centers
    - next_center
    - transformation
    - proof_boundary
    - enforcement_posture
    move_types:
    - cleanup-delete
    - merge-or-split-ownership
    - helper-extraction
    - interface-narrowing
    - dogfood-or-evidence-packet
    - gate-reuse
    - floor-candidate
    - defer-watch
    - no-op
    enforcement_postures:
    - advisory
    - describe-first
    - existing-gate-reuse
    - candidate-floor
    - no-gate
    default_enforcement_posture: advisory-or-no-gate
    candidate_floor_requirement: explicit north-star plus floor-addition-restraint
      record
  questions:
  - id: capability_needed
    question: What user or downstream-agent capability is weak or missing for this
      target?
    artifact_signal: Record the capability before naming the move; do not start from
      a gate or authoring form.
  - id: sequencing_applicability
    question: Does order affect correctness, uncertainty reduction, or downstream
      unlocks here, or should the generative-sequence lens stay unused?
    artifact_signal: Use ../../../shared/references/generative-sequence.md only when
      the failure is sequencing-shaped.
  - id: current_centers
    question: Which current centers already help the capability, and which one should
      be strengthened next?
    artifact_signal: Record current centers and the next center before choosing a
      transformation.
  - id: quality_move_card
    question: For each recommended quality move, what is the bounded transformation,
      proof boundary, and enforcement posture?
    artifact_signal: Apply the move card only to recommended moves, not every finding.
  - id: enforcement_posture
    question: Is the posture advisory, describe-first, existing-gate-reuse, candidate-floor,
      or no-gate?
    artifact_signal: Default missing or uncertain posture to advisory/no-gate; candidate-floor
      requires north-star plus floor-addition-restraint provenance.
  - id: authoring_form_relevance
    question: Do helper ownership, core-vs-reference, dogfood, or ergonomics issues
      explain the weak capability, or are they ambient/non-claims?
    artifact_signal: Use authoring/form questions only when they explain the consumer
      capability weakness.
  interpretation:
    measures: a required judgment packet over the target skill, not another heuristic
      score
    proxy_for: whether the quality run reached capability-first judgment before recommending
      moves
    blind_spots: the packet enforces that questions are answered, not that the answers
      are correct; it must not become form-filling for every finding
    interpretation_question: did the answers identify the next quality move or justify
      no quality move with evidence?
gate_plan: report_first
phase_barriers:
- Read declaration_lifecycle before gates; declared-only, unreachable, missing, and
  not-run are not covered verdicts.
- Read required_reads before broad gates.
- The brief carries the load-bearing classification/automation/maintainer-enforcement
  discipline and the inventory-dispatch routing index (concern area -> inventories
  + detail_refs) inline; apply it and open a brief detail_ref only when its trigger
  fires.
- Answer structural_review_packet before broad recommendations; separate target findings
  from ambient repo gate failures.
- Run deterministic gates as evidence packets, then analyze the report against the
  primer refs before fixing.
- Use gate trust_model/cost_tier/parallel_group to decide whether to trust, parallelize,
  or manually inspect a packet.
- Open on-demand refs only when a concrete gate, inventory, source, or operator finding
  matches their trigger.
on_demand_reads:
- path: references/inventory-dispatch.md
  role: on-demand
  trigger: a concern area needs its per-inventory review discipline or the clone-family/structural-signal
    depth beyond the planner brief's dispatch index
- path: references/gate-classification.md
  role: on-demand
  trigger: the planner brief's gate-state or weak-vs-missing discipline is contested,
    or a candidate-floor recommendation needs its full provenance rule
- path: references/automation-promotion.md
  role: on-demand
  trigger: adding a new advisory/inventory or inference-layer surface, or an inference-layer
    advisory needs its full per-surface interpretation/registration protocol beyond
    the brief
- path: references/maintainer-local-enforcement.md
  role: on-demand
  trigger: a canonical final gate's pre-push enforcement, CI/local gate parity, or
    gate-policy markers (scheduled-deeper-check, local-gate-subset-mirror) need judging
    beyond the brief prompt
- path: references/adapter-contract.md
  role: on-demand
  trigger: adapter missing, invalid, stale, or under-specified
- path: references/adapter-gate-review.md
  role: on-demand
  trigger: adapter or gate recommendation needs enforcement-tier review
