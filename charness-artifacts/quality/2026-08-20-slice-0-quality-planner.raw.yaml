required_reads:
- path: references/quality-lenses.md
  role: required-primer
  why: Interpret every quality packet through concept, behavior, security, and operability.
  size_bytes: 7448
- path: references/surface-contract-review.md
  role: required-primer
  why: Separate routed gate receipts from semantic surface coverage and disclose unexamined
    axes.
  size_bytes: 1820
- path: references/proposal-flow.md
  role: required-primer
  why: Keep recommendations concrete, sourced, and proportionate.
  size_bytes: 5860
- path: references/operability-signals.md
  role: required-primer
  why: Read runtime, setup, CI, and maintenance signals as quality evidence.
  size_bytes: 4388
- path: references/skill-quality.md
  role: scope-primer
  scope: skill-authoring
  why: Inspect skills as runtime artifacts when the repo authors skills.
  size_bytes: 4024
- path: references/skill-ergonomics.md
  role: scope-primer
  scope: skill-authoring
  why: Judge whether skill cores, references, and scripts preserve progressive disclosure.
  size_bytes: 6231
next_action:
  kind: read_primer_refs
gate_packets:
- id: read-only-quality
  command: ./scripts/run-quality.sh --read-only
  purpose: standing deterministic evidence packet
  trust_model: hard gate plus advisory sub-packets; green is evidence, not judgment
  cost_tier: broad
  parallel_group: serial-critical
  run_after: required-primer
  run_when: repo exposes this repo-native command or an equivalent standing quality
    gate
- id: runtime-summary
  command: python3 "$SKILL_DIR/scripts/render_runtime_summary.py" --repo-root . --detail
  purpose: measured runtime trend source before claiming cost or speed facts
  trust_model: measurement packet
  cost_tier: cheap
  parallel_group: inventories
  run_when: runtime, slow gate, budget, or cost is in scope
- id: regenerable-facts
  command: python3 "$SKILL_DIR/scripts/check_regenerable_facts.py" --repo-root .
  purpose: refuse a transcribed number in forward-looking prose; conservative defaults
    do not guess that docs/** is current
  trust_model: hard on findings or invalid declared scope; unconfigured docs are a
    typed no-verdict at exit 0, never a clean claim
  cost_tier: cheap
  parallel_group: serial-critical
  run_when: the repo carries forward-looking prose a reader treats as current
- id: skill-ergonomics
  command: python3 "$SKILL_DIR/scripts/inventory_skill_ergonomics.py" --repo-root
    . --summary
  purpose: advisory skill-surface pressure packet when skills are in scope
  trust_model: heuristic advisory with false positives and false negatives
  cost_tier: cheap
  parallel_group: inventories
  run_when: skills_in_scope
- id: lesson-lifecycle-review
  command: ./scripts/render_lesson_lifecycle_review.py --repo-root .
  purpose: lesson-lifecycle evidence for the graduate / rewrite-in-place / strengthen-binding
    judgment the ledger contract assigns to quality
  trust_model: evidence only, never a verdict; orders by anchored evidence and reports
    recurrence as context because recurrence cannot discriminate the three dispositions.
    Exits zero over any validatable ledger including one with nothing to propose;
    a nonzero exit is a refusal to render -- an unreadable or unreplayable ledger
    at 1, a helper-provenance refusal at 2 -- never a finding about a lesson
  cost_tier: cheap
  parallel_group: inventories
  run_when: repo exposes this repo-native command declaring a lesson evaluator
- id: adapter-preflight-1
  command: python3 scripts/validate_maintainer_setup.py --repo-root .
  purpose: execute the adapter's declared preflight_commands entry
  trust_model: repo-declared route; planner inclusion proves reachability only, and
    execution remains not-run until a later receipt says otherwise
  cost_tier: unknown
  parallel_group: adapter-declared
  run_after: required-primer
  run_when: declared by the resolved quality adapter
- id: adapter-preflight-2
  command: python3 scripts/doctor.py
  purpose: execute the adapter's declared preflight_commands entry
  trust_model: repo-declared route; planner inclusion proves reachability only, and
    execution remains not-run until a later receipt says otherwise
  cost_tier: unknown
  parallel_group: adapter-declared
  run_after: required-primer
  run_when: declared by the resolved quality adapter
- id: adapter-gate-1
  command: ./scripts/run-quality.sh
  purpose: execute the adapter's declared gate_commands entry
  trust_model: repo-declared route; planner inclusion proves reachability only, and
    execution remains not-run until a later receipt says otherwise
  cost_tier: unknown
  parallel_group: adapter-declared
  run_after: required-primer
  run_when: declared by the resolved quality adapter
- id: adapter-review-1
