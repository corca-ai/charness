brief:
  purpose: load-bearing residue of demoted primers, carried inline so a run keeps
    the discipline without a mandatory prose read; open detail_ref only on trigger
  inventory_dispatch:
    detail_ref: references/inventory-dispatch.md
    consumption: Run a focused inventory only when the quality question brings its
      surface into scope; advisory inventories are review prompts, not mandates. Use
      `--summary` YAML for every dispatch script's first-read triage and switch to
      `--detail` YAML only when a finding needs full attribution or disposition. YAML
      is the only structured output contract; the removed hidden JSON mode is not
      a supported programmatic seam. The existing YAML contract test derives every
      dispatch script command from the routing document and inventories every inventory_*.py
      script so new entries cannot bypass the contract. An inventory cited in the
      artifact's `## Commands Run` must engage >=2 declared non-headline fields (one
      is enough when only one is declared; validate-inventory-consumption enforces).
      Inventory scripts resolve under `$SKILL_DIR/scripts/`; detail_refs under `references/`.
    areas:
    - area: cli-operator-surface
      scope: repo ships or changes an operator CLI, command registry, or installable
        entrypoint
      inventories:
      - inventory_cli_ergonomics.py
      - inventory_cli_side_effect_probes.py
      detail_refs:
      - cli-ergonomics-smells.md
      - installable-cli-probes.md
    - area: docs-readability
      scope: first-touch/entrypoint docs or reader-facing public specs are in scope
      inventories:
      - inventory_entrypoint_docs_ergonomics.py
      - inventory_public_spec_quality.py
      detail_refs:
      - entrypoint-docs-ergonomics.md
      - public-spec-layering.md
    - area: skills
      scope: the repo authors public or support skills
      inventories:
      - inventory_skill_ergonomics.py
      - suggest_public_skill_dogfood.py
      detail_refs:
      - skill-quality.md
      - skill-ergonomics.md
    - area: runtime-test-economics
      scope: slow tests, runtime cost, budgets, or broad test/spec economics are in
        scope
      inventories:
      - inventory_standing_gate_verbosity.py
      - inventory_standing_test_economics.py
      - inventory_command_dominance.py
      - inventory_structural_waste.py
      - inventory_ci_recoverable_gates.py
      - render_runtime_summary.py
      detail_refs:
      - standing-gate-verbosity.md
      - testability-and-selection.md
      - proof-path-efficiency.md
      - cost-dominance.md
      - executable-spec-economics.md
      - ci-recoverable-gate-triage.md
    - area: agent-production-runtime
      scope: repo evidence shows a production LLM/agent serving path (serving-path
        client, model routing/fallback, runtime telemetry); never eval fixtures, skill
        docs, or offline scaffolding
      inventories:
      - recommend_behavior_test.py
      detail_refs:
      - agent-production-runtime.md
      - behavior-testing.md
    - area: source-hygiene
      scope: dual implementations, clone families, brittle source guards, lint suppressions,
        dead code, gitignore hygiene, hardcoded polyglot discovery lists, or boundary-bypass
        ratchets are in scope
      inventories:
      - inventory_dual_implementation.py
      - inventory_brittle_source_guards.py
      - inventory_lint_ignores.py
      - inventory_nose_clones.py
      - inventory_gitignore_scan_hygiene.py
      - inventory_hardcoded_discovery.py
      - run_dead_code_advisory.py
      detail_refs:
      - dual-implementation-parity.md
      - brittle-source-guards.md
      - lint-ignore-discipline.md
      - dup-ratchet.md
      - boundary-bypass-ratchet.md
      - quality-signal-scorecard.md
    - area: adapter-gate-design
      scope: adapter policy or gate design is in scope
      inventories:
      - inventory_adapter_gate_design.py
      detail_refs:
      - adapter-gate-review.md
    - area: security-supply-chain
      scope: security posture or supply-chain proof separation is in scope
      detail_refs:
      - security-overview.md
      - security-npm.md
      - security-pnpm.md
      - security-uv.md
    - area: coverage-eval-depth
      scope: coverage floors, prompt/content assets, or eval depth are in scope
      detail_refs:
      - coverage-floor-policy.md
      - prompt-asset-policy.md
  gate_classification:
    closeout_states:
      healthy: present, runnable, high-signal for the seam it covers
      weak: present but easy to game, too shallow for the claimed confidence, duplicated
        by a better gate, OR a green non-shallow gate STILL paying standing runtime
        after a cheaper, more-direct proof now covers the same seam (cost-redundancy
        alone makes a working gate weak)
      missing: should exist for the current risk surface but is absent or only implied
      deferred: useful later, not the next highest-leverage gate for the current state
    note: 'these four states are the required ## Healthy / ## Weak / ## Missing /
      ## Deferred closeout sections; classify every gate before recommending moves'
    ranking_is_advisory: Recommended Next Quality Moves ordering is an inference-layer
      proxy — answer its interpretation question for THIS repo before trusting the
      rank
    candidate_floor: exceptional; needs explicit north-star + floor-addition-restraint
      provenance
    detail_ref: references/gate-classification.md
  automation_promotion:
    cases:
      AUTO_EXISTING: already enforced by a meaningful deterministic gate; do not re-report
        as a manual finding without added repo interpretation
      AUTO_CANDIDATE: should become a deterministic gate; propose the gate before
        more policy prose
      NON_AUTOMATABLE: still needs judgment/tradeoffs/human review; belongs in prose
        findings and proposals
    inference_layer_rule: for any inference-layer advisory (clone %, ergonomics heuristics,
      rankings, length/pressure smells, runtime trends) answer its self-declared interpretation
      question for THIS repo before repeating/ranking/escalating; each inventory emits
      its own question at run time
    detail_ref: references/automation-promotion.md
  maintainer_local_enforcement:
    field_discipline: record a Maintainer-Local Enforcement disposition; 'Unclear'
      is not acceptable — default to `missing` until the gap is closed or explicitly
      deferred with a reason
    detail_ref: references/maintainer-local-enforcement.md
    final_gates_detected:
    - scripts/run-quality.sh
    prompt: 'DETECTED a canonical final gate (scripts/run-quality.sh): before calling
      operability healthy, record HOW it is enforced before push in maintainer clones
      (checked-in hook + clone validator, a repo-owned installer, or an explicit documented
      decision to omit hooks with a named CI owner). A green gate that clones can
      push around is an enforcement gap that happens to compile.'
