lens: '(Gawande) operational correctness of the wired rule: races between the event-reader
  thread and the watch thread (double kill, stop vs preempt, take_preempted), the
  execution loop after a preemption (session-resume vs relaunch-in-place, pending
  steer delivery, exit code), any path where a lane can now run forever with no wall
  clock (watch absent, rule disabled, watcher exceptions), and whether the tests reach
  the real pipe and process. Separate real blockers from over-worry.'
