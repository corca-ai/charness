    body: 'The trigger''s named work was done and **measured not to move the bar**.
      Recording it here so the next reader does not repeat it.


      **Per-test profiling** — no hotspot. `-n 12 --durations=40` over the standing
      set shows a flat tail: the top entry is 18.1s and the fortieth is 3.5s. There
      is nothing to fix.


      **Smaller standing set** — done in `e66d5fa8f`. Sixteen real-corpus / real-export
      CLI probes moved to a new `slow_corpus` lane, selected by what they drive rather
      than by how long they take, and still executed by the full/release lane. Isolated,
      the standing lane went **85.8s → 75.6s**.


      **In-gate, it bought almost nothing.** Three samples after the cut: `128196,
      126939, 135892`. The recent 20-sample median moved **126645 → 125850**. A 12%
      cut in test CPU produced 0.6% of in-gate wall.


      **Why**: this label does not measure suite growth. It measures wall time inside
      `run-quality.sh`, where pytest shares CPU with ~95 concurrent checks. A contention-bound
      number cannot be moved by shrinking the thing being contended.


      On that refutation — a different reason from the one the trigger forbade repeating
      — the bar was releveled to `155000`, about 1.12x the observed worst (137823)
      over the recent window, deliberately not the suggester''s `193000` (this block''s
      uniform ~1.4x-worst convention, which the previous relevel explicitly refused
      for this label). The reasoning is written into `.agents/quality-adapter.yaml`
      beside the number.


      **What is still open, and what this issue should now track**: the real fix is
      to reduce what pytest competes with inside the gate — the concurrency shape
      of `run-quality.sh` itself — not the bar and not the suite. That is a run-quality
      orchestration change and was not attempted here.


      **Cost of leaving it red, for the record**: it already trained one bypass. #640''s
      push went out with `--no-verify` because this bar refused it, and the release
      could not proceed at all until this relevel, because `publish_release.py` offers
      no equivalent escape.'
