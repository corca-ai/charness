    body: '**Operator ruling, 2026-08-18: the framing above is the wrong one, and
      the fix belongs in the next session.**


      The relevel this issue records treated a symptom. The sharper reading, raised
      by the repo owner after watching three separate release attempts fail:


      > 머신 상태에 지나치게 의존적인 느낌인데. 속도가 릴리즈를 못하게 하는 것도 정말 필요한지 잘 모르겠고.


      Three things blocked publishing 6.2.0, and all three were the same class:


      | blocker | what it actually measured |

      |---|---|

      | `check-runtime-budget` | pytest''s CPU share against ~95 concurrent gate checks
      |

      | `plan_release_run.py`''s 10s CLI timeout (#669) | how long the planner waited
      for a core |

      | the SIGTERM reaping race (#669) | where the scheduler placed a signal handler
      |


      None of them says anything about the code. The same tree passes or fails by
      what else is running on the box. Confirmed directly: two other `claude` agents
      and a `workerd` process at 74% CPU held the machine at load ~17 through every
      failed attempt; the release went out on the first try after load fell to 2.3.


      Two arguments against this bar blocking at all, both stronger than the relevel:


      1. **Speed is a usability signal, not a correctness one.** A slow suite does
      not make a release wrong. This bar can block a correct release and cannot block
      an incorrect one — the risk is wired backwards.

      2. **Wall time measures a variable this repo does not control.** The same standing
      lane read 85.8s isolated and 137s in-gate. A verdict a neighbouring process
      can flip is not measuring the subject.


      The adapter''s own note already said the consequence: *"A bar that cannot be
      green is not teeth, it is a gate the next session learns to route around."*
      It trained two bypasses in one session — a `--no-verify` push and then this
      relevel.


      Two candidate shapes for the next session, neither decided:


      - Measure **CPU time** rather than wall time. Nearly insensitive to concurrency,
      still catches a real regression (tests actually doing more work).

      - Keep wall time but block only at a multiple contention cannot explain (~3x).
      The current bar sits at 1.12x the observed worst, which is inside the noise
      band.


      Either way the blocking arm should probably move to advisory in the push and
      release lanes. That is a quality-contract change and was deferred to a dedicated
      session rather than folded into a release.'
