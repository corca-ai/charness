  body: "## Situation\n\nThe `pytest` runtime-budget label has been red across this\
    \ and the prior session.\n`.agents/quality-adapter.yaml` sets it to `120000` under\n\
    `runtime_budget_profiles.local-linux-x86_64-36cpu`, and the in-gate samples sit\
    \ at\na median of ~126s (latest 128.6s, max 137.8s).\n\nThat budget block carries\
    \ an explicit REVISIT TRIGGER, recorded when it was last\nraised:\n\n> the next\
    \ time this bar goes red, do NOT relevel it again on the same reasoning.\n> Two\
    \ relevels inside a month is the counted-limit retry loop this repo already\n\
    > records, and the answer at that point is per-test profiling or a smaller\n>\
    \ standing set, not a third number.\n\nThe bar is now red. This issue is the trigger\
    \ firing.\n\n## Experience\n\nThe red bar blocked a `git push` whose slice had\
    \ nothing to do with suite runtime.\nClearing it needed an owner decision, and\
    \ the push went out with `--no-verify`\nagainst an explicitly re-authorized grant\
    \ — a bypass that should not be the\nrecurring answer to a standing red.\n\n##\
    \ Evidence\n\n- Budget: `.agents/quality-adapter.yaml`, `runtime_budget_profiles.local-linux-x86_64-36cpu.pytest:\
    \ 120000`.\n- In-gate: `pytest recent median 126645ms (latest 128558ms, budget\
    \ 120000ms)`.\n- The breach predates the slice that hit it: `docs/handoff.md`\
    \ at `c34155a48`\n  already read \"The pytest lane has breached its 120s budget\
    \ in five recent\n  samples (max 130.9s, all passing)\".\n- Isolated A/B on one\
    \ machine, `python3 scripts/run_standing_pytest.py`:\n  base `c34155a48` 87.4s,\
    \ head `65742d2fc` 85.8s. The in-gate figure is ~40s\n  higher than the isolated\
    \ one, so most of the gap is contention — the gate runs\n  ~94 checks concurrently,\
    \ and an unrelated foreign suite was also running on the\n  host during several\
    \ samples.\n- Profiling (`-n 8 --durations=12`, 120.3s total, 10080 tests): no\
    \ dominant test.\n  The top twelve run 6.2s–16.3s and spread across workers —\n\
    \  `test_probe_drift_message.py::test_the_recorded_floor_commands_actually_run`,\n\
    \  `test_prepush_focused_changed_line_coverage.py::test_focused_command_excludes_a_release_only_execution_path`,\n\
    \  and `test_a_declaration_is_not_its_own_corroboration.py::test_the_measurement_floor_is_overridable_without_editing_the_gate`\n\
    \  are the three at ~16s. There is no cheap win.\n\n## Impact\n\nA standing red\
    \ bar on a blocking pre-push lane trains the bypass. Either the\nbudget is wrong\
    \ for the conditions it is measured under, or the standing set is\ngenuinely too\
    \ large — and the trigger says the repo already decided a third\nnumber is not\
    \ the answer.\n\n## Weak direction (non-binding)\n\nTwo candidate shapes, both\
    \ deliberately NOT a relevel:\n\n- Measure the label under the conditions the\
    \ budget describes. The in-gate figure\n  is a contended one and the budget was\
    \ derived from contended samples at a\n  different moment, so the bar measures\
    \ host load as much as suite growth. A\n  budget keyed to an isolated measurement,\
    \ or a contention-normalized one, would\n  mean what it says.\n- Shrink the standing\
    \ set. The three ~16s tests each drive a real subprocess\n  workflow; moving that\
    \ class behind a `release_only`-style marker (or a\n  slower-lane label) would\
    \ cut the tail without deleting the proof.\n\nWhichever is chosen, the trigger's\
    \ own instruction is that the answer is\nprofiling or scope, not a third ceiling.\n"
