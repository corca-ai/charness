  body: "## Structural pattern\n\nA check exists, its tests pass, and it never runs\
    \ on the path the caller uses. The\ntests exercise the function DIRECTLY; the\
    \ wired path never reaches the code. So the\nsuite is green, the reviewer reading\
    \ the module finds it correct, and the check is\ninert in production.\n\nThis\
    \ is distinct from \"the check is wrong\". The check is usually right. What is\n\
    missing is any signal that it is *reachable* from the surface an operator invokes.\n\
    \n## Triggering instances\n\nSix in one goal (2026-08-10, `re-verify-the-backlog-and-retire-the-unchosen-constraint`):\n\
    \n1. **`consolidated` classification** — added to `KNOWN_CLASSIFICATIONS` and\
    \ a ledger\n   table while `issue_verify_closeout.CLASSIFICATIONS`, the `issue_tool`\
    \ argparse\n   choices, the draft validator's second copy, and the commit-message\
    \ regex all\n   still refused it. The commit hook's `_infer_classification` then\
    \ fell through to\n   `bug`, demanding exactly the repair claims the disposition\
    \ exists to forbid.\n2. **The four consolidation readbacks** — wired into `verify_closeout`\
    \ but NOT into\n   `close-with-comment`, which is the one carrier a consolidated\
    \ close is REQUIRED\n   to use.\n3. **`REQUIRED_CLOSE_REASON`** — declared by\
    \ the module that owns the disposition\n   and read by nobody, so closes would\
    \ have landed publicly as `completed`.\n4. **The self-reference check** — `evaluate`\
    \ defaulted `self_number` to `None` and\n   guarded on `is not None`, so it fired\
    \ only in the module's own direct-call test.\n5. **`release_surface_tokens`**\
    \ — comment told consumers to declare bespoke release\n   surfaces, the resolver\
    \ read them, the tests exercised the library function, and\n   the only production\
    \ caller passed no `repo_root`. Advertised and dead.\n6. **Two more stale classification\
    \ vocabularies** in the `release` skill, found only\n   because a release was\
    \ being cut.\n\nEvery one was caught by a bounded review round or an ad-hoc probe.\
    \ **None was\ncaught by the test suite**, because in each case a green test existed\
    \ for the very\ncode that never ran.\n\n## Why this is worth a structural guard\n\
    \nThe repair applied each time was local — add a test that goes through the wired\n\
    surface. That works and does not generalise: the next check will ship the same\
    \ way,\nbecause nothing asks \"is this reachable?\" at the moment it is added.\n\
    \nNote the changed-line mutation gate did not catch these either. It measures\
    \ whether\na changed line is COVERED, and these lines were covered — by the direct-call\
    \ test.\nCoverage and reachability-from-the-caller are different questions.\n\n\
    ## Suggested direction (not a decision)\n\nOptions, roughly cheapest first:\n\n\
    1. **A vocabulary-parity check.** Several instances are one shape: a value added\
    \ to\n   one enumeration and not its siblings. A gate asserting that the classification\n\
    \   vocabularies agree across their copies would have caught 1 and 6, and is\n\
    \   mechanical.\n2. **A reachability advisory on new proof surfaces.** The repo\
    \ already has a\n   new-proof-surface advisory that fires on added files in proof-surface\
    \ families.\n   It could additionally ask whether any test reaches the new code\
    \ through a\n   production entry point rather than by loading the module directly.\n\
    3. **Nothing, and rely on bounded review.** Defensible — review caught all six.\
    \ But\n   review is per-slice and expensive, and this pattern recurred within\
    \ a single goal\n   after being named twice.\n\n## Non-claims\n\nNo consumer repo\
    \ inspected. I have not measured how often this shape occurs outside\nthe one\
    \ goal that produced these six, so \"recurs\" is established within that window\n\
    and not beyond it. Option 1 is the only one I would call clearly cheap; 2 may\n\
    over-fire and I have not prototyped it.\n\nAI-provenance: authored by an agent\
    \ session, from that goal's retro Sibling Search.\n"
