    body: '## 2026-08-13 disposition: deferred work; issue remains open


      I re-read the issue and tested its named current candidate rather than adding
      a detector from the historical examples.


      `verify_consolidation()` is test-only, but it is a superseded helper rather
      than an inert production check. Both actual consolidated-close consumers call
      the equivalent `readbacks_for_closeout()` loop: `issue_close.py` before its
      irreversible comment/close boundary and `issue_verify_closeout.py` when rendering
      the closeout verdict. `python3 -m pytest tests/quality_gates/test_issue_consolidation_readback.py
      -q` passed 28 tests, including the wired-loop fetch-failure/refusal path.


      The prior vocabulary-parity probe still has zero divergences, and a name-reference
      reachability heuristic has known dynamic-call/comment/subprocess false classifications.
      There is therefore no current reproducer to justify a generic guard; implementing
      one now would be speculative feature work, not a repair.


      Revisit trigger: a newly named production entry point whose direct-call test
      passes while its operator path demonstrably bypasses the check. The next slice
      should add a wired-path regression at that concrete entry point and then re-evaluate
      whether an abstraction is warranted.


      Fresh-eye review independently agreed: no live defect in the inspected closeout
      paths; no claim is made about external-host-only paths. Debug record: `charness-artifacts/debug/2026-08-13-debug-review.md`.


      AI-provenance: authored by an agent session.'
