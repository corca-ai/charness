    body: '## Measured: both cheap candidate guards have near-zero current findings


      Probing before designing, because the last two attempts in this family were
      built

      first and probed after. Two of the three options in this issue were measured
      today.


      **Option 1, vocabulary-parity: 0 divergences right now.** All six classifications

      (`bug`, `feature`, `deferred-work`, `question`, `decision-needed`, `consolidated`)

      are present in every carrier that enumerates them — `issue_verify_closeout.CLASSIFICATIONS`,

      `issue_closeout_classification_ledger.CLASSIFICATION_FIELDS`,

      `check_issue_closeout_commit_msg`''s regex, `release_issue_closeout_message`,
      and

      `publish_release_cli`. The two instances this option was ranked to cover (#1
      and #6 in

      the list above) are both already repaired, so a parity gate built today would
      ship with

      nothing to catch.


      **The adjacent "advertised and dead" signal: 9 across the whole tree.** Across
      704

      production Python files and 5,493 top-level functions, exactly **9** functions
      are

      referenced by `tests/` and by no other production code:


      ```

      scripts/critique_adapter_lib.py:280            adapter_has_sections

      scripts/quality_adapter_lib.py:317             is_deliberately_absent

      scripts/proof_semantics_adapter_lib.py:302     acceptance_classes

      scripts/prompt_mutant_lib.py:184               mutant_ref_name

      scripts/check_markdown_inline_code.py:49       find_wrapped_inline_code

      skills/shared/scripts/run_plan_envelope.py:172 build_linear_envelope

      skills/public/quality/scripts/run_dead_code_advisory.py:100  _dataclass_field_locations

      skills/public/quality/scripts/surface_marker_lib.py:139      module_release_only_files

      skills/public/issue/scripts/issue_consolidation_readback.py:158 verify_consolidation

      ```


      0.16% of the surface. I read the most suspicious one end to end —

      `verify_consolidation`, in the very module instance #2 of this issue already
      repaired

      once. Its docstring promises that a raising `fetch` is reported as a readback
      that did

      not run. No production caller uses it: the wired path is `readbacks_for_closeout`.

      **But that path carries the equivalent guard** (`:216-220` catches, sets `payload
      =

      None`, and lets `evaluate_destination` report the problems). So it is a superseded

      helper, not an inert check — a maintenance trap, not a live defect.


      ## What this changes about the guard question


      The six instances in the triggering goal were not one shape. Only two were "a
      value in

      one enumeration and not its siblings". The others were reachability conditions
      a

      name-reference scan cannot see: a `self_number=None` default that made a check
      fire

      only in its own direct-call test, a production caller that passed no `repo_root`,
      and

      readbacks wired into one carrier but not the one the disposition requires. Neither

      cheap guard detects any of those.


      So both cheap options are **regression guards with no current finding**. That
      is not an

      argument against building one, but it is exactly the condition under which a
      constant or

      a heuristic gets fitted to its own test fixtures — the failure this repo recorded
      twice

      in the goal that filed this issue.


      Meanwhile option 3 ("rely on bounded review") gained evidence rather than losing
      it.

      Every one of the six was caught by a bounded round or an ad-hoc probe. Two more
      were

      found and repaired today, in #572''s slice — `check_docs_graph.py`''s exit-code
      mapping

      and its only external-tool invocation, both green under direct-call tests and
      never run

      on the wired path — and both were found by reading, not by a gate. The count
      keeps

      going up and the detector keeps being the same one.


      ## Non-claims


      The 9-function scan is a token-reference approximation: a function reached only
      through

      `getattr`, a dispatch table keyed by string, or a subprocess entry point would
      be

      miscounted, and one referenced anywhere in production by name — including in
      a comment

      — is counted as reached. It says nothing about whether a referenced function
      is reached

      on the path an operator actually invokes, which is this issue''s real question.
      No

      consumer repo was inspected. The vocabulary probe covers the closeout classification

      vocabulary only, not the other enumerations in the tree.


      AI-provenance: authored by an agent session.

      '
