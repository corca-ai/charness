    body: '## 2026-08-13 closeout review: held back from the cohort carrier (issue
      remains OPEN)


      This umbrella was staged for the final direct-to-default closeout carrier and
      then

      pulled, on the cohort ledger''s own rule rather than on new evidence.


      The execution ledger''s **Umbrella Closure Contract** states that an umbrella
      may

      close only after every enumerated cited item is `proven` or `not-applicable`,
      and

      that it stays open while any cited child is `premise-needed`, `unproven-defer`,
      or

      `split`. This row''s own recorded disposition is:


      > local proof — SessionStart routing plus #532''s representative quality/handoff

      > planner read-cost slice are proven; **broader planner rollout remains a

      > deliberate widening follow-up**.


      A deliberate widening follow-up is not `proven` and not `not-applicable`. The

      `local proof` label was accurate about what shipped and was mistaken as closure

      eligibility when this batch was first assembled; the umbrella contract is the

      stricter rule and it governs.


      What is genuinely proven and not in question: the SessionStart configured-artifact

      routing, and the #532 successor slice measuring representative quality and handoff

      planner read costs under both source and shipped-plugin layouts, with two fresh-eye

      rounds recorded in

      `charness-artifacts/critique/2026-08-13-issue-584-planner-read-cost-resolution.md`.


      ### Disposition


      `split` / partial. Owner: the run-plan envelope and planner surfaces.


      Revisit trigger: either the debug, retro, issue, and gather planner rollout
      lands

      and every enumerated cited item reaches `proven`, or the remaining rollout is

      recorded as an independently owned work item and explicitly dispositioned

      `not-applicable` to this umbrella — at which point the umbrella contract is

      satisfied and this can close.


      No push, release, or issue closure is claimed by this comment.


      AI-provenance: authored by an agent session.

