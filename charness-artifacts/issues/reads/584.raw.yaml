    body: '## 2026-08-12 tracker disposition: split, still open


      The umbrella was re-read after the current local commits. It remains **OPEN**
      and no close is claimed.


      - SessionStart routing is locally repaired in `e3822458`: configured adapter/artifact
      lookup now discovers the repository root from nested `cwd`, preserves the no-`cwd`
      portable fallback, and has source-plus-plugin regression coverage. This is local
      behavioral evidence only until final push/readback.

      - The former #532 remains unimplemented despite its `CLOSED / NOT_PLANNED` state.
      Its live successor contract is `charness-artifacts/spec/planner-required-read-cost-contract.md`,
      whose implementation status is not started. A closed consolidation does not
      prove the read-cost defect fixed.


      Disposition: **split**. Owner: the SessionStart routing and planner-envelope
      boundaries. Revisit/close condition: implement the planner read-cost contract,
      prove it through its actual planner consumers, publish its tracker-visible disposition,
      then perform final GitHub readback for the SessionStart repair. Until then,
      this umbrella is not closable.


      AI-provenance: authored by an agent session.'
