    body: "## One of this issue's three options is now refuted, by measurement\n\n\
      I built the cheapest option — fail the gate when a budgeted label has no sample\
      \ —\nput it to a bounded fresh-eye review, got HOLD, confirmed the decisive\
      \ finding by\nrunning a probe, and **reverted it**. This issue stays open. What\
      \ it has now that\nit did not is a refuted option with a reason, rather than\
      \ three untested guesses.\n\n### What was built\n\n`unenforceable_budgets`:\
      \ budgeted labels no profile has ever sampled, exiting 1,\nwith `missing_samples`\
      \ keeping its warning meaning. The discriminator between \"dead\nlabel\" and\
      \ \"fresh machine\" was: has the SELECTED profile sampled anything else.\n\n\
      ### Why it does not work\n\n**It hard-fails a fresh machine's first run, which\
      \ is the outcome this issue\nexplicitly warns against.** `check-runtime-budget`\
      \ is queued second-to-last in\n`run-quality.sh`, and samples are written to\
      \ `runtime-signals.json` as the run\nproceeds. So by the time the gate executes,\
      \ the profile HAS sampled ~80 labels —\nthe guard reads \"this machine has run\"\
      \ — while the history is still partial for\nthis very run.\n\nMeasured against\
      \ this repo's own 36-CPU budget block, with every label seeded\nexcept `run-quality-read-only`\
      \ (which `print_final_summary` records *after* this\ngate):\n\n```\nexit: 1\n\
      unenforceable runtime budget: run-quality-read-only is budgeted but no profile\
      \ has\never recorded a sample for it, so the bar can never be exceeded and can\
      \ never fail.\n```\n\n**And six labels in this repo's own adapter are legitimately\
      \ conditional.**\n`run-quality-read-only-release`, `run-quality-full-release`,\
      \ `pytest-release`\n(release path), `dead-code-advisory` (opt-in), `check-coverage`\
      \ and\n`run-quality-full` (mode-gated). A second maintainer box reporting the\
      \ same profile\nid and running only pre-push read-only would fail permanently\
      \ on those, with a\nmessage telling the operator to delete budgets that are\
      \ correct — and\n`CHARNESS_QUALITY_LABELS` is an allowlist, so the only escape\
      \ is `--no-verify`.\n\n### Why I reverted instead of iterating\n\nThese are\
      \ not implementation bugs. They say the chosen discriminator is wrong:\n**sample\
      \ history cannot distinguish a dead label from an unexercised run mode**,\n\
      because that information is not in the signals file. No amount of guarding fixes\n\
      that.\n\n### What would work, now specified rather than guessed\n\n- Classify\
      \ against the runner's **declared gate inventory** rather than the\n  recorded\
      \ sample window.\n- Add an adapter-declared exemption for conditional labels\
      \ (release-path,\n  env-gated, mode-gated).\n- Ship an operator escape matching\
      \ the existing `CHARNESS_SEED_FIXTURE_ADVISORY`\n  precedent — this repo already\
      \ has prose for the sibling case: \"a gate whose\n  remediation names a flag\
      \ the operator cannot pass is a gate that lies at the\n  moment it blocks.\"\
      \n\nFull record, including three further defects found (a timing-log fallback\
      \ that\nbreaks the discriminator, a crash on a malformed profile entry, and\
      \ two tests that\npassed through the wrong branch):\n`charness-artifacts/critique/2026-08-10-issue-546-unenforceable-budget-critique.md`.\n\
      \n### Non-claims\n\nThe defect this issue reports is REAL and unfixed — a budget\
      \ nothing queues is zero\nprotection wearing the word WARN. Nothing here weakens\
      \ that. I did not build the\ndeclared-inventory approach, and I did not verify\
      \ it would work; it is the\nreviewer's recommendation, not a tested design.\n\
      \nAI-provenance: authored by an agent session.\n"
