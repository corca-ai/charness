    body: '## 2026-08-12 goal recheck: narrowed live residue remains open


      Re-read the issue and all three prior comments, then re-ran the repository-owned
      reader on the current tree:


      - `check_runtime_budget_universe.py --json`: armed, 37 budgeted labels reconciled
      against 102 runner labels, `unknown_labels: []`.

      - Selected `check-runtime-budget-universe` quality lane: pass (81ms).

      - Current selected profile: 27 budgets, zero missing samples and violations;
      the one latest-only spike is now explicitly advisory under #595 rather than
      a hidden verdict path.


      This confirms the shipped membership repair covers renamed/retired/typoed labels
      without the false-red behavior that invalidated the history-based design. It
      does **not** solve the remaining intentional boundary: a label that is declared
      and conditionally queued but never runs still needs adapter-declared execution
      expectation/owner intent. Consumer repos also remain outside this repository-only
      reader.


      Disposition: **unproven-defer** for the conditional/consumer half; owner is
      the quality adapter/runtime contract. Revisit when an adapter-declared conditional-label
      schema (including consumer runner inventory) is specified, or a live named-but-never-run
      counterexample is measured. This issue is not closed by the current recheck.


      AI-provenance: authored by an agent session.'
