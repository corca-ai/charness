    body: '## Shipped: the rename half. This issue stays open for the other two.


      The design that reached implementation is not the one this issue''s comments
      discuss.

      Sample history was refused again — for the reason the [revert

      critique](https://github.com/corca-ai/charness/blob/main/charness-artifacts/critique/2026-08-10-issue-546-unenforceable-budget-critique.md)

      established: it cannot distinguish a dead label from an unexercised run mode.
      Instead

      the reconciliation now asks a question that needs no history at all: **does

      `run-quality.sh` still know this budgeted label''s name?**


      `scripts/quality_label_universe.py` derives the label set from three sources
      — `queue_*`

      call sites with literal labels (dispatcher bodies excluded), the four COMPUTED

      `run-quality-<mode>[-release]` aggregate labels, and adapter `startup_probes`
      with

      `class: standing`. `scripts/check_runtime_budget_universe.py` refuses a budgeted
      label

      outside it, across the **union of all four budget blocks** — `profile_budgets`
      returns

      exactly one block per run, so a single-profile reader never reaches the aarch64
      block

      the adapter itself records as never sampled.


      **Neither defect that killed the previous attempt can recur.** Membership reads
      no

      history, so a fresh machine''s first run answers identically to one with a year
      of

      samples. And a conditional label is in the runner''s text whether or not its
      condition

      held, so the six legitimately conditional labels are unaffected. Measured before

      arming: all 38 budgeted labels across all four blocks resolve, so this refuses
      nothing

      that previously passed.


      ## What is still unfixed, which is most of this issue


      This issue''s body names three rot modes. **The gate decides one.**


      A label the runner still names but never RUNS — conditionally queued, or moved
      behind

      an opt-in — is in the universe and passes. `dead-code-advisory` is the live
      in-repo

      instance: budgeted at 12500ms, queued only under `CHARNESS_QUALITY_DEAD_CODE=1`,
      never

      sampled in an ordinary run, and **the new gate reports it green**. That is stated
      in

      the gate''s own pass line, its docstring, and the test module docstring, so
      nobody

      reads the green as coverage.


      Deciding that half needs an adapter-declared expectation — a `conditional:`
      marker

      naming the condition — because the runner does not have the information either:
      it

      lives in operator intent. The new reader makes such a marker *verifiable* rather
      than

      an unchecked annotation, which is why this order was chosen, but it does not
      replace

      it.


      ## Also changed


      `check_timing_layer_completeness` now consumes the same reader instead of its
      own

      `queue_selected`-only regex. It was under-counting: three gates reaching the
      queue

      through `queue_timed` and `queue_agent_browser_runtime_gate` had never been
      required

      to carry a timing verdict, so an exhaustiveness gate was not exhaustive.


      Filed rather than folded in: #595 — `latest_spikes` and `runtime_visibility_findings`

      are computed, rendered, and read by no exit path. Same class as this issue,
      same file.


      ## Non-claims


      Consumer repos are NOT covered and still carry this defect. `check_runtime_budget.py`

      is installed into repos with no `run-quality.sh`, whose label universe is whatever

      their own runner declares; the new gate lives in `scripts/` and is deliberately
      not

      part of the installed quality skill, because shipping a reader that only understands

      this runner would either refuse every consumer budget or no-op silently.


      Two bounded review rounds ran, and the round reading the repairs found a different

      class than the round reading the design — including that the first round''s
      own repair

      shipped a documented fail-open branch that was dead code, so the real behavior
      was

      fail-closed with a wrong remedy. Both repaired; round-2 repairs are recorded
      as

      accepted-unreviewed per the two-round cap. Record:

      `charness-artifacts/critique/2026-08-10-issue-546-label-universe-implementation-critique.md`.


      Not yet pushed. `pytest tests/quality_gates` is 5817 passed locally.


      AI-provenance: authored by an agent session.

      '
