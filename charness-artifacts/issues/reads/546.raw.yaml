    body: '## 2026-08-09 measured disposition: re-scoped, no gate change


      Current profile `local-linux-x86_64-36cpu` reports 28 configured budgets, `missing_samples:
      []`, `violations: []`, exit 0. An independent reviewer re-ran both detail and
      summary and confirmed the count.


      The active goal set the decision boundary before implementation: if the current
      count is zero, arming a new failure on plain absence is unproven and would primarily
      punish fresh machines/profiles. That condition fired, so this slice makes **no
      runtime-budget gate change**.


      This does not refute the mechanism: synthetic tests still prove a declared budget
      with no sample renders WARN and exits 0. The zero is scoped to this machine/profile/time;
      another profile or future label drift may reproduce it. Re-scoped outcome: retain
      the issue as the measured future counterexample, but do not turn absence into
      a blocker without a real current population or a staleness/queue-membership
      predicate.'
