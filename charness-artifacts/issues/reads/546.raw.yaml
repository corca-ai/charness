  body: '## Observed


    A budgeted runtime label that never gets a sample in the selected profile is

    reported as a WARN and the gate exits 0. The bar is real, committed, and

    unenforceable, and nothing ever says so louder than a warning line that scrolls

    past inside an ~85-gate run.


    `skills/public/quality/scripts/runtime_budget_lib.py`: `_checked_entry` returns

    `status="no-sample"`, which is collected into `missing_samples` and rendered as

    `WARN  <label>: no sample yet (budget <n>ms)`.


    `skills/public/quality/scripts/check_runtime_budget.py`: `main` returns nonzero

    only for `profile_config_errors` and `violations`. `missing_samples` is never

    consulted, so it cannot affect the exit code.


    `runtime_visibility_lib` does not cover this either: it fires only when the

    budgets dict is entirely empty, not when one declared bar has no sample.


    ## Why this matters


    The failure is silent and permanent. A label that is renamed, conditionally

    queued and then never queued, or moved behind an opt-in keeps its bar in the

    adapter forever. The bar reads as protection in review — someone deliberately

    sized it — while the gate has no way to fail on it. That is the exact shape the

    repo''s own design standard calls out: a declaration that no executable reader

    ever reconciles.


    Contrast the sibling case, which IS armed: a profile that has samples but no

    `budgets` block is a hard `profile_config_errors` block. The mirror case, a

    budget with no samples, is a warning. The asymmetry looks accidental rather than

    decided.


    ## Evidence path


    1. Add a budget for a label that is never queued in the selected profile.

    2. Run `python3 skills/public/quality/scripts/check_runtime_budget.py --repo-root
    .`.

    3. Observe `WARN ... no sample yet` and exit code 0.


    ## Impact


    Unknown-sized today: nobody can currently answer "how many committed bars are

    unenforceable on this machine" without reading the report by hand, because the

    gate does not count them. That number is itself the first thing worth measuring.


    ## Weak direction — non-binding


    Options rather than a decision: count `missing_samples` and report it as a number

    in the summary so it is at least legible; or fail when a bar has had no sample

    for N consecutive runs (staleness rather than absence, so a first run on a new

    machine is not blocked); or treat a bar for a label that the runner does not queue

    at all as a configuration error, which is a different and more tractable check

    than absence-of-sample. A refusal on plain absence would fire on every fresh

    machine and should probably be avoided.


    *Provenance: found by a delegated bounded review while resolving #544, which

    partitioned runtime samples by gate-set regime. Not introduced by that change
    and

    not fixable inside its scope; the regime work cannot drive a label into this state,

    because a regimed run means the label simply was not measured under the enforced

    regime.*

    '
