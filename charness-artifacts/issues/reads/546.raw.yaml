    body: '## A live instance, measured 2026-08-14


      The 2026-08-14 slice widened `check_documented_command_flags.py` from markdown-only

      to five carrier kinds. Measured cost, uncontended, same machine:


      | | wall | user CPU | parallelism |

      | --- | --- | --- | --- |

      | before (`git show HEAD:`) | 1.235s | 15.21s | 1415% |

      | after | 5.36s | 29.86s | 635% |


      **1.97x the CPU, and it parallelizes worse.**


      `check_runtime_budget.py` grades on the recent-sample median. The recorded samples

      for this label on `local-linux-x86_64-36cpu` are median 4823ms / max 5080ms
      —

      **all taken with the old gate**. Projected new contended median is roughly

      4823 x 1.97 = **~9.5s against the 9000ms bar** at `.agents/quality-adapter.yaml:427`.

      The `local-linux-x86_64-4cpu` profile is in the same position: bar 27000 at
      `:510`,

      recorded samples 14366-19073ms, projected ~28-38s.


      ## Why this is exactly this issue''s shape


      The gate exits **0 today**, and will keep exiting 0 until roughly half the

      20-sample window refills. So the run that INTRODUCES the regression passes,
      and a

      later unrelated run fails — with nothing in between saying the bar stopped

      describing the thing it guards.


      This is the mirror image of the `no-sample` case this issue reports: there,
      a bar

      with no sample reads as protection; here, a bar with only STALE samples reads
      as

      protection. Both are "the number on the bar is not currently constraining

      anything, and only a WARN-or-silence says so."


      A candidate signal, offered rather than proposed: a budgeted label whose recorded

      samples all predate the last change to the measured command is in the same

      epistemic state as a label with no samples at all.


      ## Not claimed


      Nothing was re-levelled and the gate was not touched. Re-level versus optimize
      is

      a `quality` routing decision under this repo''s own work-routing rule, not a

      unilateral bar edit.

      '
