    body: '## Additional evidence: the class is wider than the debug family


      Measured 2026-08-14 at local `HEAD` (`91be132a9`), running each family''s own

      scaffold with no arguments beyond `--repo-root .`. Three of the four artifact

      families return a destructive default against an already-existing target; only

      `critique` defaults safe:


      | family | `write_artifact_path` | `target_exists` | `write_artifact_effect`
      |

      | --- | --- | --- | --- |

      | debug | `charness-artifacts/debug/2026-08-14-lesson-presentation-lost-across-compaction.md`
      | true | `overwrite_existing_content` |

      | retro | `charness-artifacts/retro/2026-08-14-session-retro.md` | true | `overwrite_existing_content`
      |

      | quality | `charness-artifacts/quality/2026-08-14-quality-review.md` | true
      | `overwrite_existing_content` |

      | critique | `charness-artifacts/critique/2026-08-14-critique-review.md` | false
      | `create_new_file` |


      The `debug` row is this issue''s original observation, unchanged: that target''s

      body still carries `- Resolution: open` (line 129), so it is a live unfinished

      investigation and `_resolution()` still takes the continue-in-place branch.


      ### The retro instance (the third one this issue predicted)


      `skills/public/retro/scripts/scaffold_retro_artifact.py` points at

      `charness-artifacts/retro/2026-08-14-session-retro.md`, which carries the

      **previous** session''s `Lesson evaluation:` disposition — the line

      `check_lesson_evaluation_continuity.py` counts. Overwriting it does not just

      lose a record; it silently changes what the continuity gate measures.


      It was hit and worked around during the #625/#627/#626 slice: the author used

      `resolve_artifact_path.py --intent record` instead, and recorded the deferral
      in

      that session''s retro Sibling Search

      (`charness-artifacts/retro/2026-08-14-lesson-loop-625-627-626.md:114-126`).


      ### The quality instance, and why #620''s gate does not cover it


      `quality`''s scaffold no longer points at the *previous* review''s dated file
      —

      that specific defect from #620 is fixed. It now points at **today''s**

      `2026-08-14-quality-review.md`, which is `latest.md`''s current target, with

      `overwrite_existing_content`.


      This is precisely the gap this issue argued: #620''s date-coherence gate cannot

      catch any row in the table above, because an artifact overwritten on the day
      it

      was created carries today''s date under today''s filename and reads as coherent.

      So #620''s repair narrowed the quality family''s blast radius by one day and
      left

      the class intact in three families.


      ### Why `critique` is the useful comparison


      `critique` is in the same codebase, uses the same resolver, and defaults to

      `create_new_file`. It is an existence proof that the safe default is reachable

      without new machinery — which supports this issue''s "Expected behavior" of

      defaulting to a new dated record and making continue-in-place explicit, rather

      than the reverse.


      ### Not claimed


      No fix is proposed and nothing was edited. The four rows above are one

      observation each at one commit; they are not a claim about every invocation

      shape (a `--slug` argument, a resolved followup, or a repo with no existing

      same-day artifact will differ). No artifact was lost in producing them.


      AI-provenance: measured and written by an agent (Claude Opus 5) in a

      charness `issue` closeout run; commands were the four scaffolds'' own CLI output

      at `91be132a9`.

      '
