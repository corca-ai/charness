  body: "## Situation\n\n#620 established that `quality`'s scaffold returns the PREVIOUS\
    \ review's dated\nfile as its own `write_artifact_path`, and was fixed with a\
    \ date-coherence gate\nscoped to the quality family. The same producer defect\
    \ is live in the **debug**\nfamily, and there it can destroy an unrelated open\
    \ investigation.\n\n## Evidence\n\nObserved 2026-08-14 while preparing a debug\
    \ artifact for an unrelated cohort:\n\n```\n$ python3 skills/public/debug/scripts/scaffold_debug_artifact.py\
    \ --repo-root .\nwrite_artifact_path:          charness-artifacts/debug/2026-08-14-lesson-presentation-lost-across-compaction.md\n\
    write_artifact_role:          current_pointer_target\nwrite_artifact_target_exists:\
    \ true\nwrite_artifact_effect:        overwrite_existing_content\n```\n\nThat\
    \ target is a different, unfinished investigation — its own body carries\n`- Resolution:\
    \ open`, which is precisely why `_resolution()` takes the\ncontinue-in-place branch\
    \ (`scaffold_debug_artifact.py:182-190`). Following the\nscaffold's own `write_artifact_path`\
    \ would have overwritten it.\n\nThe correct fresh path is reachable and the resolver\
    \ already knows it:\n\n```\n$ python3 scripts/resolve_artifact_path.py --repo-root\
    \ . --skill-id debug \\\n    --slug <new-slug> --intent record\nrecord_artifact_path\
    \  = charness-artifacts/debug/2026-08-14-<new-slug>.md\nwrite_artifact_effect\
    \ = create_new_file\n```\n\n## Why this is not just #620 again\n\nFor debug, overwrite-in-place\
    \ is a legitimate contract when the author is\ngenuinely continuing the open investigation\
    \ the pointer names\n(`scaffold_artifact_lib.py:141`, `artifact_role: current_pointer`).\
    \ The defect is\nthat the scaffold cannot tell \"I am continuing THIS investigation\"\
    \ from \"I am\nstarting a new one\", and its default answer to the ambiguity is\
    \ the destructive\none. #620's date-coherence gate does not catch this: the overwriting\
    \ artifact\nwould carry today's date under today's filename and read as coherent.\n\
    \nDebug is also the family that solved the sibling problem correctly:\n`_resolved_followup_record_payload`\
    \ (`:227-237`) walks `followup`..`followup-4`\nand raises `SystemExit` rather\
    \ than overwrite. That mechanism exists for the\nRESOLVED case only.\n\n## Expected\
    \ behavior\n\nThe scaffold should require the author to state which investigation\
    \ they are in,\nor default to a new dated record and offer continue-in-place explicitly\
    \ — the\nsame asymmetry `_resolved_followup_record_payload` already applies one\
    \ branch\nover.\n\n## Not claimed\n\nNo fix is proposed, and no artifact was lost:\
    \ the fresh resolver path was used\ninstead. Whether the repair belongs in `_resolution()`,\
    \ in\n`current_pointer_write_path`, or in the scaffold's payload is a design call\
    \ this\nreport does not make. Note `current_pointer_write_path` is shared with\n\
    `plan_debug_run.py` and `resolve_artifact_path.py`, so changing its meaning\n\
    reaches three callers.\n"
