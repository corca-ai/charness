    name: Hwidong Bae
  body: '## Observation


    A consuming repo cannot find out that a packaged validator exists. Nothing tells
    it, so an unwired validator produces no signal at all — and the gap is filled
    by a hand-rolled substitute that then drifts away from the packaged contract.


    Measured in one consuming repo (`corca-ai/ceal`) today. Of the 12 packaged artifact/closeout
    validators, 5 are wired through `charness_public_wrapper` and 7 are not:


    | wired | unwired |

    | --- | --- |

    | `validate_critique_artifacts.py` | `validate_handoff_artifact.py` |

    | `validate_debug_artifact.py` | `validate_quality_artifact.py` |

    | `validate_ideation_artifact.py` | `validate_quality_closeout_contract.py` |

    | `validate_retro_artifact.py` | `validate_retro_handoff_wiring.py` |

    | `check_artifact_surface_preflight.py` | `check_closeout_classification_parity.py`
    |

    | | `check_closeout_floor_matrix.py` |

    | | `check_issue_closeout_commit_msg.py` |


    The pattern is not random: the repo wired the validators for artifacts it authors
    often and never noticed the handoff/quality/closeout family.


    ## What the silence cost


    `validate_handoff_artifact.py` was never wired, so a hand-rolled `scripts/check-handoff-artifact.ts`
    grew in its place with a raw 100-line cap. The packaged validator counts CONTENT
    lines and reads `max_content_lines` from `.agents/handoff-adapter.yaml`; its own
    comments record raw-line counting as the superseded approach, which "was measuring
    formatting and penalising long reference links while a diary of short lines cost
    nothing".


    So a session rewriting that repo''s handoff spent two passes trimming to satisfy
    a cap the upstream owner had already reasoned its way out of, while the validator
    that encodes the current thinking sat one wrapper away and unmentioned. The substitute
    also disagreed with the packaged authoring preflight the same repo DOES run (raw
    70), so one gate printed "Validated" for an artifact the other refused.


    ## Why this should not be solved per-repo


    Each consuming repo building its own "did we wire everything?" check means N implementations
    of a question only charness can answer, all of them stale the moment charness
    adds validator N+1. The consuming repo cannot enumerate what it does not know
    exists.


    ## Precedent inside charness


    `scripts/check_inventory_declaration_coverage.py` already solves this exact shape
    one level in, and its docstring states the problem in the same terms:


    > a new inventory could ship without ever appearing in the declaration, and the
    headline-only summary trap would re-open silently. This validator forces a conscious
    choice for every inventory: either declare `non_headline_fields` (>=2 distinct)
    or opt out with a non-empty `opt_out_reason`.


    The same instrument applied one level out would close this: a declaration surface
    listing the packaged validators a consuming repo has considered, where each entry
    is either wired or opted out with a reason, and a check that fails when a packaged
    validator appears in neither column. `doctor.py` may be the natural home for the
    reporting half.


    ## What would have caught it


    Any surface that makes an absent wiring say something. Today the absence is indistinguishable
    from a deliberate choice, which is why it survived long enough to grow a substitute.

    '
