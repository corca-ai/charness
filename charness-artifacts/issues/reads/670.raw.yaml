    body: 'Correction to the table above, which understates the problem and does so
      in a way worth recording, because I made the mistake this issue is about.


      I built that inventory by listing `plugins/charness/scripts/*.py` only. Packaged
      validators also live under `plugins/charness/skills/*/scripts/`, and I did not
      look there. Counting both locations there are ~125 `validate_*`/`check_*` scripts,
      against 13 wrapped in the consuming repo.


      I am deliberately NOT reporting "112 unwired" as the finding, because most of
      those are charness''s own self-checks (skills, packaging, mutation harness)
      and not consumer-facing. That is the point: **from the consuming side there
      is no way to tell the two apart.** The candidate set cannot be enumerated correctly
      by the repo that needs it — I demonstrated that on myself twice in one session,
      first by missing a whole directory and then by nearly reporting a number that
      treats charness''s internal gates as our missing wiring.


      A concrete second instance, found because the operator asked whether an unrelated
      repo-local check had been paying for this:


      - `skills/achieve/scripts/check_goal_artifact.py` is a packaged goal-artifact
      validator. It is not wired in the consuming repo.

      - That repo instead has its own `scripts/check-goal-status-drift.ts`, doing
      overlapping work with its own status vocabulary.

      - The two disagree on a detail neither side knows the other has: `goal_artifact_lib.read_status()`
      returns the status verbatim, while the repo-local check lowercases it before
      matching. Neither is wrong; they simply grew apart, which is what happens when
      the second one exists because nobody knew the first one did.


      So the ask stands and sharpens: the declaration surface needs to say not just
      *which* packaged validators exist, but which are **consumer-facing**. Without
      that axis, a repo attempting this audit either under-scans (missing a directory)
      or over-reports (treating internal gates as gaps), and both failures are silent.

      '
