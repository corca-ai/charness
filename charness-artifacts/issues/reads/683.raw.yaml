    "body": "## Situation\n\nThe shared-tree reviewer fingerprint flow supports writing a snapshot to a custom path with `snapshot --out <path>`. The command then prints that path under the key `out:`. The documented review workflow recommends using `--out` when the snapshot should live outside the reviewer-reachable tree.\n\n## Observed problem\n\nThe matching verify command does not accept `--snapshot <path>` or `--out <path>`; it requires the differently named `--before <path>`. The fresh-eye workflow documentation shows `verify` without this argument and does not connect a custom snapshot `--out` to verify's `--before`.\n\nReproduction:\n\n```sh\npython3 shared/scripts/reviewer_boundary_fingerprint.py snapshot \\\n  --repo-root /path/to/repo \\\n  --window-id example \\\n  --out /tmp/example.json\n\npython3 shared/scripts/reviewer_boundary_fingerprint.py verify \\\n  --repo-root /path/to/repo \\\n  --window-id example \\\n  --snapshot /tmp/example.json\n```\n\nThe second command exits 2 with `unrecognized arguments: --snapshot ...`. `verify --help` reveals the required spelling is `--before /tmp/example.json`; using that spelling succeeds.\n\n## Impact\n\nThis failure occurs exactly at the reviewer-return boundary, where the parent must verify the shared tree before doing more work. The asymmetric option names make a likely caller guess fail and can delay or skip the integrity check. The printed `out:` key does not expose the verify-side name, so the failure recurs across sessions instead of being recoverable from the snapshot payload alone.\n\n## Evidence\n\n- Skill contract: `shared/references/fresh-eye-subagent-review.md`, parent-side integrity proof and custom `--out` guidance.\n- CLI parser: `shared/scripts/reviewer_boundary_fingerprint.py`, snapshot `--out` versus verify `--before`.\n- Duplicate search on 2026-08-20: no matching issue among 200 open/closed `corca-ai/charness` issues for `reviewer boundary fingerprint before out snapshot verify`.\n\n## Desired outcome\n\nMake the custom snapshot handoff self-describing and symmetric enough that the documented command can be copied without guessing. For example, document the exact `verify --before <out>` continuation and/or emit a ready-to-run verify command; an alias is optional. Preserve the current fail-closed window-id check.\n\n## Non-claims\n\n- No reviewer boundary violation occurred; verification succeeded after using `--before`.\n- This issue does not request weakening fingerprint scope or allowing implicit latest-snapshot selection.\n",
