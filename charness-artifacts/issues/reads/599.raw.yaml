    body: '**Scope widened by operator ruling 2026-08-11: concept-vocabulary renames
      belong here.**


      The #598 ruling deletes `domain_language_contract` as a capability. Its vocabulary
      arm had two halves, and only one is being replaced by derivation:


      - **CLI names** — replaced by a derived check that every documented `charness
      <subcommand>` resolves to a real subcommand. No hand-maintained list.

      - **Concept vocabulary** (`support skill` vs `support capability` vs `integration`)
      — routed **here**, not gated.


      The reason it is not a gate: `domain_language_contract` could only ever enforce
      answers you already had. It required you to declare, in advance, that three
      phrases are the same concept — which means it could never *discover* that they
      are. Two of charness''s three declared terms carried no `deprecated_aliases`
      at all, only advisory allowed-aliases, which is the shape of a question rather
      than a rule.


      Renaming a concept is the same job this issue already asks for: **show me everywhere
      this name appears so I can finish the rename.** A `consumers <symbol|path|key>`
      command serves it directly, and serves the discovery half that no declaration-based
      gate can reach. So the scope note is: the command should accept a bare phrase,
      not only a symbol or path, so a vocabulary rename is answerable the same way
      a symbol rename is.


      Full ruling: `charness-artifacts/spec/2026-08-11-six-operator-rulings.md`.'
