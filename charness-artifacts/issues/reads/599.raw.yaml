  body: "## Situation\n\nThere is no command in this repo that answers \"what reads\
    \ this?\" — given a symbol, a file\npath, or a config key, print every reference\
    \ outside the target's own tests and its\n`plugins/charness/**` mirror.\n\n##\
    \ Experience\n\nOver one session, **seven removal-or-keep proposals were wrong**,\
    \ and every one was\nanswerable by a single grep that was never run:\n\n- six\
    \ proposed deletions, each refuted by a file the proposer had not opened\n  (`recount_residue_lib.py:63-67`,\
    \ `dup_ratchet_lib.py:305`,\n  `boundary_bypass_ratchet_lib.py:132-139`, `docs/deferred-decisions.md:685-703`,\n\
    \  `outcome-assertions.json`, `claim_fidelity_lib.py:390-403`);\n- one proposed\
    \ KEEP, defended on a claim three greps refute\n  (`claim_fidelity_lib.py:151`\
    \ resolves the substance judge per directory).\n\nThe reader searches that settled\
    \ them cost four bounded-reviewer spawns. The same session\nalso hit the inverse\
    \ trap: `listed_skill_ids` and\n`evals/cautilus/contract-effectiveness.fixture.json`\
    \ both look orphaned and are consumed —\none by an assertion (`scripts/eval_setup.py:220-224`),\
    \ one by a directory glob\n(`scripts/cautilus_scenarios_lib.py:46`). A plain `grep\
    \ <name>` finds neither.\n\n## Evidence\n\n`charness-artifacts/retro/2026-08-11-session-retro.md`\
    \ — `## Waste`, second bullet, and the\nEngelbart counterfactual. `charness-artifacts/spec/2026-08-10-umbrella-class-disposition-plan.md`\n\
    carries the per-item consumer greps that had to be run by hand afterward.\n\n\
    ## Impact\n\nThe structural pattern is one this repo already recorded about a\
    \ different method:\n*a method that requires re-reading a record has no tool,\
    \ so it degrades to memory*\n(`charness-artifacts/retro/recent-lessons.md`, on\
    \ backlog re-verification). The consumer\nsearch is that sentence about deletion.\
    \ Until it has a command, every deletion proposal\neither pays for it in reviewer\
    \ tokens or ships wrong.\n\n## Weak solution direction\n\nA `consumers <symbol|path|key>`\
    \ command that reports references grouped by kind — direct\nname reference, glob/directory\
    \ consumption, assertion-on-value, AST-scanned literal — and\nexcludes the target's\
    \ own tests and mirrors by default with a flag to include them. The\ngrouping\
    \ matters more than the search: three of this session's traps were consumers that\
    \ a\nname grep cannot see. Whether it belongs in `scripts/` or as a `quality`\
    \ inventory is open.\n\nA cheaper first step worth considering instead: make the\
    \ **removal proposal shape** carry\nthe search, so a proposal without a consumer\
    \ grep is refused by the artifact validator\nrather than by a reviewer. That fixes\
    \ the discipline without building the tool, and the two\nare not exclusive.\n"
