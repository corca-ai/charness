    body: '2026-08-13 premise re-read: existing scripts/removed_name_consumers.py
      is a narrow closeout advisory for deleted Python module-level names. It detects
      textual module.NAME/from-import candidates over Python files, but does not answer
      #599’s requested symbol/path/key/phrase query, directory/glob consumption, assertion-on-value
      readers, or source/plugin exclusion contract. Therefore it is not evidence that
      the issue is fixed and a generic consumers command is still a new capability
      decision. Disposition: unproven-defer pending a bounded query schema and false-positive
      policy. Owner: Charness quality/operator-discovery boundary. Revisit when a
      concrete removal/rename slice needs one of the unrepresented reader classes,
      or an operator approves the command’s result taxonomy. Issue remains OPEN.'
