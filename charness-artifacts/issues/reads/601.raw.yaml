    body: '2026-08-13 premise re-read: Charness already has an advisory inventory
      for one narrow related class (subprocess tests of import-safe entrypoints),
      but #601 proposes materially different signals: real-binary pure-render spawns,
      per-shard wall-clock skew, and comment-only harness invariants. The cited 226-spawn/63%-wall-clock
      evidence is a private sibling point-in-time measurement; no current Charness
      fixture, reader contract, or threshold establishes a safe generic detector.
      Treating static subprocess inventory as proof of those classes would be false
      precision. Disposition: unproven-defer. Owner: quality capability/measurement
      boundary. Revisit when an opt-in repo-owned timing/spawn inventory supplies
      a concrete producer plus representative fixture, or a Charness CLI harness reproduces
      a named class. Issue remains OPEN.'
