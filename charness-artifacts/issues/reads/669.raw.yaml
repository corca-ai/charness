    body: 'Second, distinct instance of the same class in the release lane, and this
      one is diagnosable rather than merely flaky.


      `tests/quality_gates/test_public_skill_yaml_output_contract.py::test_detail_yaml_is_structured[command4]`
      failed twice, on:


      ```

      command = (''skills/public/release/scripts/plan_release_run.py'', ''--repo-root'',
      ''.'')

      E   AssertionError: assert False

      E    +  where False = isinstance(None, dict)

      E    +    where None = yaml.safe_load('''')

      ```


      The stdout is **empty**, not malformed. The cause is visible when the same command
      is run directly under load:


      ```

      $ python3 skills/public/release/scripts/plan_release_run.py --repo-root .

      release run planner timed out after 10s

      ```


      The planner''s own CLI timeout fires, it writes the timeout line to stderr,
      and stdout stays empty. The contract test then reports "this command does not
      emit structured YAML", which is a true statement about the run and a false one
      about the command.


      Two separable problems:


      1. **The planner exceeds a 10s budget under contention.** It is read-only and
      does substantial work (release state, drift, evidence packets, staleness). Whether
      10s is the right number is a question; that it silently produces *nothing* usable
      when it is exceeded is the sharper one.

      2. **A timeout is indistinguishable from a malformed-output defect at the contract
      test''s assertion.** `assert isinstance(yaml.safe_load(detail.stdout), dict)`
      on empty stdout reports the wrong failure. The test asserts `detail.returncode
      != 2` already, so the returncode is available; a timeout could be named rather
      than mis-attributed.


      Both surfaced while trying to publish 6.2.0: four resume attempts, two blocked
      by this and one by the SIGTERM race above, all while an unrelated suite held
      the machine at load average ~17. The release lane is currently non-deterministic
      under load, and each attempt costs a full gate run.'
