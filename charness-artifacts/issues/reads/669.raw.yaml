  body: "## Situation\n\n`tests/quality_gates/test_standing_pytest_run_execution.py::test_a_wrapper_sigterm_reaps_the_real_child_tree`\n\
    failed inside a `run-quality.sh --release` lane, and its traceback shows a real\n\
    race rather than only a slow machine.\n\n## Experience\n\nThe test SIGTERMs the\
    \ standing-pytest wrapper and asserts the grandchild is reaped.\nIt failed with\
    \ the marker present — a survivor — and the captured stderr shows why:\n\n```\n\
    \  File \"/home/hwidong/codes/charness/scripts/subprocess_guard.py\", line 284,\
    \ in run_monitored_phase\n    with subprocess.Popen(\n  File \"/usr/lib/python3.10/subprocess.py\"\
    , line 1796, in _execute_child\n    self.pid = _posixsubprocess.fork_exec(\n \
    \ File \"/home/hwidong/codes/charness/scripts/standing_pytest_run_record.py\"\
    , line 73, in _raise\n    raise KeyboardInterrupt(f\"standing-pytest terminated\
    \ by signal {signum}\")\nKeyboardInterrupt: standing-pytest terminated by signal\
    \ 15\n```\n\nThe signal arrived *inside* `Popen.__init__`, after `fork_exec` had\
    \ already created\nthe child and before the parent bound `self.pid`. The handler\
    \ raised out of that\nwindow, so `run_monitored_phase` never obtained a pid to\
    \ reap and the child's\nprocess tree survived the wrapper.\n\n## Evidence\n\n\
    - The window is narrow and load-dependent: the test passes in isolation\n  (`1\
    \ passed in 5.04s`) and failed on worker `gw11` of a heavily parallel release\n\
    \  lane. It has passed in other release runs in the same session.\n- It is not\
    \ a false alarm about the assertion. The test's own comment records a\n  2026-08-15\
    \ probe: with `_terminate_reaps_the_child` disabled the assertion fails\n  and\
    \ with it in place it passes. Here the reaping code was in place and the\n  assertion\
    \ still failed, which is the new information.\n- Second, separate load-induced\
    \ failure in the same lane, recorded for context\n  rather than as the same defect:\n\
    \  `tests/quality_gates/test_public_skill_yaml_output_contract.py::test_detail_yaml_is_structured[command4]`,\n\
    \  which also passes in isolation.\n\n## Impact\n\nThe consequence is the one\
    \ the test's own message names: an enclosing guard's\ntimeout would orphan the\
    \ whole pytest run. In the gate this reads as a flaky\nrelease blocker; in the\
    \ failure mode it guards against, it is a real orphaned\nprocess tree.\n\nIt also\
    \ makes the release lane non-deterministic under load, which costs a full\ngate\
    \ run (~4 minutes) per retry and trains retrying rather than reading.\n\n## Weak\
    \ direction (non-binding)\n\nThe gap is between `fork_exec` returning and the\
    \ parent recording the pid.\nCandidates, both non-binding:\n\n- Block or defer\
    \ the terminating signals across the `Popen(...)` construction in\n  `run_monitored_phase`\
    \ and re-raise immediately after the pid is bound, so the\n  handler can never\
    \ fire in a window where the guard has a child it cannot name.\n- Or have the\
    \ handler cooperate: record \"termination requested\" and let the\n  monitored\
    \ phase notice it at its next checkpoint, rather than raising from\n  arbitrary\
    \ C-call boundaries.\n\nThe second is the more general fix — an exception raised\
    \ from a signal handler can\nland anywhere, and this is one window of that class\
    \ rather than the only one.\n"
