    body: "## Measured: the narrower proposed remedy fixes a defect that does not\
      \ exist\n\nThis issue's suggested direction says the mutation-coverage gate\
      \ reports \"the first\nblocking file's lines\" and that widening it \"may capture\
      \ most of the cost — 3 of the 5\niterations above were that one gate.\" Both\
      \ halves were tested today.\n\n**Read first.** `classify_changed_line_scope_gap`\
      \ iterates the whole\n`changed_before_coverage` set and collects every gap file\n\
      (`scripts/mutation_changed_files_lib.py:52-62`).\n`changed_line_scope_gap_targets`\
      \ returns, per file, the exact uncovered changed lines\nwith their source text\
      \ (`:83-97`). The gate then builds `blocking_detail` over the\nwhole `blocking`\
      \ list (`scripts/check_changed_line_mutation_coverage.py:387-391`).\nThere is\
      \ no first-file-only path.\n\n**Then measured, on a throwaway branch.** Uncovered\
      \ changed lines were planted in two\ndifferent pool files (`scripts/check_docs_graph.py`,\
      \ `scripts/evidence_boundary_crosswalk.py`),\ncommitted, and the real pre-push\
      \ lane run:\n\n- **Iteration 1** — 12.7s, exit 1. Reported `blocking: [both\
      \ files]`, and for each file\n  every uncovered line (5 and 5) with source text.\n\
      - **One repair pass** covering everything it listed — two tests, no production\
      \ edits.\n- **Iteration 2** — 9.1s, exit 0, `blocking: []`, `analyzed 2 / changed\
      \ 2`, \"clean --\n  every mapped changed pool file's changed lines are covered\"\
      .\n\nOne report, one repair pass, converged. The gate hands over a complete\
      \ work list.\n\n## So what did cost the 13 attempts\n\nThis issue's own account\
      \ already separates two things that the \"serialisation\" framing\nmerges. Iteration\
      \ #2 was \"a tooling gap that made the gate **wrong about the code**\" —\na\
      \ false blocker, which is a different defect from a gate that reports incompletely.\n\
      Iterations #4 (ruff on the tests written for #3) and any repair that edits production\n\
      code are a third thing again: **new work that could not have been reported before\
      \ the\nrepair existed**. You cannot lint code you have not written, and you\
      \ cannot measure the\ncoverage of lines you have not yet changed.\n\nThat part\
      \ is not reducible by an `--all-blockers` mode. It is reducible by running the\n\
      gates against the repair before pushing, which this repo already has in\n`scripts/run_slice_closeout.py`.\n\
      \n## What this issue should probably become\n\nEither narrowed to the false-blocker\
      \ half (what the iteration-#2 tooling gap actually\nwas, since \"the mapper\
      \ could not see new tests\" does not survive reading\n`run_standing_pytest.py:17-22,278-286`\
      \ — `tests/test_*.py` is a glob expanded at call\ntime, so a new top-level test\
      \ file is visible to target expansion), or closed and\nre-filed against whatever\
      \ the real recurring blocker turns out to be.\n\n## Non-claims\n\nThe experiment\
      \ covers ONE repair shape: adding tests to cover the lines the gate\nlisted.\
      \ It does NOT establish what happens when the repair edits production code in\
      \ a\npool file, which would introduce new changed lines and could genuinely\
      \ require a second\nreport. It does not reproduce the original 13-attempt session,\
      \ and it does not identify\nthe iteration-#2 tooling gap — only that one stated\
      \ explanation for it is refuted.\nTimings are from one machine (`local-linux-x86_64-36cpu`)\
      \ and are the gate alone, not\nthe ~95s full pre-push run.\n\nAI-provenance:\
      \ authored by an agent session.\n"
