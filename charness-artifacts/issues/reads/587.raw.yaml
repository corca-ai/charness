  body: "## RETARGETED 2026-08-10 — the original framing below is superseded\n\nThe\
    \ remedy this issue proposed was measured and refuted, and the diagnosis merged\
    \ three\ndifferent causes under one word. The measurement is in the\n[2026-08-10\
    \ comment](https://github.com/corca-ai/charness/issues/587#issuecomment-5235395842);\n\
    in short: the mutation-coverage gate already reports every blocking file and every\n\
    uncovered line in one run, and a planted two-file experiment converged in a single\n\
    repair pass (12.7s -> repair -> 9.1s clean).\n\n**The real remaining question,\
    \ and the only thing this issue now asks:**\n\n> Iteration #2 of the 13 was, in\
    \ this issue's own words, \"a tooling gap that made the\n> gate **wrong about\
    \ the code**.\" What was that gap?\n\nThat is a false blocker, which is a different\
    \ and more serious defect than a gate that\nreports serially — a gate that is\
    \ wrong about the code costs a repair that was never\nneeded. One stated explanation\
    \ for it does not survive reading: \"the mapper could not\nsee new tests\" is\
    \ refuted by `scripts/run_standing_pytest.py:17-22,278-286`, where\n`tests/test_*.py`\
    \ is a glob expanded at call time, so a new top-level test file IS\nvisible to\
    \ target expansion.\n\nAnswering this needs the original session's record, not\
    \ this tree.\n\n**What is NOT being asked any more:** an `--all-blockers` pre-push\
    \ mode, and widening\nthe mutation-coverage gate's per-file reporting. The first\
    \ addresses cost that is\nirreducible (a repair's own lint errors and its own\
    \ new changed lines cannot be\nreported before the repair exists); the second\
    \ fixes behavior that already works.\n\n**Why this stays open rather than closing:**\
    \ the measured cost — 13 push attempts, ~20\nminutes of one session — is real,\
    \ and closing would drop the signal along with the\nrefuted remedy.\n\n---\n\n\
    # Original report (superseded framing, preserved)\n\n## Observed\n\nThe COMMIT-time\
    \ gate aggregate surfaces every failing gate at once, and this repo's\nimplementation\
    \ discipline says why in prose:\n\n> if a commit *is* rejected by one of these\
    \ gates, run the aggregate to surface\n> **all** of them at once rather than fix-and-retry\
    \ one rejection at a time —\n> serial single-gate rejections after a green suite\
    \ are pure waste the aggregate\n> removes.\n\nThe PRE-PUSH path has no equivalent.\
    \ `run-quality.sh` reports a summary line\n(`85 passed, 2 failed (FAILED: ...)`),\
    \ which does name every failing label — but\nseveral of those gates emit findings\
    \ that are only actionable one repair at a time,\nand the loop is: fix one, re-run\
    \ the full ~95s gate, discover the next.\n\n## Measured cost, one session\n\n\
    Landing a single bundle took **13 push attempts**. The blockers arrived serially:\n\
    \n1. `check-runtime-budget` (a drifted bar)\n2. `check-changed-line-mutation-coverage`\
    \ (mapper could not see new tests)\n3. `check-changed-line-mutation-coverage`\
    \ again (real gaps, once the mapper worked)\n4. `ruff` (import ordering in the\
    \ tests written for #3)\n5. `check-changed-line-mutation-coverage` a third time\
    \ (one remaining branch)\n\nEach iteration paid the full pre-push run. Roughly\
    \ 20 minutes of the session was\ngate re-runs discovering one blocker at a time,\
    \ on a change whose broad suite had\nalready been green.\n\nNote #2 and #3 are\
    \ the same label reporting different causes, which is the sharpest\npart: the\
    \ first was a tooling gap that made the gate wrong about the code, the\nsecond\
    \ was the gate being right — and there was no way to see both at once.\n\n## Why\
    \ this is not just \"read the summary line\"\n\nThe summary DOES list all failing\
    \ labels. What it cannot do is tell you that fixing\nlabel A will reveal a second,\
    \ different failure in label A. `check-changed-line-mutation-coverage`\nrecomputes\
    \ its target set after each repair, so its next answer is not visible until\n\
    the previous one is fixed.\n\n## Suggested direction (not a decision)\n\n- A pre-push\
    \ `--all-blockers` mode that runs the failing gates' analysis to\n  completion\
    \ rather than stopping at the first actionable finding per label.\n- Or: for the\
    \ mutation-coverage gate specifically, report the FULL uncovered set for\n  every\
    \ changed pool file rather than the first blocking file's lines, so the\n  repair\
    \ can be done in one pass.\n\nThe second is narrower and may capture most of the\
    \ cost — 3 of the 5 iterations\nabove were that one gate.\n\n## Non-claims\n\n\
    The 13 attempts include two that failed for reasons unrelated to serialisation\
    \ (a\ngenuinely drifted budget, and a lint error I introduced while fixing the\
    \ previous\nblocker). A perfect aggregate would not have reduced this to one attempt\
    \ — I would\nestimate three or four. I have not measured whether other sessions\
    \ hit this shape;\nthis is one session's cost, recorded because it was unusually\
    \ visible.\n\nAI-provenance: authored by an agent session, from that session's\
    \ retro.\n\n"
