    body: '## New measurement, from a widened population


      The 2026-08-14 slice widened `check_documented_command_flags.py` past markdown
      to

      Python argv lists, adapter YAML, surface-manifest command strings, and tests.
      That

      is the strongest natural experiment available for this issue: it roughly

      quadrupled the invocation population without changing `subcommand_choices`.


      Instrumented the loop directly (counting entries and trims, rather than diffing

      report output, so a trim that produced an identical verdict would still be

      visible):


      ```

      TRIMBACK_INSTRUMENT invocations=1165 nonempty_paths=199 trims=0

      ```


      So the guard was reachable and evaluated **199 times** across five carrier kinds,

      and trimmed **zero** times. Report output with and without the loop is byte

      identical over this repo.


      ## What this does and does not settle


      It does not close this issue. The issue''s own standard is "find the live trigger

      and pin a test that fails without the loop, OR establish that the narrowed

      `subcommand_choices` makes a bogus descent impossible and remove the loop with

      that argument recorded." 0/199 is neither — it is a stronger negative than the

      original "I could not construct a trigger", not an impossibility argument.


      What it adds: the negative now holds over token sequences that were never authored

      as documentation (Python argv list elements, YAML command strings), which is
      where

      a bogus descent was most plausible if one existed.


      The loop was left untouched by that slice, deliberately.

      '
