    body: '## 2026-08-12 explicit disposition: unproven-defer


      The issue was re-read. The two guardian tests no longer reach the trim-back
      loop, and no live trigger or bounded impossibility proof has been established.
      Removing the loop would be a behavioral change without evidence that no valid
      command-help shape needs it; pinning a test would be equally artificial without
      a trigger.


      Disposition: **unproven-defer**. Owner: documented-command checker / docs author.
      Revisit trigger: either construct a real parser/help shape where a discovered
      choice makes `<script> <path> --help` fail and pin it, or prove from the narrowed
      `subcommand_choices` grammar that bogus descent is impossible and record the
      removal argument. This issue remains OPEN until one evidence path exists.


      AI-provenance: authored by an agent session.'
