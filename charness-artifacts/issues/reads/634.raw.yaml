    body: '## Partial progress, and the honest score: 2 of ~16 enumerated items


      Landed in `d2daec03f` (S6c of the 6.0.0 release scope). **This issue stays open.**


      ### What is repaired


      1. **The dependency contract now travels with the installer that reads it.**
      `packaging_lib.export_bootstrap_dependency_contract` ships `packaging/bootstrap-python.json`
      and `packaging/bootstrap-requirements.txt` into `plugins/charness/packaging/`,
      so `load_contract` no longer raises `missing bootstrap runtime contract` on
      a consumer machine. Only those two files — the rest of `packaging/` is release
      plumbing that means nothing to a consumer.

      2. **The documented `gather` entrypoint no longer raises bare.** `gather_public_url.py`
      guards its `import yaml` and names the pinned declaration plus how to install
      it into the interpreter actually running the script.


      ### What was built to catch instance four — and what it does NOT do


      `check_export_self_sufficiency.py` reads the **checked-in export** rather than
      re-running the exporter, which is the blindness this issue documented: the packaging
      validator''s oracle is the exporter, so anything the exporter omits is absent
      from both sides of its diff.


      It ships with **one arm refusing**, and both severities were decided by bounded
      review rather than staged:


      - **Blocking — availability, not declaration.** An unguarded third-party import
      in a script the export TELLS a consumer to run (named by an exported `SKILL.md`,
      reference, or adapter) is refused. The first build asked whether the export
      *declared* the package anywhere; shipping one requirements file satisfied that
      for the entire export at a stroke while dozens of bare imports kept raising
      the exact error reported here. Declaration is not availability. A requirements
      file installs nothing.

      - **Advisory — unshipped repo-root path literals.** Enumerated, not refused.
      Review falsified its classification in both directions: it excused a real gap
      the moment the slice shipped a `packaging/` directory, and it reported maintainer
      tools scanning an operator-supplied root, which is correct code. It cannot yet
      tell "reads its own tree" from "scans whatever tree the caller passed", and
      a release-blocking gate over a falsified classification would have made its
      own escape hatch routine.


      ### What this does NOT close, stated rather than implied away


      The detector reads Python `/`-chain literals and import statements. It cannot
      see a markdown or YAML instruction site, a shell gate, an `os.path.join`, or
      a wholly computed path. So from this issue''s own inventory:


      - **the 11 cwd-relative `python3 scripts/<x>.py` instruction sites**, two of
      which land in consumer adapter config — not repaired, and not detectable by
      what shipped

      - **the 3 unguarded shell gates** (`check-python-lint.sh`, `run-quality.sh`,
      `self-validate-install-update.sh`) — same

      - **`docs/public-skill-validation.json` / `docs/public-skill-dogfood.json` readers**
      — same

      - **the remaining bare third-party imports across the export** — real risk,
      reported as an inventory only


      An adversarial reviewer scored the slice at 2 of roughly 16 enumerated items.
      Closing on that would assert behaviour the tree does not have.

      '
