  body: '## What happened


    A session on another machine ran a charness tool, hit `ModuleNotFoundError: No
    module named ''yaml''`, went looking for a dependency declaration, concluded there
    was none in either the repo or the package, and installed PyYAML into the user
    site as a one-off — recording "does not reproduce on a new machine" as a residual
    risk.


    Half of that diagnosis is wrong, and the wrong half is the one that matters.


    ## What is actually true


    The REPO declares its Python dependencies, precisely:


    - `packaging/bootstrap-python.json` → `required_modules: ["jsonschema", "packaging",
    "yaml"]`, `runtime_dir: ".charness/bootstrap-python"`, `requirements_file: "packaging/bootstrap-requirements.txt"`

    - `packaging/bootstrap-requirements.txt` → `PyYAML>=6,<7`, `jsonschema>=4.18,<6`,
    `packaging>=24,<26`

    - `scripts/bootstrap_runtime.py` installs them into a repo-local runtime


    So there IS a reproducible path, and it is pinned.


    ## The defect


    The export does not ship it.


    - `plugins/charness/scripts/bootstrap_runtime.py` — the installer — **is** exported.

    - `packaging/bootstrap-python.json` and `packaging/bootstrap-requirements.txt`
    — the two files it reads — **are not**. There is no `plugins/charness/packaging/`
    directory at all.


    Measured:


    ```

    $ python3 -c "import pathlib; p=pathlib.Path(''plugins/charness''); print(list(p.rglob(''bootstrap-python.json'')),
    list(p.rglob(''bootstrap-requirements.txt'')))"

    [] []

    ```


    `load_contract` raises `missing bootstrap runtime contract` when that file is
    absent, so on a consuming repo the bootstrap path is dead on arrival. Meanwhile
    **37 exported scripts** do a bare `import yaml`:


    ```

    $ grep -rln "import yaml" plugins/charness/ --include=''*.py'' | wc -l

    37

    ```


    `scripts/yaml_output.py` degrades gracefully on the WRITE side (it falls back
    to compact JSON when PyYAML is absent), which is why this surfaces as a scattered
    read-side failure rather than one obvious one.


    ## Why it matters beyond one missing file


    This is the third instance of one class in this release:


    1. `check_docs_graph.py` shipped with a bar measured on charness''s own docs tree
    while the ratchet record and its test stayed unexported (fixed in S6).

    2. The `quality` skill exports the runtime-budget apparatus but not the fast standing
    runner, so a consumer inherits the ledger without the speed and nothing says so
    (recorded as S6b''s consumer half).

    3. This.


    The general shape: **an exported artifact depends on a repo-root file the export
    does not ship**, so it is broken or silently mis-calibrated for every consumer
    while working perfectly here. Nothing gates it — the sync tool copies what it
    is told to copy and never asks whether what it copied can run.


    ## Suggested scope (not a design)


    - Export the dependency contract alongside the installer, or make the installer
    degrade with a message that names what to install.

    - Give the class a detector, so instance four is caught by a gate rather than
    by a stranded session on another machine.


    Reported from a real consuming-machine failure; repo-side facts above are measured
    on `main` at 54654b032.'
