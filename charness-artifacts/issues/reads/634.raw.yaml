    body: '## Measured inventory — the class is systemic, and the gate that should
      catch it is blind by construction


      A read-only sweep of the whole export changes the scope of this issue. Three
      claims below are re-verified by hand, not taken from the sweep.


      ### 1. The reported crash has a documented-entrypoint instance


      `plugins/charness/skills/gather/scripts/gather_public_url.py:13` is a bare top-level
      `import yaml`, and that script is a documented entrypoint — `skills/gather/SKILL.md:51`
      tells a consumer to run it. So the failure the original report hit is reachable
      from the export''s own instructions, not only from internal tooling.


      Recount across the export, unguarded top-level imports of the three hard deps:


      ```

      yaml: 25 files   jsonschema: 8 files   packaging: 2 files

      ```


      Optional deps are handled correctly (`cosmic_ray`, `tomli`, `curl_cffi`, `patchright`,
      `pytest`, `xdist` are all guarded). The gap is specific to the three the bootstrap
      contract pins — the ones whose declaration does not ship.


      ### 2. Why every consumer path resolves wrong


      `scripts/runtime_bootstrap.py` `repo_root_from_script` returns `Path(script).resolve().parent.parent`.
      For `plugins/charness/scripts/x.py` that is **the plugin root**, not the consumer''s
      repo. So a default-`--repo-root` read in any exported script resolves against
      a tree with no `packaging/`, `docs/`, `tests/`, `evals/`, `.githooks/`, `charness-artifacts/`.


      `scripts/packaging_lib.py` `export_plugin_tree` copies `scripts/` wholesale
      with no filtering — 411 Python files, of which ~230 are named by no exported
      SKILL.md, reference, preset, profile, or manifest.


      ### 3. The gate that should have caught this is green *because of* the defect''s
      cause


      `scripts/validate_packaging_install_surface.py:143-174` re-runs `export_plugin_tree`
      into a tmpdir and diffs it against the checked-in tree:


      ```python

      expected_files = collect_files(generated_plugin_root)   # produced BY the exporter

      actual_files   = collect_files(plugin_root, ...)

      ```


      **Its oracle is the exporter itself.** Anything the exporter omits is absent
      from both sides, so the diff is empty. It is a fixed-point check on the generator,
      not a self-sufficiency check on the artifact. `check_staged_mirror_drift.py`,
      `validate_packaging_committed.py`, the pre-push hook, and the CI job all feed
      different snapshots into that same oracle and inherit the identical blind spot.


      The only completeness assertions that exist are four hand-typed `require_file`
      calls (`:108-119`), all Python modules, added reactively after specific breaks.
      No entry for a data file or a directory — so `packaging/bootstrap-python.json`
      is uncovered until someone types a fifth.


      Compounding: `tests/repo_copy.py` clones the whole repo including `packaging/`
      into fixtures, and `tests/charness_cli/test_bootstrap_runtime.py:32` explicitly
      `shutil.copy2`s `bootstrap-python.json` into its tmp repo. The test that would
      have caught this manufactures the dependency it should have proven absent.


      ### 4. The nearest-miss gate has the right shape and the wrong constant


      `scripts/check_export_safe_imports.py` is the only check that reasons about
      path literals in exported source, and its docstring frames this exact class.
      But `_forbidden_path_literal:123-124` accepts only `text == "skills/public"`
      or `text.startswith("skills/public/")`. It never generalizes to "any export-rooted
      literal whose first segment is not in the exporter''s shipped set."


      **Both building blocks for the missing check already exist and nothing joins
      them**: that AST walker (`_is_export_rooted`), and `export_plugin_tree`''s enumeration
      of what actually ships.


      ### 5. Other instances worth scoping with the fix


      - **11 instruction sites** tell a consumer to run `python3 scripts/<x>.py` cwd-relative,
      against the export''s own 100+ correct `"$SKILL_DIR/..."` convention. Two of
      the eleven are adapter `command:` values — i.e. they land in consumer config
      and persist.

      - **Shell-gate guard coverage is 6 of 9.** `check-markdown.sh`, `check-shell.sh`,
      `check-secrets.sh`, `check-links-internal.sh`, `check-links-external.sh`, `install-git-hooks.sh`
      refuse loudly outside the authoring repo (#618). `check-python-lint.sh`, `run-quality.sh`,
      and `self-validate-install-update.sh` do not — and `run-quality.sh` is what
      `skills/quality/references/catalog.yaml:130` points a consumer at.

      - `docs/public-skill-validation.json` and `docs/public-skill-dogfood.json` are
      read by exported validators and not exported — the same ratchet-record shape
      as instance 1.


      ### Explicitly FINE-BY-DESIGN, so the list is complete


      `.agents/*-adapter.yaml`, `charness-artifacts/**`, `docs/handoff.md`, `docs/roadmap.md`,
      `.charness/`, `skills/support/generated/`, and the `.github/workflows` readers
      are all **consumer-owned** — they are seeded or scanned at runtime, and shipping
      filled copies would overwrite consumer config. Relative markdown links inside
      the export measured clean: 0 broken. All three root `.py` shims ship byte-identical,
      and no exported module imports an unexported sibling.


      ### Correction to the original report


      Instance 1 (`check_docs_graph.py`) is **closed** as of `54654b032` — the exported
      gate defaults to 0 and reads charness''s bar from an unexported ratchet record.
      It stays listed here as evidence that the class recurs, not as open work.'
