    body: 'Local proof recorded at commit 28be0bf2 (GitHub #582 remains OPEN; this
      is not a closure claim). The live #525 residual is repaired narrowly: the existing
      README Proof Ledger Specdown reader now requires each exact Claim Ledger Evidence
      cell to contain existing, relative, path-backed Markdown references, and refuses
      empty, malformed, prose-only, escaping, fragment, or missing-target evidence.
      It does not claim semantic proof that a cited path supports the claim. Focused
      proof: 59 focused tests plus a full local Specdown run (4 specs, 8 cases); two
      bounded fresh-eye rounds ran, and the R2 final-consumer scope repair is accepted-unreviewed
      under the verdict-logic cap. Resolution critique: charness-artifacts/critique/2026-08-13-issue-582-readme-proof-evidence-binding-resolution.md.
      #524 taxonomy and #535 generic rebind remain separate deliberate non-implementations,
      so this umbrella stays OPEN pending their independently evidenced rulings and
      final cohort readback.'
