    body: '**Correction: this umbrella absorbed 3 of its 4 named members, not 4.**


      `#524`, `#525` and `#535` are closed as `not planned` and moved here. **`#514`
      is

      still OPEN and did not move.**


      Why: `#514` is protected by this repo''s evidence-boundary crosswalk, which
      refused

      the close with `matrix_incomplete` — "the crosswalk is in ''bootstrap'' state;
      the

      acceptance matrix that would evidence closing #514 does not exist yet". The
      gate

      covers exactly three issues (`#514`, `#515`, `#518`) and it is a deliberate

      protection, not an obstacle to route around. Building that acceptance matrix
      is

      real work and is not part of a consolidation.


      So `#514` stays in this umbrella''s description as a member of the FAMILY, and

      remains separately open as an issue. Whoever picks this up should treat it as

      in-scope for the shared gap and out-of-scope for "already consolidated".


      Recording it here rather than leaving the member list to imply otherwise: an

      umbrella that names four members while three moved is exactly the kind of record

      that reads as done and is not.

      '
