  body: '## What happened


    Five bounded critique rounds ran over one session''s slices (record: `charness-artifacts/critique/2026-08-17-session-release-record-retro-prefix.md`).
    The rounds produced exactly one durable critique artifact, written after round
    3. Rounds 4 and 5 could not read what rounds 1–3 had established versus merely
    asserted, and the session retro (`charness-artifacts/retro/2026-08-18-session-retro.md`,
    Expert Counterfactuals) records the measurable cost: rounds 3–5 each re-litigated
    the same renderer question because no round could see the previous round''s actual
    findings.


    ## Experience


    A reviewer round returns findings in-band to the parent and they die with the
    parent''s context. The critique artifact is written at closeout, from memory and
    transcript, in the author''s voice. The artifact''s own Fresh-Eye section labels
    its reviewer counts and boundary verdicts "unfalsifiable testimony" for exactly
    this reason — nothing in the tree corroborates them.


    ## Impact


    - Repeated review cost: later rounds re-derive earlier rounds'' established facts.

    - Unfalsifiable closeout claims: reviewer counts and per-round verdicts are transcribed,
    not cited.

    - The boundary-fingerprint window id exists per round but binds to nothing durable.


    ## Evidence


    - `charness-artifacts/critique/2026-08-17-session-release-record-retro-prefix.md`
    Fresh-Eye Satisfaction: "The reviewer runs left no durable record: no fingerprint
    snapshot is committed, no per-round findings artifact exists."

    - `charness-artifacts/retro/2026-08-18-session-retro.md` Next Improvements: "make
    a review round leave a durable artifact as it runs, not at closeout. Destination:
    `critique` skill, per-round findings file bound to the round''s boundary-fingerprint
    window id."


    ## Weak solution direction (optional)


    A per-round findings file (e.g. `charness-artifacts/critique/rounds/<date>-<window-id>.md`)
    written when the round''s findings return, bound to the reviewer_boundary_fingerprint
    window id, so round N+1 reads round N and the closeout artifact cites rather than
    transcribes. Shape and enforcement belong to the `critique` skill owner.


    AI-provenance: agent-authored (Claude Code session, 2026-08-18, operator bae.hwidong@corca.ai).

    '
