    body: '# Goal 805: Reduce long-term delegation overhead and measure consumer net
      value


      ## Problem and outcome


      Goal #798 exposed repeated closeout packaging, classification partitions and
      release verification; prior experiments did not compare plugin use against no
      plugin at both model tiers. Preserve intent, recovery and independent boundary
      proof while removing demonstrated redundant operations. Measure actual benefit
      and losses honestly.


      ## Approved contract and execution order


      The operator approved the six-item briefing and delegated finalization/execution
      including push, release, installation refresh and model comparison on 2026-09-06.
      Frozen planning: `charness-artifacts/goals/2026-09-06-long-term-delegation-net-value.md`.


      1. comparison-contract: frozen neutral four-arm cooperative-resume protocol.

      2. closeout-carrier: current multi-issue evidence and mixed classification.

      3. release-reuse: remove duplicate preparation-time subject execution; final-state
      verification remains current, without cross-commit cache claims.

      4. context-reuse: known-context reuse with missing/changed/uncertain routes
      preserved.

      5. consumer-comparison: high/low candidate versus no plugin, retained initial
      results.

      6. publish-closeout: integrate, publish once, observe installed behavior, close
      graph and retrospect.


      ## Readiness and completion


      Local readiness requires integrated changes, focused scenario/test proof and
      applicable independent review. Context-reuse may then start its downstream pilot;
      pilot and final publication remain required for final acceptance. Children remain
      open until their actual acceptance and published carrier are observed. Parent
      owns the sole execution cursor. No AGENTS.md/CLAUDE.md changes, #764 expansion,
      external repository creation or organization-wide writes. No milestone exists.


      ## Current frontier


      One integrated [v8.5.0 release](https://github.com/corca-ai/charness/releases/tag/v8.5.0)
      is published and installed. Separate public/installed observations bind the
      retained treatment inputs and composed mixed-bundle behavior. The five implementation
      children closed through 0eff83280, then publication child #807 through 7d0b10f06;
      all six exact provider-linked children are verified CLOSED with issue-owned
      behavior comments. No manual child-close fallback.


      The original high pair passes equal acceptance but the candidate costs 33.4
      percent more time; low pure-candidate attribution remains invalid. Spec intervention,
      incomplete report provenance, whole-install/fresh-session limits and closeout
      rework remain explicit. No general efficiency or total lifecycle saving is claimed.
      The A1-A6 audit is charness-artifacts/goal-runs/805/parent-terminal-obligation.md
      and the retrospective is charness-artifacts/retro/2026-09-06-session-retro-2.md.
      Next is the dedicated guarded parent close with the exact graph and hash-bound
      final proof index; terminal observation will distinguish completion from this
      readiness statement.


