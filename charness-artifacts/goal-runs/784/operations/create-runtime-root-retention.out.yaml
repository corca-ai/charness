  repo: corca-ai/charness
  title: 'runtime-root retention: finished lanes drop their worktrees, roots never
    nest, dead keys are swept'
  labels: []
  milestone: null
  body_bytes: 2983
  body_preview: '<!-- charness-work-item-key: runtime-root-retention -->


    ## Objective


    The per-repo runtime root owned by `scripts/runtime_bootstrap.py` stops nesting
    other repos'' runtime roots inside its own `xdg-cache`, `task run` stops keeping
    a finished lane''s worktree and runtime, and the tree gains a retention policy
    for its own subtrees and for top-level keys. Measured 2026-09-03: `charness/runtime/`
    1,871 keys, 340 GB. The installed plugin''s key holds 271 GB, of which 250 GB
    is the ceal repo''s `task-run/` (254 finished lanes, each a 1.4 GB worktree plus
    a 1.1 GB runtime beside a 60 KB `result.json`) and 16 GB this repo''s `task-run/`;
    this repo''s key holds 50 GB (`xdg-cache` 41 GB holding 23,401 nested fixture-repo
    keys; `pytest-tmp` 4.5 GB; `pycache` 2.4 GB; `coverage` 2.1 GB).


    ## Owned scope


    - `scripts/runtime_bootstrap.py::_runtime_root`: on a `CHARNESS_RUNTIME_REPO_KEY`
    mismatch, derive the base from the parent''s configured base (the parent of `charness/runtime/<key>`),
    not from the parent''s exported `XDG_CACHE_HOME`; regression test seeds the mismatch
    and asserts sibling keys. Grep tests for `xdg-cache` and `runtime_root(` first
    and name any live-tree assumption.

    - `scripts/task_run/'
