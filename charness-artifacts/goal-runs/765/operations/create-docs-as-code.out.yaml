  body_bytes: 2386
  body_preview: '<!-- charness-work-item-key: docs-as-code -->


    ## Objective


    Restore `docs/` to a single current-state wiki that is treated like code, and
    make AGENTS.md and README serve their readers.


    ## Owned scope


    - Add the four docs-as-code principles to AGENTS.md (operator approval given 2026-09-02):
    reduce duplication, link related pages like a wiki, keep README a minimal user
    guide, keep AGENTS.md minimal and pointing at `docs/index.md`. Expand `docs/documentation-principles.md`
    with the detail.

    - Retire `docs/north-star-overhaul-roadmap.md` (complete since 2026-06-20), `docs/readme-proof.md`
    (cites README sections that no longer exist), and the six self-described working
    records (`testability-dsl-initiative.md`, `support-tool-followup.md`, `retro-self-improvement-spec.md`,
    `duplicate-detection-strategy.md`, `capability-resolution.md`, `ai-ml-engineering-patterns.md`)
    to `charness-artifacts/`. Fix `docs/index.md` and `docs/operator-acceptance.md`,
    which call the roadmap active.

    - Add `Last verified` to every `docs/` page and make `scripts/check-docs.sh` refuse
    a page without it; prove with a seeded page.

    - Keep the irreversible-boundary definition only in `docs/design-north-star.md`;
    repl'
