  title: 'Goal Run: realign charness to its north star (docs as code, tools/ split,
    in-process tests, scripts packages)'
  state: OPEN
  url: https://github.com/corca-ai/charness/issues/765
  updated_at: '2026-09-02T19:21:34Z'
  body: "## Situation\n\nCharness exists to reduce rework in the repositories that\
    \ consume it and to make agentic development there fast. A read-only audit of\
    \ this checkout on 2026-09-02 found that the repository's own structure no longer\
    \ reflects that purpose: the shipped `quality` skill carries this repository's\
    \ entire gate machine, `scripts/` is a flat tree of 397 files with no boundary\
    \ between consumer-facing code and repo-only tooling, subprocess use is pervasive\
    \ in both production and tests despite an in-process idiom, and `docs/` mixes\
    \ current contracts with completed project records.\n\n## Experience\n\nA new\
    \ session reads `docs/index.md`, finds `north-star-overhaul-roadmap.md` labelled\
    \ \"active roadmap\", and plans work that closed on 2026-06-20. A consumer installs\
    \ the plugin and receives 199 quality scripts, most of which police this repository's\
    \ release lane rather than their own repo's health. A maintainer wants to add\
    \ a subdirectory under `scripts/` and cannot, because about 50 single-star globs\
    \ would silently drop it from every gate. A test author wants to import a script\
    \ in-process and finds a forward-only ratchet that grandfathers 193 files forever.\n\
    \n## Evidence\n\n| Surface | Measured 2026-09-02 |\n| --- | --- |\n| `docs/` |\
    \ 43 pages; 40 lack `Last verified`; 1 retired roadmap called active in 2 places;\
    \ 6 self-described working records; `readme-proof.md` cites README sections that\
    \ no longer exist; 3 dead script citations |\n| AGENTS.md / README | AGENTS.md\
    \ lacks the docs-as-code principles; README omits hosts, prerequisites, install\
    \ effects, undo, and the skill list; `docs/index.md` does not link README |\n\
    | Production subprocess | 205 sites; 19 re-spawn this repo's own Python (14 pure\
    \ habit); 7 hardcoded `python3`; 189 of 205 bypass `scripts/subprocess_guard.py`\
    \ |\n| Test subprocess | 289 of 565 files use subprocess; 193 spawn `python3`\
    \ on a repo script; 91 use the in-process loaders; ratchet policy `no_increase`\
    \ |\n| `quality` skill | 199 scripts referenced vs ~118 for the other 19 public\
    \ skills; `run-quality.sh` 1341 lines, 97 gates, exempt from the length gate because\
    \ `.sh` is not covered |\n| `scripts/` | 385 `.py` + 12 `.sh`, flat; 299 of 397\
    \ reachable from both a shipped skill and the quality lane; 32 quality-lane-only;\
    \ 12 tests-only; 2 unreferenced; no file-level dead-code gate (knip absent, vulture\
    \ advisory default-off) |\n| Rework signal | usage-episode instrumentation removed\
    \ as unmeasurable; no current instrument |\n\nPlanning record: `charness-artifacts/goals/2026-09-02-north-star-realignment.md`.\n\
    \n## Impact\n\nMachinery that does not prevent consumer rework is cost, by the\
    \ north star's own definition. Today the cost lands on every new session (stale\
    \ planning surfaces), every consumer install (repo-only gates shipped), and every\
    \ maintainer change to `scripts/` or `tests/` (flat layout, non-converging ratchets).\
    \ Refactoring further inside the current boundaries makes the same machine tidier\
    \ without changing who it serves.\n\n## Desired outcome\n\n- `docs/` holds only\
    \ current contracts and every page carries a verified date; AGENTS.md states the\
    \ docs-as-code principles; README is a user guide linked from the index.\n- Every\
    \ production spawn goes through `subprocess_guard`; no repo script re-spawns repo\
    \ Python; tests import in-process unless a declared boundary is the claim.\n-\
    \ The `quality` skill exports only what checks a consumer repo's health via gates\
    \ and intelligence; repo-only gates live in a root `tools/` tree that is not exported.\n\
    - `scripts/` is organised into concept packages whose gates cover subdirectories\
    \ and shell files; unreferenced scripts are detected.\n- Consumer rework is observed\
    \ through the operator's own issue filing and read by retro.\n\nSuccess is a wrong\
    \ answer's escape path closed and a concept made clearer, never a line, gate,\
    \ or file count.\n\n## Ownership contract\n\n- Goal Draft owns approved intent,\
    \ boundaries, and slice design. Goal Binding owns the frozen identity. This parent\
    \ owns the current-child cursor. Work Item issues own routine implementation state\
    \ and behavioural proof.\n- Per-surface migration, never bulk deletion: each moved\
    \ gate, doc, or test names the failure mode it catches and proves the replacement\
    \ on a seeded instance.\n- Gate-scope repair precedes any subdirectory under `scripts/`.\n\
    - The export boundary is a proof surface: distinct-observer review and a clean-export\
    \ probe before that child closes.\n- AGENTS.md changes only under the operator's\
    \ explicit approval, given 2026-09-02 for the four docs-as-code principles.\n\n\
    ## Work sequence\n\nOrder chosen for advantage on 2026-09-02: instrument first,\
    \ fix the binding rigidity second, then the surfaces every session reads, then\
    \ the mechanical migrations in dependency order.\n\n1. #771 rework-instrument\n\
    2. #773 goal-run-binding-simplification (amendment, added after binding)\n3. #766\
    \ docs-as-code\n4. #767 gate-scope-repair\n5. #768 subprocess-retroactive-removal\n\
    6. #774 ledger-only-lessons (amendment, added 2026-09-02)\n7. #769 quality-boundary-and-run-quality\n\
    8. #770 scripts-packaging\n9. #772 integrated-closeout\n\n## Completion criteria\n\
    \n- Every child provider-closed with behavioural evidence.\n- Clean consumer install\
    \ proof recorded from a throwaway repository.\n- Release lane green on the integrated\
    \ tree with the skip list read.\n- Parent closed only through the guarded Goal\
    \ Run close path after exact readback.\n\n## Non-claims\n\n- Test reallocation\
    \ toward `spec`, `impl`, `prove`, and `create-cli` is a follow-up goal, not this\
    \ run.\n- No skill behaviour is redesigned; no git porcelain is replaced by a\
    \ library.\n- Push, tag, release publish, and installed-host mutation remain separately\
    \ authorised.\n\nAI provenance: drafted and filed by an AI agent from the operator-approved\
    \ Goal Draft and direct activation approval.\n\n<!-- charness-goal-run:v1\n{\n\
