title = "charness gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore generated, vendored, and transient paths in charness"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.git/''',
  '''(^|/)\.pytest_cache/''',
  '''(^|/)\.lycheecache$''',
  '''(^|/)skill-outputs/''',
  '''(^|/)package-lock\.json$''',
  # Generated nose clone-family baseline: family `key`s are content-hash
  # fingerprints (16-hex), not secrets, but trip the generic-api-key rule.
  '''(^|/)charness-artifacts/quality/nose-baseline\.json$''',
]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Goal Run identifiers are metadata, not credentials"
  condition = "AND"
  regexTarget = "line"
  regexes = [
    '''(?i)charness-work-item-key\s*:\s*[A-Za-z0-9][A-Za-z0-9_-]*''',
    '''(?i)"work_item_key"\s*:\s*"[A-Za-z0-9][A-Za-z0-9_-]*"''',
    '''(?i)"key"\s*:\s*"(?:backlog|goal|dogfood|achieve)-[A-Za-z0-9][A-Za-z0-9_-]*"''',
  ]
  paths = [
    '''(^|/)charness-artifacts/goal-runs/''',
    '''(^|/)charness-artifacts/goals/[^/]+\.binding\.json$''',
  ]

  [[rules.allowlists]]
  description = "The observer's named file entry is a SHA256 content digest"
  condition = "AND"
  regexTarget = "line"
  regexes = [
    '''^\s*"references/external-api-contract\.md": "[a-f0-9]{64}",$''',
  ]
  paths = [
    '''(^|/)charness-artifacts/goal-runs/798/independent-public-observer\.json$''',
  ]

  [[rules.allowlists]]
  description = "The frozen oracle's literal behavior label is not a credential"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^collision/duplicate$''']
  paths = ['''(^|/)charness-artifacts/probe/2026-09-06-delegation-net-value/protocol\.md$''']
