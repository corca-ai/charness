version: 1
repo: charness
language: en
output_dir: charness-artifacts/release
preset_id: portable-defaults
customized_from: portable-defaults
package_id: charness
packaging_manifest_path: packaging/charness.json
checked_in_plugin_root: plugins/charness
sync_command: python3 scripts/sync_root_plugin_manifests.py --repo-root .
quality_command: ./scripts/run-quality.sh
update_instructions:
- Run the repo-owned update command to install the latest published release.
- Read the release notes for release-specific behavior changes, migrations, or rollback notes.
real_host_required_surfaces: []
real_host_required_path_globs: []
real_host_checklist: []
requested_review_commands: []
requested_review_policy: warn-if-unconfigured
fresh_checkout_probes: []
# Generated release surfaces this repo asserts it publishes. An absent surface is
# otherwise indistinguishable from a matching one in `current_release.py`'s drift
# verdict; declaring it here is what turns "the file is gone" into drift. Empty by
# default so a repo that publishes only some surfaces is never forced red.
# Known names: claude_plugin, codex_plugin, claude_marketplace_version,
# codex_marketplace_source_path.
required_release_surfaces: []
review_unavailable_patterns:
- review unavailable
- requested review unavailable
- review gate unavailable
- review skipped because
- executor_variants
- no executor_variants
review_waiver_phrases:
- 'review waiver:'
- 'explicit review waiver:'
- 'requested review waiver:'
