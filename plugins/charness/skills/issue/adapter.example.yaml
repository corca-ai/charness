version: 1
default_org: corca-ai
default_repo: acme
remote_name: origin
# Optional: names the charness upstream repo for the retro-derived destination
# split (see references/issue-backend.md "Harness Upstream"). Omit when this
# repo has no separate upstream harness.
harness_upstream: corca-ai/charness
# Optional: omit entirely (or leave unset) to use the default `gh` backend.
# Set issue_backend to route create/view/close/comment/search_newest_open
# through a host-mediated capability instead, e.g. `acme github issue create
# -R <repo> ...`. Every {placeholder} below is substituted by the skill; see
# references/issue-backend.md "Placeholders" for the full set.
issue_backend:
  id: acme-github
  binary: acme
  commands:
    create:
      - github
      - issue
      - create
      - "-R"
      - "{repo}"
      - "--title"
      - "{title}"
      - "--body-file"
      - "{body_file}"
      - "--json"
    view:
      - github
      - issue
      - view
      - "-R"
      - "{repo}"
      - "{number}"
      - "--json"
      - "{json_fields}"
    close:
      - github
      - issue
      - close
      - "-R"
      - "{repo}"
      - "{number}"
      - "--reason"
      - "{reason}"
    comment:
      - github
      - issue
      - comment
      - "-R"
      - "{repo}"
      - "{number}"
      - "--body-file"
      - "{body_file}"
      - "--reason"
      - "{reason}"
    search_newest_open:
      - github
      - issue
      - list
      - "-R"
      - "{repo}"
      - "--state"
      - "open"
      - "--limit"
      - "1"
      - "--json"
