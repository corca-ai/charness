version: 1
repo: my-repo
language: en
output_dir: charness-artifacts/handoff
preset_id: portable-defaults
customized_from: portable-defaults
# Optional. CONTENT words the handoff may occupy -- blank lines, the required `##`
# headings and the whole `## References` block are not counted, and what remains is
# charged per whitespace-separated token. Named apart from debug/quality's
# `max_artifact_lines` because it measures a different thing in a different unit.
# `max_content_lines` was retired on 2026-08-19 and is now an adapter error.
# max_content_words: 1200
chunk_policy:
  max_package_sources: 5
  broad_boundary_tokens:
    - label/enhancement
    - label/bug
  allowed_broad_boundary_tokens: []
