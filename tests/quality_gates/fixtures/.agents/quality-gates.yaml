    - python3
    - skills/public/quality/scripts/inventory_sloc.py
    - --repo-root
    - $REPO_ROOT
    - --output
    - $RUN_QUALITY_TMPDIR/sloc-inventory.json
  - label: inventory-cli-ergonomics
    command:
    - python3
    - skills/public/quality/scripts/inventory_cli_ergonomics.py
    - --repo-root
    - $REPO_ROOT
  - label: inventory-cli-ergonomics
    command:
    - bash
    - -c
    - echo "inventory_cli_ergonomics.py unavailable; skipping optional advisory inventory."
  - label: inventory-nose-clones
    command:
    - python3
    - skills/public/quality/scripts/inventory_nose_clones.py
    - --repo-root
    - $REPO_ROOT
  - label: inventory-nose-clones
    command:
    - bash
    - -c
    - 'echo "ADVISORY: inventory_nose_clones.py unavailable; clone-family inventory
      is unproven."; exit 3'
  - label: check-runtime-budget
    command:
    - python3
    - skills/public/quality/scripts/check_runtime_budget.py
    - --repo-root
    - $REPO_ROOT
    - --runtime-profile
    - $RUN_QUALITY_RUNTIME_PROFILE
    - ${RUN_QUALITY_STATE_ROOT_ARGS[@]}
    - --advisory
  - label: check-runtime-budget
    command:
    - python3
    - skills/public/quality/scripts/check_runtime_budget.py
    - --repo-root
    - $REPO_ROOT
    - ${RUN_QUALITY_STATE_ROOT_ARGS[@]}
    - --advisory
  - label: agent-browser-runtime-hygiene
    command:
    - env
    - -u
    - CHARNESS_AGENT_BROWSER_IGNORE_ORPHANS
    - python3
    - scripts/agent_browser_runtime_guard.py
    - --repo-root
    - $REPO_ROOT
    - --assert-no-orphans
  - label: release-changed-line-coverage
    command:
    - python3
    - scripts/release_changed_line_coverage.py
    - --repo-root
    - $REPO_ROOT
    - --base-sha
    - $CHANGED_LINE_BASE_SHA
    - --coverage-json
    - $release_changed_line_coverage_json
    - --refuse-unestablished
  - label: release-changed-line-coverage
    command:
    - bash
    - -c
      - 'echo "release changed-line coverage: no resolved origin/main base SHA; proof
        is unestablished" >&2; exit 2'
