schema: charness/quality-gates/v1
runner_variables:
  REPO_ROOT: absolute repository root resolved by run-quality.sh
  PYTEST_FLAGS: pytest args for mode and release-only selection
  STANDING_PYTEST_TARGETS: expanded pytest targets from run_standing_pytest.py
  python_files: Python files matched by recursive compile globs
  seed_budget_args: seed-budget args, including advisory opt-in
  RUN_QUALITY_STATE_ROOT_ARGS: optional runtime state-root arguments
  RUN_QUALITY_RUNTIME_PROFILE: selected runtime budget profile
  SPECDOWN_OUTPUT_DIR: per-run output directory for specdown
  DOC_DUPLICATES_OUTPUT: per-run doc-duplicate inventory path
  SLOC_OUTPUT: per-run SLOC inventory path
  PROVENANCE_CONTRACT_CHECKER: first packaged provenance checker path
  CRITIQUE_CHANGED_REF: changed range from the origin/main merge-base
  CHANGED_LINE_BASE_SHA: origin/main merge-base for changed-line proof
  release_changed_line_coverage_json: release changed-line coverage path
phases:
- id: pytest
  isolation: alone
  fail_fast: true
  gates:
  - label: pytest-release
    command:
    - env
    - CHARNESS_STANDING_PYTEST_PYTHON=python3
    - python3
    - scripts/gates_support/run_standing_pytest.py
    - ${PYTEST_FLAGS[@]}
    lane: release-only
    variant_of: pytest
    timing_layer: stays
    note: src scripts/run-quality.sh:952; labels literal (475-479).
  - label: pytest
    command:
    - env
    - CHARNESS_STANDING_PYTEST_PYTHON=python3
    - python3
    - scripts/gates_support/run_standing_pytest.py
    - ${PYTEST_FLAGS[@]}
    lane: standard
    timing_layer: stays
    note: src scripts/run-quality.sh:954; labels literal (475-479).
  fail_message: standing pytest failed; stopping before later quality checks.
- id: agent-browser-baseline
  isolation: alone
  fail_fast: true
  fail_message: agent-browser runtime baseline failed; stopping before later quality checks.
  gates:
  - label: agent-browser-runtime-baseline
    command:
    - env
    - -u
    - CHARNESS_AGENT_BROWSER_IGNORE_ORPHANS
    - python3
    - scripts/evidence/agent_browser_runtime_guard.py
    - --repo-root
    - $REPO_ROOT
    - --cleanup-orphans
    lane: opt-in
    condition:
      env:
        CHARNESS_AGENT_BROWSER_RUNTIME_HYGIENE: '1'
    timing_layer: stays
    note: src scripts/run-quality.sh:980; labels literal (475-479).
