    - ./scripts/check-markdown.sh
  - label: check-links-internal
    command:
    - ./scripts/check-links-internal.sh
  - label: check-links-external
    command:
    - ./scripts/check-links-external.sh
  - label: check-plugin-dir-references
    command:
    - python3
    - scripts/native_gate_lib.py
    - --repo-root
    - $REPO_ROOT
