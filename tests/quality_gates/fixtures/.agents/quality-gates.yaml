    - python3
    - skills/public/quality/scripts/check_dup_ratchet.py
    - --repo-root
    - $REPO_ROOT
    - --doc-inventory
    - $RUN_QUALITY_TMPDIR/doc-duplicates.json
  - label: check-seed-fixture-budget
    command:
    - python3
    - scripts/check_seed_fixture_budget.py
    - ${seed_budget_args[@]}
  - label: inventory-ci-local-gate-parity
    command:
    - python3
    - skills/public/quality/scripts/inventory_ci_local_gate_parity.py
    - --repo-root
    - $REPO_ROOT
    - --require-empty-parity-issues
    - --require-git-file-listing
  - label: inventory-gitignore-scan-hygiene
    command:
    - python3
    - skills/public/quality/scripts/inventory_gitignore_scan_hygiene.py
    - --repo-root
    - $REPO_ROOT
    - --require-empty
    - --require-git-file-listing
  - label: inventory-gitignore-scan-hygiene
    command:
    - bash
    - -c
    - echo "inventory_gitignore_scan_hygiene.py unavailable; skipping optional advisory
      inventory."
  - label: check-current-pointer-writes
    command:
    - python3
    - scripts/check_current_pointer_writes.py
    - --repo-root
    - $REPO_ROOT
    - --require-empty
    - --require-git-file-listing
  - label: measure-startup-probes
    command:
    - python3
    - skills/public/quality/scripts/measure_startup_probes.py
    - --repo-root
    - $REPO_ROOT
    - --class
    - standing
    - --record-runtime-signals
    - ${RUN_QUALITY_STATE_ROOT_ARGS[@]}
  - label: inventory-sloc
