schema: charness/quality-gates/v1
phases:
- id: extracted-runner
  isolation: concurrent
  fail_fast: false
  gates:
  - label: pytest-release
    command:
    - env
    - CHARNESS_STANDING_PYTEST_PYTHON=python3
    - python3
    - scripts/run_standing_pytest.py
    - ${PYTEST_FLAGS[@]}
  - label: pytest
    command:
    - env
    - CHARNESS_STANDING_PYTEST_PYTHON=python3
    - python3
    - scripts/run_standing_pytest.py
    - ${PYTEST_FLAGS[@]}
  - label: agent-browser-runtime-baseline
    command:
    - env
    - -u
    - CHARNESS_AGENT_BROWSER_IGNORE_ORPHANS
    - python3
    - scripts/agent_browser_runtime_guard.py
    - --repo-root
    - $REPO_ROOT
    - --cleanup-orphans
  - label: validate-skills
    command:
    - python3
    - scripts/validate_skills.py
    - --repo-root
    - $REPO_ROOT
  - label: validate-quality-reference-catalog
    command:
