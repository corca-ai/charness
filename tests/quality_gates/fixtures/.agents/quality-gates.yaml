    command:
    - python3
    - scripts/check_github_actions.py
    - --repo-root
    - $REPO_ROOT
  - label: check-supply-chain-online
    command:
    - python3
    - scripts/check_supply_chain_online.py
    - --repo-root
    - $REPO_ROOT
    - --triage-owner
    - repo-maintainers
  - label: check-shell
    command:
    - ./scripts/check-shell.sh
  - label: check-rust
    command:
    - ./scripts/check-rust.sh
  - label: py-compile
    command:
    - python3
    - -m
    - py_compile
    - ${python_files[@]}
  - label: ruff
    command:
    - ./scripts/check-python-lint.sh
  - label: check-coverage
    command:
    - python3
    - scripts/check_coverage.py
    - --repo-root
    - $REPO_ROOT
  - label: check-test-completeness
    command:
    - python3
    - scripts/check_test_completeness.py
    - --repo-root
    - $REPO_ROOT
    - --
    - ${STANDING_PYTEST_TARGETS[@]}
  - label: check-test-production-ratio
    command:
    - python3
    - scripts/check_test_production_ratio.py
    - --repo-root
    - $REPO_ROOT
    - --require-git-file-listing
    - --advisory
  - label: check-consumer-validator-catalog
    command:
    - python3
    - scripts/check_consumer_validator_catalog.py
    - --repo-root
    - $REPO_ROOT
    - --adoption-path
    - .agents/consumer-validator-adoption.yaml
    - --require-adoption
  - label: check-provenance-contract
    command:
    - python3
    - $PROVENANCE_CONTRACT_CHECKER
    - --repo-root
    - $REPO_ROOT
  - label: check-provenance-contract
    command:
    - bash
    - -c
    - multiline quality gate payload
  - label: check-closeout-classification-parity
    command:
    - python3
    - scripts/check_closeout_classification_parity.py
    - --repo-root
    - $REPO_ROOT
  - label: specdown
    command:
    - bash
    - -c
    - command -v specdown >/dev/null || { echo "specdown is required for executable
      specs. Install from https://github.com/corca-ai/specdown or run charness tool
      doctor specdown for current readiness."; exit 1; }; specdown_config=\$(python3
      "$REPO_ROOT/scripts/specdown_ephemeral_config.py" --repo-root "$REPO_ROOT" --out-dir
      "$RUN_QUALITY_TMPDIR/specdown-report") || exit 1; trap 'rm -f "\$specdown_config"
      || true' EXIT; specdown run -config "\$specdown_config" -jobs 4 -out "$RUN_QUALITY_TMPDIR/specdown-report"
  - label: run-evals
    command:
    - python3
    - scripts/run_evals.py
    - --repo-root
    - $REPO_ROOT
  - label: doc-duplicates
    command:
    - python3
    - skills/public/quality/scripts/inventory_doc_duplicates.py
    - --repo-root
    - $REPO_ROOT
    - --require-nose
    - --json-out
    - $RUN_QUALITY_TMPDIR/doc-duplicates.json
  - label: validate-inventory-consumption-declaration
    command:
    - python3
    - scripts/validate_inventory_consumption_declaration.py
    - --repo-root
    - $REPO_ROOT
