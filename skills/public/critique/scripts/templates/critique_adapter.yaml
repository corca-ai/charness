version: 1
repo: CHANGE_ME
language: en
output_dir: charness-artifacts/critique
# Default Codex mapping for high-leverage fresh-eye reviewers. Hosts that do not
# expose these fields ignore them; Claude Code repos can replace this tier with
# their host-specific reviewer model.
reviewer_tiers:
  high-leverage:
    model: gpt-5.6-terra
    reasoning_effort: medium
    service_tier: priority
    fork_turns: none
  medium:
    model: gpt-5.6-terra
    reasoning_effort: medium
    fork_turns: none
# Default execution is a file-backed worker. Set the concrete host backend in
# the repo adapter (`codex_exec` or `claude_p`); consumers use its typed receipt
# and delivery ledger rather than inferring approval from files or exit codes.
reviewer_runner:
  mode: file-backed-worker
  backend: host-defaulted
  timeout_seconds: 900
# Declare sections to opt into the critique prepare-packet contract.
# Without any entry, critique runs unchanged.
# See skills/public/critique/references/adapter-contract.md.
packet_sections: []
