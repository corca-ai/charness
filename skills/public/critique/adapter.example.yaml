version: 1
repo: CHANGE_ME
language: en
output_dir: charness-artifacts/critique
# Translation of portable reviewer tiers in
# skills/shared/references/fresh-eye-subagent-review.md. Select a tier with
# `run_review.py --reviewer-tier`; otherwise the prepared packet's tier applies.
# File-backed workers apply configured model/reasoning_effort through supported
# backend options and report service_tier/fork_turns as unsupported. Typed
# subagent hosts may apply their supported spawn fields. Example mappings:
#   Codex host:        high-leverage -> model: gpt-6-luna,
#                        reasoning_effort: xhigh, service_tier: priority,
#                        fork_turns: none
#                      medium -> model: gpt-6-luna, reasoning_effort: xhigh,
#                        fork_turns: none
#   Claude Code host:  high-leverage -> model: sonnet-4.6
# Host acceptance or sending does not prove provider application; record that
# only when the provider confirms it. A Codex role / `agent_type` may override
# caller-selected model or effort in typed-subagent mode.
reviewer_tiers:
  high-leverage:
    model: gpt-6-luna
    reasoning_effort: xhigh
    service_tier: priority
    fork_turns: none
  medium:
    model: gpt-6-luna
    reasoning_effort: xhigh
    fork_turns: none
reviewer_runner:
  mode: file-backed-worker
  backend: host-defaulted
  timeout_seconds: 900
packet_sections:
  - id: changed-files-and-owning-surfaces
    title: Changed Files And Owning Surfaces
    content_kind: script
    command: "python3 scripts/review/render_critique_section_changed_surfaces.py"
  - id: non-goals
    title: Non-Goals For This Critique
    content_kind: static
    # Inline `content` accepts a string or a list of strings (one per
    # line). Block scalars (`|`) are not supported by the repo-local
    # YAML loader.
    content:
      - "- example non-goal one"
      - "- example non-goal two"
