version: 1
repo: CHANGE_ME
language: en
output_dir: charness-artifacts/critique
# Host-specific translation of the portable reviewer tiers defined in
# skills/shared/references/fresh-eye-subagent-review.md. The portable policy
# names only the tier; each host maps it to that host's reviewer fields.
# Set the values for the host this repo runs on. Known host defaults:
#   Codex host:        high-leverage -> model: gpt-5.6-terra,
#                        reasoning_effort: medium, service_tier: priority,
#                        fork_turns: none
#                      medium -> model: gpt-5.6-terra, reasoning_effort: medium,
#                        fork_turns: none
#   Claude Code host:  high-leverage -> model: sonnet-4.6
# reasoning_effort / service_tier only apply where the host exposes them.
# These are requested spawn fields. Host acceptance or sending does not prove the
# provider applied them; record application only when the host confirms it. A
# Codex role / `agent_type` may override caller-selected model or effort.
reviewer_tiers:
  high-leverage:
    model: gpt-5.6-terra
    reasoning_effort: medium
    service_tier: priority
    fork_turns: none
  medium:
    model: gpt-5.6-terra
    reasoning_effort: medium
    fork_turns: none
reviewer_runner:
  mode: file-backed-worker
  backend: host-defaulted
  timeout_seconds: 900
packet_sections:
  - id: changed-files-and-owning-surfaces
    title: Changed Files And Owning Surfaces
    content_kind: script
    command: "python3 scripts/review/render_critique_section_changed_surfaces.py"
  - id: non-goals
    title: Non-Goals For This Critique
    content_kind: static
    # Inline `content` accepts a string or a list of strings (one per
    # line). Block scalars (`|`) are not supported by the repo-local
    # YAML loader.
    content:
      - "- example non-goal one"
      - "- example non-goal two"
