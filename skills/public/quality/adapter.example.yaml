version: 1
repo: my-repo
language: en
output_dir: charness-artifacts/quality
preset_id: typescript-quality
customized_from: typescript-quality
preset_lineage:
- typescript-quality
# Optional. Raw FILE WORDS the quality artifact may occupy; omit to keep the
# validator's default. Both the gate and the scaffold's `size_budget.max_words`
# forecast read it, so raising it never leaves the author writing to a stale number.
# max_artifact_words: 1600
coverage_fragile_margin_pp: 1.0
coverage_floor_policy:
  min_statements_threshold: 30
  fail_below_pct: 80.0
  warn_ceiling_pct: 95.0
  floor_drift_lock_pp: 1.0
  exemption_list_path: scripts/coverage-floor-exemptions.txt
  gate_script_pattern: "*-quality-gate.sh"
  lefthook_path: lefthook.yml
  ci_workflow_glob: .github/workflows/*.yml
specdown_smoke_patterns: []
spec_pytest_reference_format: Covered by pytest:\s+`tests/[^`]+`(?:,\s*`tests/[^`]+`)*
public_spec_section_exemptions:
  - Fixed Decisions
  - HTTP API contract
  - Server backend stack
  - Deferred Decisions
  - Non-Goals
public_spec_implementation_ref_density_floor: 0.02
public_spec_implementation_guard_min_lines: 100
public_spec_pointer_proof_markers:
  - "proof: pointer"
  - "proof: pointer-spec"
  - "executable_proof: pointer"
  - "public_spec_proof: pointer"
recommendation_defaults_version: issue-64
adapter_review_sources: []
acknowledged_recommendations: []
gate_design_review_globs: []
canonical_markdown_surfaces:
  - AGENTS.md
  - CLAUDE.md
universes:
  # pytest, pytest-release, check-test-completeness
  pytest_targets:
    - tests
  # py-compile, ruff, check-python-lengths, check-python-runtime-inheritance
  python_sources:
    - src/*.py
    - src/**/*.py
  # check-shell
  shell_sources:
    - '*.sh'
    - scripts/*.sh
    - tests/**/*.sh
  # check-test-production-ratio
  test_roots:
    - tests
  # check-doc-links, docs-graph, doc-duplicates
  doc_surfaces:
    - README.md
    - AGENTS.md
    - docs/**/*.md
  # check-spec-evidence-durability, check-artifact-referents,
  # validate-critique-artifacts, validate-ideation-artifact, validate-lesson-ledger
  artifact_roots:
    spec: artifacts/spec
    quality: artifacts/quality
    release: artifacts/release
    dogfood: artifacts/dogfood
    debug: artifacts/debug
    premortem: artifacts/premortem
    design-studies: artifacts/design-studies
    goals: artifacts/goals
    critique: artifacts/critique
    retro: artifacts/retro
    probe: artifacts/probe
    issues: artifacts/issues
    release-review: artifacts/release-review
  # inventory-gitignore-scan-hygiene
  scanner_globs:
    - src/**/*.py
  # inventory-ci-local-gate-parity
  ci_gate_patterns:
    - '\bnpm\s+run\s+verify\b'
    - '\bmake\s+verify\b'
  # release-changed-line-coverage
  mutation_pool:
    - src/**/*.py
  # specdown
  specdown_config: specdown.json
  # check-secrets
  secrets_config: .gitleaks.toml
skill_ergonomics_skill_paths: []
skill_ergonomics_runtime_install_skill_paths: []
vendored_paths: []
skill_ergonomics_gate_rules:
  - code_fence_without_helper_script
  - dated_incident_in_core
  - issue_anchor_in_core
  - long_core
  - mode_option_pressure_terms
  - portable_package_dated_incident
  - portable_package_issue_anchor
  - portable_helper_path_ambiguity
  - progressive_disclosure_risk
runtime_profile_default: default
runtime_budgets: {}
runtime_budget_profiles: {}
# Optional for adapters without runtime budgets. When budgets are declared, use
# this compact map to state scheduling intent: `always` is the default run,
# `conditional` names a runner trigger, and `external` explains why a label is
# not locally enforceable. The universe check reports conditional execution as
# unproven; this field is not a substitute for a runtime sample.
# runtime_budget_intent:
#   always:
#     - pytest
#   conditional:
#     dead-code-advisory: "QUALITY_DEAD_CODE=1"
#   external:
#     consumer-gate: "runs only in the consuming repository"
# Optional for consumers whose runner can expose its known runtime labels. The
# command is trusted repo-owned configuration and must print one label per line.
# An absent command keeps this reconciliation advisory/inert.
# runtime_budget_universe:
#   command: ./scripts/list-quality-labels.sh
# Optional: ingest an existing per-command timing log as a runtime sample source
# (inert when omitted). See references/adapter-contract.md.
# command_timing_log:
#   path: .charness/quality/command-timing.jsonl
#   format: jsonl
#   field_map:
#     label: command
#     elapsed: elapsed_ms
#   elapsed_unit: ms
#   recent_window: 10
# Optional: own test-file discovery for the standing-test-economics inventory so
# it consumes THIS repo's real test surface instead of the portable default glob
# list. Inert when omitted. Precedence: a non-empty `command` (your authoritative
# test-surface lister, one repo-relative path per line, consumed verbatim) wins;
# else `patterns` (bare globs, extend|replace the built-in defaults); else the
# built-in defaults. A declared command that fails is reported as a degraded
# source, never a silent undercount. See references/adapter-contract.md.
# test_file_discovery:
#   command: "node --input-type=module -e \"import { resolveDiscoverableUnitTestFiles } from './scripts/test-surface-lib.mjs'; console.log(resolveDiscoverableUnitTestFiles().join('\\n'))\""
#   patterns: []
#   patterns_mode: extend
# Optional: own lint-suppression discovery for the lint-ignore inventory so it
# also counts suppressions in languages outside the built-in py/js/ts set.
# Suppression syntax is language-specific, so each directive declares its file
# suffixes, a regex (ideally with a `(?P<codes>...)` group), and an optional
# scope (inline | file | leading; default leading). Inert when omitted.
# lint_ignore_discovery:
#   directives:
#     - tool: nolint
#       suffixes: [".go"]
#       pattern: "//\\s*nolint(?::(?P<codes>\\S+))?"
#       scope: leading
#     - tool: rubocop
#       suffixes: [".rb"]
#       pattern: "#\\s*rubocop:disable\\s+(?P<codes>.+)"
startup_probes: []
quality_phases: []
concept_paths: []
preflight_commands: []
gate_commands: []
security_commands: []
mutation_testing:
  # Empty commands.* keep this stack-neutral; consumers fill the slots that
  # match their tool. See references/mutation-testing.md.
  commands:
    dry_run: ""
    full: ""
    sample: ""
    summary: ""
  score_break: 60
  schedule_cron: "17 */3 * * *"
  changed_quota: 5
  max_files: 10
  max_executable_mutants: 120
  max_executable_mutants_per_file: 80
  max_test_nodeids: 40
  auto_issue:
    enabled: false
    label: mutation-test
    title: Mutation test regression on main
    marker_token: mutation-test-regression
  workflow_path: .github/workflows/mutation-tests.yml
  report_paths:
    summary_md: reports/mutation/summary.md
    sample_md: reports/mutation/sample.md
    log: reports/mutation/run.log
  declined: false
standing_doc_provenance:
  # Empty standing_docs keeps the provenance-placement check inert (opt-in).
  # List your standing-rule docs to inherit it; allowlist tracking ledgers.
  # See references/standing-doc-provenance.md.
  standing_docs: []
  tracking_allowlist: []
  inline_allow_marker: provenance-allow
changed_line_mutation_gate:
  # Empty eligible_globs keeps the changed-line coverage gate inert (opt-in).
  # List the globs of source the gate guards and point coverage_json at the
  # coverage.py report your full/scheduled run emits. See references/mutation-testing.md.
  coverage_json: reports/mutation/test-coverage.json
  eligible_globs: []
  exclude_globs: []
dup_ratchet:
  # enabled:false keeps the boy-scout duplicate ratchet inert (opt-in). To adopt
  # (order matters — the seed reads scope_paths): 1. point scope_paths + the
  # artifact paths at your repo, 2. seed the reviewed overlay (seed_dup_review.py)
  # and the gate baseline (check_dup_ratchet.py --write-baseline), 3. set
  # enabled:true. floor_F is the healthy fixable floor; escalation_K is the
  # stagnation commit budget before the boy-scout nudge escalates to a one-time
  # block. See references/dup-ratchet.md.
  enabled: false
  floor_F: 0
  escalation_K: 10
  # scope_paths MUST list your code roots before enabling: enabled:true with an
  # empty scope_paths degrades the whole gate to advisory (a real scan would fall
  # back to nose DEFAULT_PATHS — the wrong tree), never a block or a silent pass.
  scope_paths: []
  review_artifact_path: charness-artifacts/quality/dup-review.json
  gate_baseline_path: charness-artifacts/quality/dup-ratchet-baseline.json

# Forward-looking prose surfaces gated against transcribed facts a command can
# regenerate (versions, shas, as-of counts). A number in prose is read as current;
# carry the COMMAND instead. If that command is EXPENSIVE, carry the command AND
# link the checked-in artifact holding its output -- never make every future
# reader re-run a multi-minute gate to learn one number.
#
# An arbitrary docs tree is not a safe default: many repos keep dated requests,
# completed implementation records, retros, or lessons under docs/. Opt the
# current portion in and exempt historical records using this repo's taxonomy.
regenerable_facts:
  # Omit to accept the conservative defaults: AGENTS.md, CLAUDE.md, README.md,
  # and shipped skill prose (SKILL.md, references/*.md). List docs globs only
  # when this adapter also owns their current-vs-record seam.
  #
  # The gate EXITS 1 rather than passing when a DECLARED scope scanned zero files, when the
  # adapter is present but invalid, or when an exemption has no reason -- a gate
  # that matched nothing has verified nothing, and defaults silently replacing
  # your declared scope would report clean over a scope you did not choose.
  # `surfaces: []` is an explicit empty declaration and therefore refuses; it
  # does not fall back to defaults. With no declaration, an existing docs tree
  # is reported `NOT CONFIGURED FOR DOCS` at exit 0, never as clean.
  surfaces:
    - AGENTS.md
    - README.md
    - docs/*.md
  # path -> reason. A reason is REQUIRED: an unexplained exemption is the same
  # unfalsifiable claim this rule exists to remove, so a blank one is refused.
  exemptions:
    docs/decisions.md: >-
      historical context: records the figures each decision was TAKEN on, which
      rewriting to today's numbers would falsify.
