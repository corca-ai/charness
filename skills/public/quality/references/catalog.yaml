gates:
  - id: read-only-quality
    command: ./scripts/run-quality.sh --read-only
    purpose: standing deterministic evidence packet
    trust_model: hard gate plus advisory sub-packets; green is evidence, not judgment
    cost_tier: broad
    parallel_group: serial-critical
    run_after: required-primer
    run_when: repo exposes this repo-native command or an equivalent standing quality gate
  - id: runtime-summary
    command: python3 "$SKILL_DIR/scripts/render_runtime_summary.py" --repo-root . --json
    purpose: measured runtime trend source before claiming cost or speed facts
    trust_model: measurement packet
    cost_tier: cheap
    parallel_group: inventories
    run_when: runtime, slow gate, budget, or cost is in scope
  - id: skill-ergonomics
    command: python3 "$SKILL_DIR/scripts/inventory_skill_ergonomics.py" --repo-root . --summary
    purpose: advisory skill-surface pressure packet when skills are in scope
    trust_model: heuristic advisory with false positives and false negatives
    cost_tier: cheap
    parallel_group: inventories
    run_when: skills_in_scope
# brief: load-bearing residue of demoted required-primers, carried inline in the
# planner stdout so a run keeps the discipline without a mandatory prose read.
# The planner (plan_quality_run.py:_quality_brief) injects the final-gate probe
# result into maintainer_local_enforcement; everything else is static data. Open
# a block's detail_ref only when its catalog trigger fires.
brief:
  purpose: >-
    load-bearing residue of demoted primers, carried inline so a run keeps the
    discipline without a mandatory prose read; open detail_ref only on trigger
  gate_classification:
    closeout_states:
      healthy: present, runnable, high-signal for the seam it covers
      weak: >-
        present but easy to game, too shallow for the claimed confidence,
        duplicated by a better gate, OR a green non-shallow gate STILL paying
        standing runtime after a cheaper, more-direct proof now covers the same
        seam (cost-redundancy alone makes a working gate weak)
      missing: should exist for the current risk surface but is absent or only implied
      deferred: useful later, not the next highest-leverage gate for the current state
    note: >-
      these four states are the required ## Healthy / ## Weak / ## Missing /
      ## Deferred closeout sections; classify every gate before recommending moves
    ranking_is_advisory: >-
      Recommended Next Quality Moves ordering is an inference-layer proxy — answer
      its interpretation question for THIS repo before trusting the rank
    candidate_floor: exceptional; needs explicit north-star + floor-addition-restraint provenance
    detail_ref: references/gate-classification.md
  automation_promotion:
    cases:
      AUTO_EXISTING: >-
        already enforced by a meaningful deterministic gate; do not re-report as a
        manual finding without added repo interpretation
      AUTO_CANDIDATE: >-
        should become a deterministic gate; propose the gate before more policy prose
      NON_AUTOMATABLE: >-
        still needs judgment/tradeoffs/human review; belongs in prose findings and proposals
    inference_layer_rule: >-
      for any inference-layer advisory (clone %, ergonomics heuristics, rankings,
      length/pressure smells, runtime trends) answer its self-declared
      interpretation question for THIS repo before repeating/ranking/escalating;
      each inventory emits its own question at run time
    detail_ref: references/automation-promotion.md
  maintainer_local_enforcement:
    field_discipline: >-
      record a Maintainer-Local Enforcement disposition; 'Unclear' is not
      acceptable — default to `missing` until the gap is closed or explicitly
      deferred with a reason
    detail_ref: references/maintainer-local-enforcement.md
    standing_prompt: >-
      If the repo has a canonical final stop-before-finish gate, record HOW it is
      enforced before push in maintainer clones (checked-in hook + clone
      validator, repo-owned installer, or explicit documented omission).
    detected_prompt_template: >-
      DETECTED a canonical final gate ({gates}): before calling operability
      healthy, record HOW it is enforced before push in maintainer clones
      (checked-in hook + clone validator, a repo-owned installer, or an explicit
      documented decision to omit hooks with a named CI owner). A green gate that
      clones can push around is an enforcement gap that happens to compile.
