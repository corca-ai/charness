version: 1
references:
  - path: references/quality-lenses.md
    role: required-primer
    why: Interpret every quality packet through concept, behavior, security, and operability.
  - path: references/surface-contract-review.md
    role: required-primer
    why: Separate routed gate receipts from semantic surface coverage and disclose unexamined axes.
  - path: references/inventory-dispatch.md
    role: on-demand
    trigger: a concern area needs its per-inventory review discipline or the clone-family/structural-signal depth beyond the planner brief's dispatch index
  - path: references/proposal-flow.md
    role: required-primer
    why: Keep recommendations concrete, sourced, and proportionate.
  - path: references/operability-signals.md
    role: required-primer
    why: Read runtime, setup, CI, and maintenance signals as quality evidence.
  - path: references/skill-quality.md
    role: scope-primer
    scope: skill-authoring
    why: Inspect skills as runtime artifacts when the repo authors skills.
  - path: references/skill-ergonomics.md
    role: scope-primer
    scope: skill-authoring
    why: Judge whether skill cores, references, and scripts preserve progressive disclosure.
  - path: references/gate-classification.md
    role: on-demand
    trigger: the planner brief's gate-state or weak-vs-missing discipline is contested, or a candidate-floor recommendation needs its full provenance rule
  - path: references/automation-promotion.md
    role: on-demand
    trigger: adding a new advisory/inventory or inference-layer surface, or an inference-layer advisory needs its full per-surface interpretation/registration protocol beyond the brief
  - path: references/maintainer-local-enforcement.md
    role: on-demand
    trigger: a canonical final gate's pre-push enforcement, CI/local gate parity, or gate-policy markers (scheduled-deeper-check, local-gate-subset-mirror) need judging beyond the brief prompt
  - path: references/adapter-contract.md
    role: on-demand
    trigger: adapter missing, invalid, stale, or under-specified
  - path: references/adapter-gate-review.md
    role: on-demand
    trigger: adapter or gate recommendation needs enforcement-tier review
  - path: references/agent-production-runtime.md
    role: on-demand
    trigger: production agent runtime, provider policy, fallback, telemetry, or serving-path risk
  - path: references/dup-ratchet.md
    role: on-demand
    trigger: dup-ratchet failure, scanner skew, baseline update, or clone-family interpretation
  - path: references/bootstrap-escalations.md
    role: on-demand
    trigger: bootstrap path needs non-default escalation, hidden setup work, adapter repair, or operator-facing bootstrap judgment
  - path: references/bootstrap-posture.md
    role: on-demand
    trigger: quality adapter bootstrap or setup-state repair
  - path: references/brittle-source-guards.md
    role: on-demand
    trigger: brittle source guard finding or matcher migration
  - path: references/standing-gate-verbosity.md
    role: on-demand
    trigger: standing gate output, runtime, progress signal, or failure detail review
  - path: references/testability-and-selection.md
    role: on-demand
    trigger: slow tests, affected-test selection, mutation workload, or broad test economics
  - path: references/proof-path-efficiency.md
    role: on-demand
    trigger: a slow-proof fix changes a runner, wrapper, process boundary, validator route, fixture runtime, or execution policy
  - path: references/cost-dominance.md
    role: on-demand
    trigger: a command is prescribed, queued, or spawned and a cheaper command already proves the same thing
  - path: references/behavior-testing.md
    role: on-demand
    trigger: deterministic gates cannot honestly prove an agent/user behavior seam
  - path: references/ci-recoverable-gate-triage.md
    role: on-demand
    trigger: slow local gate pressure raises CI recoverability as an option
  - path: references/cli-ergonomics-smells.md
    role: on-demand
    trigger: CLI ergonomics, command archetype, or mutating-probe review
  - path: references/coverage-floor-policy.md
    role: on-demand
    trigger: coverage-floor inventory or policy finding
  - path: references/dual-implementation-parity.md
    role: on-demand
    trigger: dual implementation smell or parity-harness question
  - path: references/entrypoint-docs-ergonomics.md
    role: on-demand
    trigger: entrypoint documentation ergonomics review
  - path: references/executable-spec-economics.md
    role: on-demand
    trigger: executable-spec runtime, duplication, or layering review
  - path: references/installable-cli-probes.md
    role: on-demand
    trigger: installable CLI probe, doctor, help, or lifecycle ownership review
  - path: references/lint-ignore-discipline.md
    role: on-demand
    trigger: lint-ignore inventory or retained-suppression decision
  - path: references/mutation-testing.md
    role: on-demand
    trigger: mutation-testing adapter, workflow, summary, or sampling review
  - path: references/prompt-asset-policy.md
    role: on-demand
    trigger: prompt asset inventory or prompt-regression proof
  - path: references/public-spec-layering.md
    role: on-demand
    trigger: public spec layering, smoke duplication, or source-guard pressure review
  - path: references/quality-signal-scorecard.md
    role: on-demand
    trigger: structural quality cleanup candidate scoring
  - path: references/security-overview.md
    role: on-demand
    trigger: security posture or supply-chain proof separation is in scope
  - path: references/security-npm.md
    role: on-demand
    trigger: package.json, package-lock.json, npm audit, or npm supply-chain risk is in scope
  - path: references/security-pnpm.md
    role: on-demand
    trigger: pnpm-lock.yaml, pnpm audit, or pnpm-managed supply-chain risk is in scope
  - path: references/security-uv.md
    role: on-demand
    trigger: uv.lock, pyproject uv configuration, or uv-managed supply-chain risk is in scope
  - path: references/standing-doc-provenance.md
    role: on-demand
    trigger: standing-doc provenance finding or policy review
  - path: references/unit-test-quality.md
    role: on-demand
    trigger: unit test body quality or fixture/assertion review
gates:
  - id: read-only-quality
    command: ./scripts/run-quality.sh --read-only
    purpose: standing deterministic evidence packet
    trust_model: hard gate plus advisory sub-packets; green is evidence, not judgment
    cost_tier: broad
    parallel_group: serial-critical
    run_after: required-primer
    run_when: repo exposes this repo-native command or an equivalent standing quality gate
  - id: runtime-summary
    command: python3 "$SKILL_DIR/scripts/render_runtime_summary.py" --repo-root . --detail
    purpose: measured runtime trend source before claiming cost or speed facts
    trust_model: measurement packet
    cost_tier: cheap
    parallel_group: inventories
    run_when: runtime, slow gate, budget, or cost is in scope
  - id: regenerable-facts
    command: python3 "$SKILL_DIR/scripts/check_regenerable_facts.py" --repo-root .
    purpose: refuse a transcribed number in forward-looking prose; conservative defaults do not guess that docs/** is current
    trust_model: hard on findings or invalid declared scope; unconfigured docs are a typed no-verdict at exit 0, never a clean claim
    cost_tier: cheap
    parallel_group: serial-critical
    run_when: the repo carries forward-looking prose a reader treats as current
  - id: skill-ergonomics
    command: python3 "$SKILL_DIR/scripts/inventory_skill_ergonomics.py" --repo-root . --summary
    purpose: advisory skill-surface pressure packet when skills are in scope
    trust_model: heuristic advisory with false positives and false negatives
    cost_tier: cheap
    parallel_group: inventories
    run_when: skills_in_scope
# brief: load-bearing residue of demoted required-primers, carried inline in the
# planner stdout so a run keeps the discipline without a mandatory prose read.
# The planner (plan_quality_run.py:_quality_brief) injects the final-gate probe
# result into maintainer_local_enforcement; everything else (including the
# inventory_dispatch routing index) is static data. Open a block's detail_ref
# only when its catalog trigger fires.
brief:
  purpose: >-
    load-bearing residue of demoted primers, carried inline so a run keeps the
    discipline without a mandatory prose read; open detail_ref only on trigger
  inventory_dispatch:
    detail_ref: references/inventory-dispatch.md
    consumption: >-
      Run a focused inventory only when the quality question brings its surface
      into scope; advisory inventories are review prompts, not mandates. Use
      `--summary` YAML for every dispatch script's first-read triage and switch
      to `--detail` YAML only when a finding needs full attribution or disposition.
      YAML is the only structured output contract; the removed hidden JSON mode
      is not a supported programmatic seam. The existing YAML contract test
      derives every dispatch script command from the routing
      document and inventories every inventory_*.py script so new entries cannot
      bypass the contract. An inventory cited in the artifact's
      `## Commands Run` must engage >=2 declared non-headline fields (one is
      enough when only one is declared; validate-inventory-consumption enforces).
      Inventory scripts resolve under `$SKILL_DIR/scripts/`; detail_refs under
      `references/`.
    areas:
      - area: cli-operator-surface
        scope: repo ships or changes an operator CLI, command registry, or installable entrypoint
        inventories:
          - inventory_cli_ergonomics.py
          - inventory_cli_side_effect_probes.py
        detail_refs:
          - cli-ergonomics-smells.md
          - installable-cli-probes.md
      - area: docs-readability
        scope: first-touch/entrypoint docs or reader-facing public specs are in scope
        inventories:
          - inventory_entrypoint_docs_ergonomics.py
          - inventory_public_spec_quality.py
        detail_refs:
          - entrypoint-docs-ergonomics.md
          - public-spec-layering.md
      - area: skills
        scope: the repo authors public or support skills
        inventories:
          - inventory_skill_ergonomics.py
          - suggest_public_skill_dogfood.py
        detail_refs:
          - skill-quality.md
          - skill-ergonomics.md
      - area: runtime-test-economics
        scope: slow tests, runtime cost, budgets, or broad test/spec economics are in scope
        inventories:
          - inventory_standing_gate_verbosity.py
          - inventory_standing_test_economics.py
          - inventory_command_dominance.py
          - inventory_structural_waste.py
          - inventory_ci_recoverable_gates.py
          - render_runtime_summary.py
        detail_refs:
          - standing-gate-verbosity.md
          - testability-and-selection.md
          - proof-path-efficiency.md
          - cost-dominance.md
          - executable-spec-economics.md
          - ci-recoverable-gate-triage.md
      - area: agent-production-runtime
        scope: repo evidence shows a production LLM/agent serving path (serving-path client, model routing/fallback, runtime telemetry); never eval fixtures, skill docs, or offline scaffolding
        detail_refs:
          - agent-production-runtime.md
          - behavior-testing.md
      - area: source-hygiene
        scope: dual implementations, clone families, brittle source guards, lint suppressions, dead code, gitignore hygiene, or hardcoded polyglot discovery lists are in scope
        inventories:
          - inventory_dual_implementation.py
          - inventory_brittle_source_guards.py
          - inventory_lint_ignores.py
          - inventory_nose_clones.py
          - inventory_gitignore_scan_hygiene.py
          - inventory_hardcoded_discovery.py
          - run_dead_code_advisory.py
        detail_refs:
          - dual-implementation-parity.md
          - brittle-source-guards.md
          - lint-ignore-discipline.md
          - dup-ratchet.md
          - quality-signal-scorecard.md
      - area: adapter-gate-design
        scope: adapter policy or gate design is in scope
        inventories:
          - inventory_adapter_gate_design.py
        detail_refs:
          - adapter-gate-review.md
      - area: security-supply-chain
        scope: security posture or supply-chain proof separation is in scope
        detail_refs:
          - security-overview.md
          - security-npm.md
          - security-pnpm.md
          - security-uv.md
      - area: coverage-eval-depth
        scope: coverage floors, prompt/content assets, or eval depth are in scope
        detail_refs:
          - coverage-floor-policy.md
          - prompt-asset-policy.md
  gate_classification:
    closeout_states:
      healthy: present, runnable, high-signal for the seam it covers
      weak: >-
        present but easy to game, too shallow for the claimed confidence,
        duplicated by a better gate, OR a green non-shallow gate STILL paying
        standing runtime after a cheaper, more-direct proof now covers the same
        seam (cost-redundancy alone makes a working gate weak)
      missing: should exist for the current risk surface but is absent or only implied
      deferred: useful later, not the next highest-leverage gate for the current state
    note: >-
      these four states are the required ## Healthy / ## Weak / ## Missing /
      ## Deferred closeout sections; classify every gate before recommending moves
    ranking_is_advisory: >-
      Recommended Next Quality Moves ordering is an inference-layer proxy — answer
      its interpretation question for THIS repo before trusting the rank
    candidate_floor: exceptional; needs explicit north-star + floor-addition-restraint provenance
    detail_ref: references/gate-classification.md
  automation_promotion:
    cases:
      AUTO_EXISTING: >-
        already enforced by a meaningful deterministic gate; do not re-report as a
        manual finding without added repo interpretation
      AUTO_CANDIDATE: >-
        should become a deterministic gate; propose the gate before more policy prose
      NON_AUTOMATABLE: >-
        still needs judgment/tradeoffs/human review; belongs in prose findings and proposals
    inference_layer_rule: >-
      for any inference-layer advisory (clone %, ergonomics heuristics, rankings,
      length/pressure smells, runtime trends) answer its self-declared
      interpretation question for THIS repo before repeating/ranking/escalating;
      each inventory emits its own question at run time
    detail_ref: references/automation-promotion.md
  maintainer_local_enforcement:
    field_discipline: >-
      record a Maintainer-Local Enforcement disposition; 'Unclear' is not
      acceptable — default to `missing` until the gap is closed or explicitly
      deferred with a reason
    detail_ref: references/maintainer-local-enforcement.md
    standing_prompt: >-
      If the repo has a canonical final stop-before-finish gate, record HOW it is
      enforced before push in maintainer clones (checked-in hook + clone
      validator, repo-owned installer, or explicit documented omission).
    detected_prompt_template: >-
      DETECTED a canonical final gate ({gates}): before calling operability
      healthy, record HOW it is enforced before push in maintainer clones
      (checked-in hook + clone validator, a repo-owned installer, or an explicit
      documented decision to omit hooks with a named CI owner). A green gate that
      clones can push around is an enforcement gap that happens to compile.
