# Consumer-facing packaged validators.
#
# Every packaged module whose basename carries `check_` or `validate_` ANYWHERE is
# represented below. `consumer_facing: false` is an intentional exclusion, not an
# omission.
#
# The predicate is position-independent on purpose. The prefix-only form missed
# `skills/issue/scripts/issue_validate_closeout_draft.py` -- a packaged validator the
# issue-closeout floor invokes -- which then needed no decision and raised nothing.
# The token pair is deliberately NOT widened: `audit`/`guard`/`lint`/`verify` each
# look like the next reasonable entry and each would be a longer list rather than a
# better rule. The checker reports `uncovered_module_count` instead, so this
# catalog's green does not read as coverage it does not have.
schema_version: 1
catalog_id: consumer-validator-catalog
package_root: plugins/charness
candidate_patterns:
  - '**/*check_*.py'
  - '**/*validate_*.py'
scanner_exclusions:
  - path: scripts/check_consumer_validator_catalog.py
    reason: "the checker is the fixed source-side scanner and is not a product validator"
consumer_contract:
  source: packaged
  selection_field: consumer_facing
  no_substitute: "Use the packaged validator named here instead of creating a consumer-specific substitute."
adoption_policy:
  declaration_path: .agents/consumer-validator-adoption.yaml
  exactly_one_of:
    - wired
    - opt_out_reason
validators:
  - path: scripts/check_artifact_referents.py
    consumer_facing: false
    decision: exclude
    reason: "Charness-internal quality, packaging, or development gate, not a consumer-authored artifact contract"
  - path: scripts/check_artifact_surface_preflight.py
    id: artifact-surface-preflight
    consumer_facing: true
    decision: publish
    artifact_type: artifact-surface
    adoption_policy: wire-or-opt-out
    reason: "consumer-facing artifact or closeout contract; the packaged path is the source of truth for consuming repositories"
    purpose: "preflights a consumer-authored artifact surface before writing it"
    invocation: "python3 <plugin-root>/scripts/check_artifact_surface_preflight.py"
  - path: scripts/check_artifact_citations.py
    id: artifact-citations
    consumer_facing: true
    decision: publish
    artifact_type: durable-artifact-citations
    adoption_policy: wire-or-opt-out
    reason: "reports syntactic path-and-line citation integrity for consumer-authored durable artifacts"
    purpose: "checks selected durable Markdown citations without claiming semantic truth"
    invocation: "python3 <plugin-root>/scripts/check_artifact_citations.py --repo-root <repo-root> --paths <artifact-path>"
  - path: scripts/check_changed_line_mutation_coverage.py
