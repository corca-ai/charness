version: 1
repo: my-repo
language: en
output_dir: charness-artifacts/handoff
preset_id: portable-defaults
customized_from: portable-defaults
# Optional. CONTENT lines the handoff may occupy -- blank lines, the required `##`
# headings and the whole `## References` block are not counted. Named apart from
# debug/quality's `max_artifact_lines` because it measures something different.
# max_content_lines: 120
chunk_policy:
  max_package_sources: 5
  broad_boundary_tokens:
    - label/enhancement
    - label/bug
  allowed_broad_boundary_tokens: []
