# charness worktree adapter - declares how `charness worktree prepare` makes a
# freshly-created git worktree usable, and which extra `charness worktree doctor`
# checks decide whether the worktree is ready.
#
# argv lists must use block-style YAML (charness's repo-local loader does not
# parse inline `[a, b]` arrays). Edit the auto-detected commands below if the
# detection picked the wrong tool for this repo.
version: 1
repo: charness
language: en

prepare:
  commands:
    # Package manager auto-detected from package-lock.json (pm=npm).
    - id: install-deps
      description: "Install workspace dependencies via npm."
      timeout_seconds: 600
      argv:
        - npm
        - ci
    # No hook system detected. If your repo installs git hooks per worktree
    # (lefthook, husky, simple-git-hooks, or a repo-owned `hooks:install`
    # script), uncomment and adjust the block below.
    # - id: install-hooks
    #   description: "Re-run hook installer for this worktree."
    #   timeout_seconds: 60
    #   argv:
    #     - <your-package-manager>
    #     - exec
    #     - <your-hook-tool>
    #     - install
  # Licensed by the `covers` declaration below, not by a doctor verdict about
  # something else (#752). Without that declaration this reverts to running
  # `npm ci` on every prepare, which is the correct answer for a doctor that
  # cannot see dependency readiness.
  skip_if_doctor_passes: true
  # Before install-deps runs, link the parent tree's node_modules (reflink, then
  # hard links) when its package-lock.json digest matches, else the runtime
  # cache entry for that digest; npm ci runs only when neither exists (#792).
  dependency_reuse:
    command_id: install-deps
    lockfile: package-lock.json
    directory: node_modules

# Optional manifest-defined doctor checks layered on top of the canonical suite.
# The disable-able canonical suite (git_common_dir, hooks_path, lefthook_shim,
# husky_dir) sees nothing about installed dependencies, so it cannot license
# skipping install-deps. `worktree_isolation` also always runs and cannot be
# disabled.
doctor:
  checks:
    - id: npm_dependencies_installed
      description: "Installed npm tree satisfies package.json."
      # `npm ls --depth=0` is what makes this coverage claim honest rather than a
      # presence test: it exits 1 when node_modules is absent OR when the
      # installed tree does not satisfy package.json. Verified both arms on
      # 2026-08-29 -- exit 0 in this checkout, exit 1 against a copy of
      # package.json with no node_modules -- in 0.32s.
      timeout_seconds: 120
      argv:
        - npm
        - ls
        - --depth=0
      covers:
        - install-deps
