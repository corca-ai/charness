version: 1
commands:
  root:
    help_command: ./charness --help
    doc_paths:
      - README.md
      - docs/cli-reference.md
    required_help_contains:
      - init
      - doctor
      - update
      - version
      - reset
      - uninstall
      - task
      - catalog
      - capability
      - goal
      - tool
      - worktree
    required_doc_contains:
      - The CLI is there so humans and agents can inspect local harness state instead of guessing.
      - charness --help
      - charness doctor
      - charness update
      - CLI Reference
  task:
    help_command: ./charness task --help
    doc_paths:
      - docs/agent-task-runs.md
      - docs/cli-reference.md
    required_help_contains:
      - status
      - run
    required_doc_contains:
      - charness task run
      - charness task status
  init:
    help_command: ./charness init --help
    doc_paths:
      - README.md
      - docs/cli-reference.md
    required_help_contains:
      - --skip-cli-install
      - --skip-claude-wrapper
      - --detail
    required_doc_contains:
      - Make sure your machine has Python 3.
      - /tmp/charness-init.sh
      - charness init
  doctor:
    help_command: ./charness doctor --help
    doc_paths:
      - README.md
      - docs/cli-reference.md
    required_help_contains:
      - --write-state
      - --next-action
      - --detail
    required_doc_contains:
      - charness doctor
      - --next-action
  update:
    help_command: ./charness update --help
    doc_paths:
      - README.md
      - docs/cli-reference.md
    required_help_contains:
      - --no-pull
      - --skip-codex-cache-refresh
      - --detail
    required_doc_contains:
      - charness update
      - charness update all
      - Refresh the installed surface
  version:
    help_command: ./charness version --help
    doc_paths:
      - docs/cli-reference.md
    required_help_contains:
      - --verbose
      - --check
    required_doc_contains:
      - charness version
  reset:
    help_command: ./charness reset --help
    doc_paths:
      - docs/cli-reference.md
    required_doc_contains:
      - charness reset
      - Remove host plugin state for Codex and Claude while preserving the managed checkout and CLI.
  uninstall:
    help_command: ./charness uninstall --help
    doc_paths:
      - docs/cli-reference.md
    required_help_contains:
      - --delete-checkout
      - --delete-cli
    required_doc_contains:
      - charness uninstall
      - Remove the managed local install surface.
  capability:
    help_command: ./charness capability --help
    doc_paths:
      - docs/cli-reference.md
      - docs/capability-resolution.md
    required_help_contains:
      - init
      - resolve
      - doctor
      - env
      - explain
    required_doc_contains:
      - charness capability init
      - charness capability resolve slack.default
      - charness capability doctor slack.default
      - repo-local capability config
  tool:
    help_command: ./charness tool --help
    doc_paths:
      - docs/cli-reference.md
      - docs/control-plane.md
      - docs/external-integrations.md
    required_help_contains:
      - doctor
      - repair
      - sync-support
      - install
      - update
    required_doc_contains:
      - charness tool install --recommendation-role validation --next-skill-id quality
      - charness tool update agent-browser
      - persist manual install guidance
  goal:
    help_command: ./charness goal --help
    doc_paths:
      - docs/cli-reference.md
      - docs/development.md
    required_help_contains:
      - run
    required_doc_contains:
      - charness goal run
      - Issue-Native Goal Run
  goal-run:
    help_command: ./charness goal run --help
    doc_paths:
      - docs/cli-reference.md
      - docs/development.md
    required_help_contains:
      - --objective
      - --repo-root
      - --charness-checkout
    required_doc_contains:
      - charness goal run
      - /goal #N
      - --charness-checkout
      - no local artifact path
  task-status:
    help_command: ./charness task status --help
    doc_paths:
      - docs/cli-reference.md
    required_help_contains:
      - task_id
    required_doc_contains:
      - charness task status
  task-run:
    help_command: ./charness task run --help
    doc_paths:
      - docs/agent-task-runs.md
      - docs/cli-reference.md
    required_help_contains:
      - --lane
      - --path
      - --branch
      - --base
      - --scope
      - --prompt
      - --prompt-file
      - --effort
    required_doc_contains:
      - charness task run
      - --lane feature-lane
      - clean parent
      - external runtime
  catalog:
    help_command: ./charness catalog --help
    doc_paths:
      - docs/cli-reference.md
    required_help_contains:
      - list
      - refresh
      - resolve-skill-path
    required_doc_contains:
      - charness catalog list
      - charness catalog refresh
  catalog-list:
    help_command: ./charness catalog list --help
    doc_paths:
      # Was AGENTS.md: the router is not the owner of a CLI usage example, and
      # pinning one there is what regrows it into a second operating manual.
      - docs/external-integrations.md
      - docs/cli-reference.md
    required_help_contains:
      - --repo-root
    required_doc_contains:
      - charness catalog list --repo-root <repo>
  catalog-refresh:
    help_command: ./charness catalog refresh --help
    doc_paths:
      - docs/cli-reference.md
    required_help_contains:
      - --repo-root
    required_doc_contains:
      - charness catalog refresh
  catalog-resolve-skill-path:
    help_command: ./charness catalog resolve-skill-path --help
    doc_paths:
      - docs/cli-reference.md
    required_help_contains:
      - --skill-id
      - --reported-path
    required_doc_contains:
      - charness catalog resolve-skill-path
  capability-init:
    help_command: ./charness capability init --help
    doc_paths:
      - docs/cli-reference.md
      - docs/capability-resolution.md
    required_help_contains:
      - --force
      - --target-repo-root
    required_doc_contains:
      - charness capability init
  capability-resolve:
    help_command: ./charness capability resolve --help
    doc_paths:
      - docs/cli-reference.md
      - docs/capability-resolution.md
    required_help_contains:
      - logical_id
      - --target-repo-root
    required_doc_contains:
      - charness capability resolve slack.default
  capability-doctor:
    help_command: ./charness capability doctor --help
    doc_paths:
      - docs/cli-reference.md
      - docs/capability-resolution.md
    required_help_contains:
      - logical_id
    required_doc_contains:
      - charness capability doctor slack.default
  capability-env:
    help_command: ./charness capability env --help
    doc_paths:
      - docs/cli-reference.md
      - docs/capability-resolution.md
    required_help_contains:
      - logical_id
    required_doc_contains:
      - charness capability env slack.default
  capability-explain:
    help_command: ./charness capability explain --help
    doc_paths:
      - docs/cli-reference.md
      - docs/capability-resolution.md
    required_help_contains:
      - skill_id
    required_doc_contains:
      - charness capability explain gather
  tool-doctor:
    help_command: ./charness tool doctor --help
    doc_paths:
      - docs/cli-reference.md
      - docs/control-plane.md
    required_help_contains:
      - --no-write-locks
      - --detail
      - tool_ids
  tool-repair:
    help_command: ./charness tool repair --help
    doc_paths:
      - docs/cli-reference.md
      - docs/control-plane.md
    required_help_contains:
      - --execute
      - --detail
    required_doc_contains:
      - charness tool repair
  tool-sync-support:
    help_command: ./charness tool sync-support --help
    doc_paths:
      - docs/cli-reference.md
      - docs/control-plane.md
    required_help_contains:
      - --upstream-checkout
      - --dry-run
      - --detail
  tool-install:
    help_command: ./charness tool install --help
    doc_paths:
      - docs/cli-reference.md
      - docs/control-plane.md
    required_help_contains:
      - --recommendation-role
      - --next-skill-id
      - --detail
    required_doc_contains:
      - charness tool install --recommendation-role validation --next-skill-id quality
  tool-update:
    help_command: ./charness tool update --help
    doc_paths:
      - docs/cli-reference.md
      - docs/control-plane.md
    required_help_contains:
      - --skip-sync-support
      - --detail
      - tool_ids
    required_doc_contains:
      - charness tool update agent-browser
  worktree:
    help_command: ./charness worktree --help
    doc_paths:
      - docs/cli-reference.md
      - docs/worktree-prepare.md
    required_help_contains:
      - create
      - add
      - doctor
      - prepare
      - audit
      - cleanup
    required_doc_contains:
      - charness worktree create
      - charness worktree doctor
      - charness worktree prepare
      - charness worktree audit --doctor
      - charness worktree cleanup
      - .agents/worktree-adapter.yaml
  worktree-create:
    help_command: ./charness worktree create --help
    doc_paths:
      - docs/cli-reference.md
      - docs/worktree-prepare.md
    required_help_contains:
      - --path
      - --branch
      - --prepare
      - --ephemeral
      - --owned
    required_doc_contains:
      - charness worktree create --path
  worktree-add:
    help_command: ./charness worktree add --help
    doc_paths:
      - docs/cli-reference.md
      - docs/worktree-prepare.md
    required_help_contains:
      - --path
      - --branch
      - --prepare
      - --ephemeral
      - --owned
    required_doc_contains:
      - charness worktree add --path
  worktree-exec:
    help_command: ./charness worktree exec --help
    doc_paths:
      - docs/cli-reference.md
      - docs/worktree-prepare.md
    required_help_contains:
      - --repo-root
      - external runtime caches
    required_doc_contains:
      - charness worktree exec
      - external runtime
  worktree-doctor:
    help_command: ./charness worktree doctor --help
    doc_paths:
      - docs/cli-reference.md
      - docs/worktree-prepare.md
    required_help_contains:
      - --repo-root
      - --require-isolation
    required_doc_contains:
      - charness worktree doctor
  worktree-prepare:
    help_command: ./charness worktree prepare --help
    doc_paths:
      - docs/cli-reference.md
      - docs/worktree-prepare.md
    required_help_contains:
      - --repo-root
      - --force
    required_doc_contains:
      - charness worktree prepare
  worktree-audit:
    help_command: ./charness worktree audit --help
    doc_paths:
      - docs/cli-reference.md
      - docs/worktree-prepare.md
    required_help_contains:
      - --repo-root
      - --doctor
    required_doc_contains:
      - charness worktree audit --doctor
  worktree-cleanup:
    help_command: ./charness worktree cleanup --help
    doc_paths:
      - docs/cli-reference.md
      - docs/worktree-prepare.md
    required_help_contains:
      - --path
      - --delete-merged-branch
      - --yes
    required_doc_contains:
      - charness worktree cleanup --path
