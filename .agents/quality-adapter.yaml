version: 1
repo: charness
language: en
output_dir: charness-artifacts/quality
preset_id: python-quality
customized_from: python-quality
preset_lineage:
  - python-quality
  - specdown-quality
coverage_fragile_margin_pp: 1.0
coverage_floor_policy:
  min_statements_threshold: 30
  fail_below_pct: 85.0
  warn_ceiling_pct: 95.0
  floor_drift_lock_pp: 1.0
  exemption_list_path: scripts/coverage-floor-exemptions.txt
  gate_script_pattern: scripts/check_coverage.py
  lefthook_path: lefthook.yml
  ci_workflow_glob: .github/workflows/*.yml
specdown_smoke_patterns:
  - "\\bgrep\\s+-q\\b"
  - "\\[pycheck\\]"
  - "\\b(?:uv\\s+run\\s+)?python\\s+-m\\s+pytest\\b"
  - "\\bpytest\\b.*\\s+-k\\s+"
spec_pytest_reference_format: "Covered by pytest:\\s+`tests/[^`]+`(?:,\\s*`tests/[^`]+`)*"
recommendation_defaults_version: issue-64
public_spec_section_exemptions:
  - Fixed Decisions
  - HTTP API contract
  - Server backend stack
  - Deferred Decisions
  - Non-Goals
public_spec_implementation_ref_density_floor: 0.02
public_spec_implementation_guard_min_lines: 100
public_spec_pointer_proof_markers:
  - "proof: pointer"
  - "proof: pointer-spec"
  - "executable_proof: pointer"
  - "public_spec_proof: pointer"
prompt_asset_roots: []
adapter_review_sources:
  - .agents/quality-adapter.yaml
  - skills/public/quality/references/adapter-contract.md
acknowledged_recommendations: []
gate_design_review_globs:
  - .agents/*-adapter.yaml
  - skills/public/*/adapter.example.yaml
  - scripts/*.py
product_surfaces:
  - installable_cli
  - bundled_skill
cli_skill_surface_probe_commands:
  - ./charness --help
  - ./charness doctor --help
  - ./charness --version
  - env CHARNESS_AGENT_BROWSER_IGNORE_ORPHANS=1 python3 scripts/doctor.py --repo-root . --json --skip-release-probe
cli_skill_surface_command_docs:
  - .agents/command-docs.yaml
cli_skill_surface_change_globs:
  - charness
  - scripts/**
  - skills/public/**
  - skills/shared/**
  - skills/support/**
  - plugins/**
  - .claude-plugin/**
  - .agents/plugins/**
  - packaging/**
  - .agents/command-docs.yaml
canonical_markdown_surfaces:
  - AGENTS.md
  - CLAUDE.md
  - docs/handoff.md
prompt_asset_policy:
  source_globs:
    - scripts/**/*.py
    - skills/**/*.py
    - tests/**/*.py
  min_multiline_chars: 400
  exemption_globs:
    - plugins/**
    - skills/shared/references/success-criteria-review.md
    - .artifacts/**
domain_language_contract:
  surface_globs:
    - README.md
    - docs/**/*.md
    - skills/public/**/*.md
    - skills/shared/**/*.md
    - charness
    - scripts/**/*.py
  exemption_globs:
    - skills/public/quality/references/adapter-contract.md
  terms:
    - id: external-tool-cli
      canonical: charness tool
      deprecated_aliases:
        - charness install <tool>
        - charness sync-support
        - charness update-tools
    - id: support-capability-taxonomy
      canonical: support capability
      allowed_aliases:
        - support skill
        - integration manifest
        - integration
    - id: repo-initialization-skill
      canonical: setup
      allowed_aliases:
        - initialize this repo
        - repo initialization
skill_ergonomics_gate_rules:
  - dated_incident_in_core
  - long_core
  - issue_anchor_in_core
  - mode_option_pressure_terms
  - portable_package_dated_incident
  - portable_package_issue_anchor
  - progressive_disclosure_risk
  - code_fence_without_helper_script
  - portable_helper_path_ambiguity
runtime_profile_default: default
runtime_budgets:
  run-quality-read-only: 120000
  charness-version: 500
  check-cli-skill-surface: 11000
  pytest: 70000
  check-coverage: 15000
  doc-duplicates: 28000
  # Same (contended) relevel as the x86_64 profile below: these two ran under their
  # old bars only while a barrier kept them off pytest's cores. Note this map binds
  # ONLY on a host that sets CHARNESS_RUNTIME_PROFILE=default (a named machine
  # profile replaces it wholesale), so these numbers are 36-CPU contention figures
  # generalized to an unmeasured machine — loose on purpose, for the same
  # fail-open-not-block reason as the aarch64 block below.
  check-markdown: 17000
  # Tracks the x86_64 profile's 2026-08-07 relevel (measured max 17669ms there).
  check-secrets: 19500
  run-evals: 6500
  specdown: 10500
runtime_budget_profiles:
  local-linux-x86_64-36cpu:
    # 2026-07-26 relevel. `run-quality.sh` dropped the two barriers that separated
    # independent gates, so every cheap gate now runs ALONGSIDE `pytest` and its 16
    # xdist workers instead of before it. That cut ~10s of wall (63s -> ~53s) and it
    # changed what a per-gate bar measures: contended wall time, not isolated gate
    # time. `check-markdown` went 4.9s -> 10.2-11.8s with no change to the gate.
    # Nine bars below are re-drawn at ~1.4x the CONTENDED max of the post-change
    # window (samples at or after 2026-07-25T15:34, n=13 for the standing gates) and
    # are marked `(contended)`. They are honestly looser: a 2x regression
    # in one of those gates can now hide. The teeth move to where the maintainer
    # actually feels time — the aggregate `run-quality-read-only` bar and `pytest`,
    # both TIGHTENED below against the same window. Sizing any of these from the
    # pre-change window would draw a bar the layout can no longer honor.
    budgets:
      charness-version: 500
      # (contended) was 5000; post-change max 5933
      # The lane's cost scales with base..HEAD distance, so this bar is a RANGE
      # ceiling, not a per-run expectation: ~24s for one commit is the common case and
      # 300000 is the documented nine-commit figure. It had no bar at all while being
      # the most expensive gate in the bundle, which is how the aggregate above went
      # stale unnoticed.
      #
      # 2026-07-30: 300000 -> 400000 (operator-directed). The recent median crossed by
      # 0.8% (302429 vs 300000) while closing #465, which fails the gate by the
      # documented median rule. Two things were checked before raising rather than
      # after: (1) the slice under review added a test-reference-map call to this
      # gate's BLOCKING path, and it was MEASURED at 2.4-2.5s of a ~352s run, so it is
      # not the cause; (2) the same window holds runs at 103000-223000ms, which is the
      # range-ceiling property above, not variance.
      #
      # 400000, NOT the 500000 that 1.4x-worst-observed (356859ms, n=1069) would give.
      # The first cut used 500000 and `test_the_pre_push_aggregate_bar_covers_the_armed
      # _lane_it_now_contains` refused it: both aggregate bars must CLEAR this one,
      # because the aggregate wall is lane-dominated. Raising this to 500000 would have
      # forced both aggregates up with it. 400000 still clears the worst observed run,
      # keeps the aggregates at 420000, and is the smaller move — so the relationship
      # that test pins decided the number, and it decided it tighter.
      check-changed-line-mutation-coverage: 400000
      check-cli-skill-surface: 8500
      check-inventory-declaration-coverage: 500
      check-references-link-inventory: 800
      # 2026-07-26: was 2000, which the slack advisory reported at 3.5x its 572ms worst
      # recent run -- i.e. it could no longer fail. Acting on the advisory rather than
      # leaving it to re-report: n=20, all passing, range 520-572ms, so this window is
      # unusually tight and 1000 (1.4x worst, the standard derivation) still absorbs
      # nearly 2x the observed spread.
      check-seed-fixture-budget: 1000
      # The 2.5s limit was set in May; a 5s bar replaced it because the release
      # gate observed a 4404ms peak. That 5s bar predates the barrier removal.
      # (contended) was 5000; post-change max 6980
      check-spec-evidence-durability: 10000
      inventory-ci-local-gate-parity: 500
      inventory-sloc: 500
      # NOT a contention casualty: post-change max is 1081 and the old 1200 bar was
      # never approached, contended or not. 1200 was simply too tight to be a bar
      # (1.11x max); 1500 is 1.39x max and still 1.43x median.
      inventory-ubiquitous-language: 1500
      # Tightened from 90000: the barrier removal made the whole read-only run
      # faster, and this aggregate is the bar that still has to trip on a real
      # slowdown. 1.4x the 54535ms max of the post-change window.
      #
      # 2026-07-26 (b): retightened again from 76500. `--maxschedchunk 1` removed
      # xdist's pre-assigned initial batch, and `pytest` — which IS essentially this
      # aggregate's wall — went 52.1s -> 35.4s contended. 76500 was 1.9x the new
      # median, at the "cannot trip a 2x regression" line this block exists to hold.
      # 1.4x the 41623ms max of the window, which was run to 20/20 post-change before
      # this number was set (see the ENFORCEMENT NOTE under `pytest`), so no pre-flag
      # sample remains in the basis. Median 37531, i.e. the bar is 1.41x worst and
      # 1.56x median. Two early samples in the turnover were `fail` runs and a failing
      # aggregate EXITS EARLY — a truncated wall, not a measurement — but the max this
      # is drawn from is a passing run and those samples have since aged out.
      #
      # 2026-07-30: RAISED 58500 -> 305000, and this is the bar that actually stops
      # a push (`.githooks/pre-push` runs `--read-only`; `check-runtime-budget` runs
      # in both modes). The basis above is entirely PRE-D40: the armed changed-line
      # lane is queued unconditionally, so it is now inside every read-only run, and
      # the window shows it — latest 90618ms against a 58500 bar, already reporting
      # `latest-spike`, with two 551.7s range runs in the same 20. Enforcement is
      # median-of-20, so the current median 40051 has not crossed it yet; that is a
      # countdown, not a margin, and the failure would be a hard pre-push stop with
      # nothing regressed.
      #
      # Sized from the lane's documented ceiling plus the MEASURED aggregation
      # overhead, not from the window's max (551780 is a transient six-commit range
      # and baking it in would leave a guard nothing can trip). Six paired samples in
      # `.charness/quality/history` put the aggregate wall at lane + 2565..2848ms
      # (81582/84272, 87738/90403, 87661/90264, 88246/90811, 88498/91140,
      # 87770/90618 read-only): the gates run CONCURRENTLY, so the aggregate is
      # lane-dominated rather than lane-plus-the-rest. 300000 (the lane's own bar
      # above) + ~3000 + rounding = 305000.
      #
      # Correcting the record while here: the `run-quality-full: 420000` derivation
      # below states "+ the ~120000 the rest of the full bundle costs". Those same
      # paired samples falsify the additive model. 420000 still holds as "a lane of
      # ~417000", with slack over this bar for the full mode's extra gates, but the
      # stated reasoning was wrong and is not load-bearing for either number.
      #
      # 2026-07-30: 305000 -> 420000 (operator-directed). Recent median crossed by
      # 0.14% (305424 vs 305000) — the thinnest possible failure, on the same #465
      # window as the lane above and from the same cause (a wide changed-test surface,
      # not a code regression).
      #
      # 420000 matches `run-quality-full` and clears the lane's new 400000, which
      # `test_the_pre_push_aggregate_bar_covers_the_armed_lane_it_now_contains` requires
      # of both aggregates. A first cut here reasoned that this bar could sit BELOW the
      # lane's because it is "the wall an operator actually feels"; that test refuted it
      # in one line, and correctly — the aggregate is lane-dominated, so a bar under the
      # lane's fails on the gate's own documented cost with nothing regressed. Recorded
      # because the wrong version of this reasoning is the tempting one.
      run-quality-read-only: 420000
      # 2026-07-25 retune. A runtime budget only ever moved one way here: a
      # violation forced a raise and nothing reported when the raise stopped being
      # needed, so several budgets had drifted to 6-10x their worst observed run
      # and could no longer fail. `check-coverage` is the clearest case — raised
      # 45000 -> 55000 on 2026-06-14 for "brushing its budget", it now peaks at
      # 7835ms. `pytest` had also drifted ABOVE the slower aarch64 profile's
      # 110000, which is backwards. Values below are ~1.4-1.5x the worst run in
      # the recent 20-sample window for this profile: still absorbs variance, but
      # a genuine 2x regression trips. `check_runtime_budget`'s new slack advisory
      # now reports this class so it cannot silently re-inflate.
      #
      # 2026-07-26: retightened from 90000, closing the deliberate revisit the
      # comment below records. The conflated-window objection no longer applies —
      # this window is standing-mode only AND post-barrier-removal, so 1.4x its
      # 52138ms max is drawn from the regime the gate now runs in.
      #
      # 2026-07-26 (b): 73000 lasted one day. `--maxschedchunk 1` (see
      # `choose_sched_chunk` in scripts/run_standing_pytest.py) took this gate from
      # 52.1s to 35.4s contended, which put 73000 at 2.04x the new median — the same
      # ratio the affinity-holes critique failed a bar for. 1.4x the 41702ms max of
      # the window at the time it was set; the window is 20/20 post-change and has
      # since settled to max 38030 / median 34176, leaving the bar at 1.54x worst and
      # 1.71x median — headroom this label deliberately keeps, because it is the one
      # that survives a suppressed flag (the ~52s pre-flag regime stays under it).
      #
      # ENFORCEMENT NOTE, and the reason the window was deliberately turned over
      # before this number was set: `runtime_budget_lib._checked_entry` compares the
      # bar against `median_recent_elapsed_ms` — the WHOLE 20-sample window — not
      # against the post-change slice a retune is sized from. Immediately after a
      # regime change those two disagree, and a slice-sized bar can sit a few percent
      # above the enforcement basis while every comment reads correct. A first pass at
      # 51000 did exactly that on the two aggregates below (1.02x and 1.03x of basis).
      # Sizing from a slice while enforcing on a window is only safe once the window
      # has turned over, so it was, by running the gate to convergence.
      #
      # 2026-08-05 (#503): measured retune 58500 -> 97500 for this local profile.
      # The current 20-sample cohort is latest 60356ms, median 61816ms, max 69353ms;
      # `check_runtime_budget.py --runtime-profile local-linux-x86_64-36cpu
      # --suggest-budgets` derives 97500ms (1.4x max, 1.58x median, and still below
      # 2x median). This replaces a stale pre-cohort bar; it does not remove the
      # runtime gate. Owner: quality owns runtime telemetry and budget records,
      # including the aggregate/release dispositions; achieve owns the goal-level
      # over-slice response. The #505 matched-cost experiment is the next decision
      # destination for the retained aggregate/release signals.
      pytest: 97500
      # 2026-07-25: the release-path variants were the slowest observed labels on
      # this profile and the only unbudgeted ones, so a 2x regression on the gate
      # that actually precedes a release would not have tripped anything. Same
      # ~1.4x-worst-recent-run policy as the retune above.
      # `run-quality-read-only-release` has only 2 samples, so a 1.4x bar would be
      # drawn from noise. A DELIBERATELY LOOSE bar is not a flaky bar though: 150000
      # is 1.7x the worse of the two samples (cannot flake) and still under 2x the
      # median (trips a real regression). Leaving it unbudgeted was the state this
      # very comment calls the bug. Tighten when the window fills.
      #
      # 2026-07-26: that "tighten when the window fills" is now overdue and the
      # claim above went false. The window holds 4 samples with median 71319, so
      # 150000 is ABOVE 2x median — the bar can no longer trip the 2x regression its
      # own comment promises, which is exactly the anti-pattern this block was
      # written to fix. The barrier removal cut this path further (66175ms observed),
      # so 110000 comes back under 2x median. Still deliberately loose; still able to
      # fail.
      #
      # 2026-07-26 (b): the sentence above originally also claimed 110000 "stays above
      # 1.4x the worst sample in the window (86353)". That is false and is corrected
      # here rather than carried: 1.4 * 86353 = 120894, so 110000 is 1.27x that
      # sample. The number is left alone because 86353 is a 2026-07-20 run predating
      # BOTH the barrier removal and `--maxschedchunk 1`, and against the only
      # current-regime evidence this label has (60198ms, the newest passing run)
      # 110000 is 1.83x — no flake risk in practice. What it does not have is a single
      # sample under `--maxschedchunk 1`; unlike its siblings nothing revalidated it,
      # so it is owed a re-derive on its next release-path run, not a number invented
      # now from a regime that no longer exists.
      run-quality-read-only-release: 110000
      run-quality-full-release: 125000
      # 9 samples, not 20 -- looser evidence than the labels above, tight enough to
      # trip 2x (median 67172).
      #
      # 2026-07-26 (b): resized with its read-only sibling for the `--maxschedchunk 1`
      # regime. 100000 was 2.6x the new median. 1.4x the 44183ms max of the window,
      # run to 20/20 post-change before this number was set; median 38208, so the bar
      # is 1.40x worst and 1.62x median. The 44183 max is a genuine contended
      # observation from consecutive gate runs, not an outlier to discount — which is
      # why this bar is the loosest of the three.
      #
      # This label is the one most exposed to a SUPPRESSED flag: 62000 sits below the
      # 67172ms pre-flag median recorded above, so if `--maxschedchunk 1` stops being
      # applied this bar reds with nothing regressed. Two of the three suppression
      # paths are involuntary (xdist < 3.2, an unrelated PYTEST_ADDOPTS tuning), so
      # `choose_sched_chunk` returns a reason and the runner prints it to stderr
      # rather than leaving that red pointing nowhere.
      # The armed changed-line lane (D40, 2026-07-29) is the dominant term now and
      # was never accounted for here: its documented cost is ~24s for a one-commit
      # slice and ~5min for a nine-commit range, so a 62000 aggregate contradicted an
      # accepted design decision from the session before this one. 420000 = the lane's
      # documented 300000 nine-commit ceiling plus the ~120000 the rest of the full
      # bundle costs (median 182640 observed; the 'small changed pool' reading was wrong -- that run's lane alone was 180557ms).
      #
      # Sized from the DOCUMENTED range cost, NOT from this session's worst run. The
      # observed 549239ms came from a six-commit UNPUSHED range: `--suggest-budgets`
      # proposed 769000 from it, which would bake a transient base..HEAD distance in
      # as the permanent bar and leave a guard nothing could trip. That is the
      # transcribe-a-bar-below-what-you-measured class inverted, and it is why this
      # number is not the suggester's.
      run-quality-full: 420000
      # `pytest` now records standing-mode runs only (release-only pytest moved to
      # its own `pytest-release` label). This 90000 was sized from the CONFLATED
      # window and is loose for standing mode alone. Note the slack advisory will
      # NOT flag it: BUDGET_SLACK_FACTOR is 3.0 and 90000/41826 is 2.15, so this
      # retune is owed a deliberate revisit, not an automatic one.
      #
      # `pytest-release` has no samples under its own label yet. Sized from the only
      # evidence that exists -- the conflated window's 62483ms max, which the release
      # mode dominates -- at the same 1.4x. A first pass at 125000 was rejected in
      # release critique: that is 1.4x the max of the whole `run-quality-full-release`
      # bundle CONTAINING this gate, so no possible run could trip it. A bar that
      # cannot fail is the exact anti-pattern the retune above was written to fix.
      #
      # 2026-07-26 (b): RAISED, against this block's usual direction, because the
      # substitute evidence above turned out to under-size it. `pytest-release` now
      # has its own 10-sample window (55.4-74.8s) and 87000 is 1.16x its worst
      # observed run — the `check-coverage` failure mode two entries down, not the
      # loose-bar one: it would have gone red on variance with nothing regressed.
      # 105000 is 1.4x that 74828ms max and still 1.63x median, under the 129062ms
      # 2x-median line. Unlike its read-only siblings this label did NOT move with
      # `--maxschedchunk 1` (median 64531 -> 66745 on an n=3 post-change slice, which
      # also contains the window maximum): the release-only lifecycle tests are the
      # longest single chains in the suite, so removing scheduler imbalance cannot
      # shorten them. Sized from the whole window rather than a post-change slice for
      # exactly that reason — and n=3 is stated because a slice that thin and a
      # 20-sample window read identically once committed.
      pytest-release: 105000
      # (contended) was 12000, which sat 259ms above an already-observed contended
      # run (11741) — it would have gone red on its own, weeks later, with nothing
      # regressed. This gate is queued conditionally, so its window turns over
      # slowly and the false red would have landed far from its cause.
      check-coverage: 16500
      # (contended) was 6000; post-change max 8146
      doc-duplicates: 11500
      # (contended) was 8000; post-change max 12098
      check-markdown: 17000
      # (contended) was 6000; post-change max 11639. 2026-08-07 relevel to 19500:
      # measured max 17669ms had grown past the 16500 bar.
      #
      # This profile's convention is 1.4x the contended max rounded to 500ms (header
      # above; `runtime_budget_sizing_lib.SLACK_SUGGESTION_HEADROOM = 1.4`), which would
      # give 25000. 19500 is deliberately TIGHTER -- 1.10x, the tightest ratio any current
      # sibling exhibits -- because the escape margin a bar buys is real and this one is
      # being raised to unblock a push, which is exactly when it should be raised least.
      # The smallest merely-passing value was ~16700 and would have re-blocked on the next
      # contended sample.
      #
      # What this is NOT: a slowdown in the check. Standalone it runs 7.6s (gitleaks
      # reports ~7.1s scanning 56.48 MB), i.e. 46% of the OLD bar. Every recorded sample
      # comes from the check running concurrently with ~85 sibling gates, so no
      # uncontended sample can exist for it, and the bar necessarily encodes contention
      # rather than the check's own cost. See #543.
      check-secrets: 19500
      # (contended) was 2000; post-change max 2089
      run-evals: 3000
      # (contended) was 5000; post-change max 6269
      specdown: 9000
      validate-cautilus-call-provenance: 500
      # (contended) was 6000; post-change max 10906
      validate-inventory-consumption-declaration: 15500
      # 2026-07-26: the three largest UNBUDGETED gates on this profile. They were
      # missed because this block's label set predates the question "what is expensive
      # here" -- and the aggregate does not cover them, since `pytest` at 52.1s is
      # essentially the 54.5s wall, so any of these could regress several-fold, finish
      # inside `pytest`, and trip nothing. Same 1.4x-of-worst-recent convention as the
      # relevel above, and all three windows are n=20 entirely post-barrier-removal, so
      # these are contended numbers without needing the `(contended)` caveat.
      check-export-safe-imports: 12000
      check-plugin-import-smoke: 9000
      check-documented-command-flags: 9000
      # 2026-07-26 (b): the two labels the previous pass left unbudgeted for want of
      # post-barrier-removal samples, resolved in opposite directions.
      #
      # `check-duplicates` is owed NOTHING and never was: it was renamed to
      # `check-doc-near-duplicates` on 2026-07-04 (f838ebf6), so nothing has emitted
      # that label in over a month and no run can ever re-derive it. Its stale window
      # is a dead alias in the machine-local signals file, not a measurement gap. The
      # live gate under the new name is ~1.2s and stays unbudgeted on cost grounds,
      # like every other sub-second label here. Recorded because "window owing a
      # re-derive" was carried into the handoff as debt for two sessions.
      #
      # `dead-code-advisory` is real and now measured: three runs this turn took its
      # window to n=7, entirely post-barrier-removal (7787-8747ms, median 8067).
      # 12500 is 1.4x that 8747ms max. It is opt-in (`CHARNESS_QUALITY_DEAD_CODE=1` or
      # an explicit label selection), so this bar only binds on a run that asked for
      # the gate -- which is precisely why it could sit unbudgeted so long.
      dead-code-advisory: 12500
  local-linux-x86_64-4cpu:
    # This profile HAD samples and no budgets, which is the one combination the gate
    # treats as a hard configuration error -- so `taskset -c 0-3 ./scripts/run-quality.sh`
    # exited 1 on this box for reasons that had nothing to do with runtime. The
    # samples were already recorded (three `taskset -c 0-3 --read-only` runs,
    # 2026-07-25T23:39-23:47); only the block was missing.
    #
    # WINDOW CAVEAT: the middle of those three runs FAILED (`pytest` 126440ms status
    # `fail`, and therefore `run-quality-read-only` 130279ms status `fail`). The bars
    # below are still arithmetically as claimed because they are drawn from
    # `max_recent`, which is a passing run in both cases -- but the window was n=3
    # containing one red, not three clean measurements. A failing run can exit early
    # and read FAST, so a median drawn from this window would be optimistic.
    #
    # 2026-07-26 (b): partly resolved, and the residue named. Two FULL 4-core runs this
    # turn (both 83/83 clean) took `pytest` to n=6 median 111025 and added the first
    # `run-quality-full`/`check-coverage` samples this profile has ever had. The red is
    # still IN the `pytest` and `run-quality-read-only` windows -- a window turns over
    # by age, not by being outvoted -- so a median read from either remains optimistic
    # until three more read-only runs land. The read-only bars below are deliberately
    # NOT retuned from the full-mode runs: different label, different queue.
    #
    # MEASURED, not derived from a contention factor: every value is 1.4x that
    # window's worst run for the label, rounded up to 500ms, as emitted by
    # `check_runtime_budget.py --runtime-profile local-linux-x86_64-4cpu --suggest-budgets`.
    #
    # Label scope is by OBSERVED COST on this profile, not by parity with the sibling
    # blocks. Parity was the first cut and it left `check-export-safe-imports` (27.3s,
    # the largest unbudgeted gate on this machine, unbudgeted on all three profiles)
    # with no bar at all, while spending bars on 600ms inventory gates. The aggregate
    # does not backstop that: `pytest` at 130.8s IS the 134.8s wall, so a standing gate
    # could go 27s -> 110s, finish inside `pytest`, and move no bar in this file. Every
    # label whose observed max is >=13s now has a bar; the sub-second sibling-parity
    # labels are kept because they are cheap and already proven elsewhere.
    #
    # Not all 84 recorded labels: a bar drawn from n=3 is weak evidence, and spraying
    # it across every gate buys breadth with noise.
    #
    # `check-coverage` is absent on purpose: it does not run in `--read-only`, so this
    # window contains no sample for it and any number here would be invented.
    budgets:
      charness-version: 1000
      check-cli-skill-surface: 29000
      check-inventory-declaration-coverage: 1000
      check-references-link-inventory: 2500
      check-seed-fixture-budget: 2000
      check-spec-evidence-durability: 26000
      inventory-ci-local-gate-parity: 500
      inventory-sloc: 1000
      inventory-ubiquitous-language: 3000
      pytest: 183500
      doc-duplicates: 51000
      check-markdown: 55500
      check-secrets: 107500
      run-evals: 13500
      specdown: 32000
      validate-cautilus-call-provenance: 1000
      validate-inventory-consumption-declaration: 55000
      # Cost centers above 13s that sibling-parity scoping missed. Same 1.4x-of-max
      # derivation; `check-export-safe-imports` is the largest unbudgeted gate on this
      # machine and had no bar on any profile.
      check-export-safe-imports: 38500
      validate-skill-ergonomics: 30000
      validate-inference-interpretation: 28000
      check-plugin-import-smoke: 27500
      validate-attention-state-visibility: 27000
      check-documented-command-flags: 27000
      check-python-runtime-inheritance: 26500
      validate-packaging-committed: 24000
      validate-adapters: 23000
      validate-usage-episodes: 22500
      report-usage-episodes: 22000
      check-boundary-bypass-ratchet: 21000
      check-shell: 19000
      # The aggregate the per-gate bars above are backstopped by; observed max 134796.
      run-quality-read-only: 189000
      # 2026-07-26 (b): this profile's first FULL-mode runs, taken to give the aarch64
      # block's `check-coverage` a measured 4-core floor (it does not run in
      # `--read-only`). Both clean at 99.5s/99.8s -- faster than the 134796ms read-only
      # max above, which predates `--maxschedchunk 1`; that older bar is left alone
      # rather than retuned from a window this run did not turn over. 1.4x the 99828ms
      # max, n=2 and stated as such.
      #
      # 2026-07-30: NOT RETUNED, and here is why rather than a silent number. Both
      # samples behind this bar are dated 2026-07-26, which PREDATES the armed
      # changed-line lane (D40, 2026-07-29). The 36cpu block above accounts for that
      # lane at 420000 using its documented cost; this profile does not account for it
      # at all. Arithmetic on the same documented figures: 99828 + ~24000 (one-commit)
      # = ~124000, still under; 99828 + 300000 (the nine-commit ceiling) = ~400000,
      # nearly 3x this bar. So a multi-commit range on a 4-core box goes RED with
      # nothing regressed -- a false red, the direction that gets a lane disabled.
      # It is left at 140000 deliberately: this repo's rule is that a bar comes from a
      # documented cost or a real window, never from one transcribed run, and NO
      # post-lane 4-core run has been observed. Widening it by the 36cpu block's
      # reasoning would be inventing a measurement for a machine nobody measured.
      # Reopen: the first `taskset -c 0-3` full run taken after the armed lane landed,
      # or the first operator report of a 4-core `run-quality-full` red with nothing
      # regressed.
      check-coverage: 39500
      run-quality-full: 140000
  local-linux-aarch64-4cpu:
    # Budgets set above this machine's measured median_recent/max_recent so the
    # gate is honest for the slower 4-CPU aarch64 box (same key scope as the
    # x86_64 profile; values derived from runtime-signals.json this turn).
    #
    # RE-DERIVED 2026-07-26 FROM A REAL 4-CORE MEASUREMENT, not from a contention
    # factor. Three `taskset -c 0-3 ./scripts/run-quality.sh --read-only` runs on
    # x86_64 measured every gate below except `check-coverage` (which does not run
    # in `--read-only`) under genuine 4-core contention. EIGHT of the eighteen bars
    # were already exceeded — including five never marked `(contended, derived)` at
    # all, and `check-secrets` at 76.6s against a 20s bar. The failure rule is
    # median-based and wired into the pre-push path, so each of those was a
    # BLOCKING false red waiting for a maintainer on a small box where nothing had
    # regressed. Those samples live under the `local-linux-x86_64-4cpu` profile in
    # `.charness/quality/runtime-signals.json`, which is where the floors below can
    # be re-read.
    #
    # MEASURED: the core-count term. Each floor is the observed 4-core max, and
    # each bar is ~1.4x it, matching the contended-relevel convention the x86_64
    # profile uses.
    #
    # ASSUMED, NOT MEASURED: that aarch64 at 4 cores is SLOWER than x86_64 at 4
    # cores, which is the only reason these read as floors rather than ceilings.
    # The assumption is not safe in general — Graviton and Apple M-series cores
    # beat many x86_64 cores single-threaded — so if this profile's box is one of
    # those, these bars are merely loose rather than too tight. That fails in the
    # tolerable direction (a weakened gate, not a false red), which is why it ships
    # as an assumption instead of blocking on hardware nobody here has.
    #
    # Still owed: a run on the actual aarch64 box. This block has NO aggregate bar
    # (`run-quality-read-only`, `pytest-release`) the way the x86_64 profiles do, so
    # nothing backstops what these eight looser per-gate bars let through.
    #
    # That hole stays open ON PURPOSE, and the attempt to close it is worth recording
    # because it looked correct. A 270000 aggregate was drafted as "2x the measured
    # 4-core wall, the same precedent `run-quality-read-only-release` set". It failed
    # that precedent's own arithmetic: the rule written at that bar is `bar < 2x
    # MEDIAN` of its window, and 270000/130279 = 2.07x median -- above 2x, so the bar
    # could not trip the 2x regression its own comment promised. The precedent bar was
    # also sized from the profile it enforces; this one would be sized from a DIFFERENT
    # profile's samples. Worse, the two failure directions here are mutually exclusive:
    # if the block's slowdown assumption is wrong the bar cannot fail, and if it holds
    # strongly (2x slower -> ~260000 median) the bar cannot pass, which is a guaranteed
    # blocking pre-push false red. No single number is honest for a profile with zero
    # recorded samples, and nothing would have surfaced the mistake -- every label here
    # reports `no-sample` until this box runs, and `BUDGET_SLACK_FACTOR` is 3.0, so a
    # 2.0x bar is invisible to the one advisory built to catch bars that cannot fail.
    #
    # The hole is now one command wide, which is why leaving it open is cheap: on the
    # first run on a real aarch64 box, `check_runtime_budget.py --runtime-profile
    # local-linux-aarch64-4cpu --suggest-budgets` emits this whole block from that
    # machine's own samples, per-label `n=` depth included. Replace these floors with
    # that output rather than deriving a second set from x86_64.
    budgets:
      charness-version: 1000
      # 4-core floor 20399ms (was 15000, a false red)
      check-cli-skill-surface: 29000
      check-inventory-declaration-coverage: 1500
      check-references-link-inventory: 2500
      check-seed-fixture-budget: 5000
      # 4-core floor 18400ms (was 12000, a false red)
      check-spec-evidence-durability: 26000
      inventory-ci-local-gate-parity: 1000
      inventory-sloc: 1500
      inventory-ubiquitous-language: 2500
      # 4-core floor 130800ms (was 110000, a false red)
      pytest: 185000
      # 2026-07-26 (b): MEASURED at 4 cores at last, and retightened from 60000. This
      # was the one label in this block with no 4-core evidence of any kind, because
      # the three throttled runs it was derived beside were `--read-only` and this gate
      # does not run there. Two FULL `taskset -c 0-3 ./scripts/run-quality.sh` runs
      # (both clean, 83/83) put it at 28.0s/28.2s, so 39500 is 1.4x the 28160ms max --
      # the same convention every sibling bar in this block uses, replacing a number
      # that was invented. n=2 is thin, and stated: this is a floor from two samples,
      # not a converged window.
      check-coverage: 39500
      # 4-core floor 36100ms; bar already above it, left alone
      doc-duplicates: 60000
      # 4-core floor 39300ms (was 35000, a false red)
      check-markdown: 55000
      # 4-core floor 76600ms (was 20000, a false red at 3.8x)
      check-secrets: 110000
      # 4-core floor 9512ms (was 8000, a false red)
      run-evals: 14000
      # 4-core floor 22500ms (was 13000, a false red)
      specdown: 32000
      validate-cautilus-call-provenance: 1500
      # 4-core floor 39100ms (was 28000, a false red)
      validate-inventory-consumption-declaration: 55000
startup_probes:
  - label: charness-version
    command:
      - python3
      - charness
      - "--version"
    class: standing
    startup_mode: warm
    surface: direct
    samples: 3
quality_phases:
