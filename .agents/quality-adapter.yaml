# >>> mutation_testing (charness propose) >>>
mutation_testing:
  commands:
    dry_run: "python3 scripts/run_cosmic_ray_mutation.py --repo-root . --mode dry-run && npm run test:mutation:js:dry-run"
    full: "python3 scripts/run_cosmic_ray_mutation.py --repo-root . --mode full && npm run test:mutation:js"
    # --test-command routes the sampler's coverage probe through the standing
    # runner instead of the dominated serial `python3 -m pytest ... tests` the
    # config literal names. This is the CALLER, not an opt-in flag: S6b-1 shipped
    # the same override on the changed-line gate with zero automated callers and
    # an adversarial reviewer measured that it therefore reached nobody.
    sample: "python3 scripts/sample_mutation_files.py --repo-root . --test-command 'python3 scripts/run_standing_pytest.py --repo-root .'"
    summary: "python3 scripts/check_mutation_suite_score.py --repo-root ."
  score_break: 80
  schedule_cron: "17 */12 * * *"
  changed_quota: 5
  max_files: 5
  max_executable_mutants: 120
  max_executable_mutants_per_file: 80
  max_test_nodeids: 40
  auto_issue:
    enabled: true
    label: mutation-test
    title: Mutation test regression on main
    marker_token: mutation-test-regression
  workflow_path: .github/workflows/mutation-tests.yml
  report_paths:
    summary_md: reports/mutation/summary.md
    sample_md: reports/mutation/sample.md
    log: reports/mutation/run.log
  declined: false
