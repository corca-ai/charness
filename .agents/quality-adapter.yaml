# >>> mutation_testing (charness propose) >>>
mutation_testing:
  commands:
    dry_run: "python3 scripts/run_cosmic_ray_mutation.py --repo-root . --mode dry-run && npm run test:mutation:js:dry-run"
    full: "python3 scripts/run_cosmic_ray_mutation.py --repo-root . --mode full && npm run test:mutation:js"
    sample: "python3 scripts/sample_mutation_files.py --repo-root ."
    summary: "python3 scripts/check_mutation_suite_score.py --repo-root ."
  score_break: 80
  schedule_cron: "17 */12 * * *"
  changed_quota: 5
  max_files: 5
  max_executable_mutants: 120
  max_executable_mutants_per_file: 80
  max_test_nodeids: 40
  auto_issue:
    enabled: true
    label: mutation-test
    title: Mutation test regression on main
    marker_token: mutation-test-regression
  workflow_path: .github/workflows/mutation-tests.yml
  report_paths:
    summary_md: reports/mutation/summary.md
    sample_md: reports/mutation/sample.md
    log: reports/mutation/run.log
  declined: false
# <<< mutation_testing (charness propose) <<<
standing_doc_provenance:
  # Dogfood the provenance-placement policy (#325). standing_docs are the
  # timeless rule docs; tracking ledgers and per-goal specs / dated
  # dispositions stay out. See docs/conventions/provenance-placement.md.
  standing_docs:
    - docs/conventions/operating-contract.md
    - docs/conventions/implementation-discipline.md
    - docs/conventions/authoring-preflight.md
    - docs/conventions/provenance-placement.md
    - docs/prescribed-skill-closeout-contract.md
  tracking_allowlist:
    - docs/support-tool-followup.md
    - docs/deferred-decisions.md
    - docs/product-success-metrics.md
    - docs/artifact-policy.md
  inline_allow_marker: provenance-allow
changed_line_mutation_gate:
  # Portable changed-line coverage gate (handoff-3). Dogfood config: the eligible
  # globs mirror the mutation pool; coverage_json is the report the closeout
  # producer emits. charness's active pre-push gate is the incremental producer
  # scripts/prepush_focused_changed_line_coverage.py (D40), which orchestrates the
  # cosmic-ray-coupled scripts/check_changed_line_mutation_coverage.py as its
  # consumer; this block proves the portable quality capability resolves the same
  # surface. See
  # skills/public/quality/references/mutation-testing.md.
  coverage_json: reports/mutation/test-coverage.json
  eligible_globs:
    - scripts/**/*.py
    - skills/public/**/*.py
    - skills/support/**/*.py
  exclude_globs:
    - "**/tests/**"
dup_ratchet:
  # Boy-scout duplicate ratchet (item 5, slice 2). Enabled green + seeded: the
  # gate baseline carries today's full code family_id set so the hard arm passes;
  # fixable_ceiling is 0 so the boy-scout arm is advisory (its block path is proven
  # by the slice-2 acceptance fixture, not in production here). scope_paths mirror
  # inventory_nose_clones' DEFAULT_PATHS. Wired into run-quality.sh + broad pre-push
  # only (NOT the docs-only fast subset). See references/dup-ratchet.md.
  enabled: true
  floor_F: 0
  escalation_K: 10
  scope_paths:
    - scripts
    - skills/public
    - skills/support
  review_artifact_path: charness-artifacts/quality/dup-review.json
  gate_baseline_path: charness-artifacts/quality/dup-ratchet-baseline.json

# The forward-looking prose surfaces this repo gates against transcribed facts,
# and the exemptions, each with a reason a reader can judge. Dated append-only
# records (charness-artifacts/**) are absent by design, not by exemption: a number
# there describes one moment and that is what it is for.
regenerable_facts:
  surfaces:
    - AGENTS.md
    - CLAUDE.md
    - README.md
    - docs/*.md
    - docs/**/*.md
    - skills/*/*/SKILL.md
    - skills/*/*/references/*.md
    - skills/shared/references/*.md
  exemptions:
    docs/deferred-decisions.md: >-
      historical context: every entry records the figures its decision was TAKEN
      on, and rewriting them to today's numbers would falsify why the decision was
      made. An entry quoting a LIVE toll still owes the command that regenerates it.
    docs/conventions/validator-timing-layers.md: >-
      each row cites the commit that MOVED a gate between timing layers; the sha is
      provenance for a past decision, not a claim about today's tree.
    docs/duplicate-detection-strategy.md: >-
      pins the jscpd version the documented thresholds were calibrated against.
    docs/docs-graph-checks.md: >-
      pins the awiki version the documented behaviour was observed against.
    docs/north-star-overhaul-roadmap.md: >-
      a dated planning record kept for its reasoning; its counts describe the state
      the roadmap was written from.
    docs/testability-dsl-initiative.md: >-
      a dated initiative record; its counts describe the state it was scoped from.
    docs/handoff-chunked-routing.md: >-
      documents measured routing behaviour with the corpus it was measured on.
    docs/prescribed-skill-closeout-contract.md: >-
      quotes the corpus size a contract clause was sized against.
    skills/public/create-cli/references/intent-first-grammar.md: >-
      pins the tool version a documented grammar was observed in.
    skills/public/quality/references/cautilus-on-demand.md: >-
      pins the cautilus version the eval-only contract was written against.
    skills/public/quality/references/mutation-testing.md: >-
      pins the mutation-tool version the documented flags belong to.
    skills/public/quality/references/unit-test-quality.md: >-
      quotes a measured figure as the evidence behind a guideline.
    skills/public/release/references/adapter-contract.md: >-
      pins the version an adapter schema field landed in.
