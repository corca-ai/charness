# The forward-looking prose surfaces this repo gates against transcribed facts,
# and the exemptions, each with a reason a reader can judge. Dated append-only
# records (charness-artifacts/**) are absent by design, not by exemption: a number
# there describes one moment and that is what it is for.
regenerable_facts:
  surfaces:
    - AGENTS.md
    - CLAUDE.md
    - README.md
    - docs/*.md
    - docs/**/*.md
    - skills/*/*/SKILL.md
    - skills/*/*/references/*.md
    - skills/shared/references/*.md
  exemptions:
    docs/deferred-decisions.md: >-
      historical context: every entry records the figures its decision was TAKEN
      on, and rewriting them to today's numbers would falsify why the decision was
      made. An entry quoting a LIVE toll still owes the command that regenerates it.
    docs/validator-timing-layers.md: >-
      each row cites the commit that MOVED a gate between timing layers; the sha is
      provenance for a past decision, not a claim about today's tree.
    docs/docs-graph-checks.md: >-
      pins the awiki version the documented behaviour was observed against.
    docs/prescribed-skill-closeout-contract.md: >-
      quotes the corpus size a contract clause was sized against.
    skills/public/create-cli/references/intent-first-grammar.md: >-
      pins the tool version a documented grammar was observed in.
    skills/public/quality/references/mutation-testing.md: >-
      pins the mutation-tool version the documented flags belong to.
    skills/public/quality/references/unit-test-quality.md: >-
      quotes a measured figure as the evidence behind a guideline.
    skills/public/release/references/adapter-contract.md: >-
      pins the version an adapter schema field landed in.
