version: 1
repo: charness
language: en
output_dir: charness-artifacts/retro
preset_id: portable-defaults
customized_from: portable-defaults
summary_path: charness-artifacts/retro/recent-lessons.md
evidence_paths:
  - docs/handoff.md
  - charness-artifacts/debug
  - charness-artifacts/quality/latest.md
  - charness-artifacts/retro/lesson-ledger.json
  - docs/development.md
metrics_commands:
  - python3 scripts/check_lesson_evaluation_continuity.py --repo-root .
# Deliberately empty. This declared `## Lesson Evaluation` with a `TODO replace
# with the exact Charness JSON form in docs/development.md#...` line, which was
# wrong twice: the scaffold owns that heading and emits it in a VALIDATING state,
# so declaring it here produced the section twice and failed the scaffold's own
# validator; and the anchor named `docs/development.md`, an authoring-repo doc the
# plugin does not ship, so a consuming repo that copied this adapter was pointed at
# a file it does not have. The grammar now lives in the refusal itself
# (`scripts/lesson_evaluation_continuity_lib.grammar_summary`).
artifact_sections: []
packet_sections:
  - id: changed-files-and-owning-surfaces
    title: Changed Files And Owning Surfaces
    content_kind: script
    command: "python3 scripts/render_critique_section_changed_surfaces.py"
auto_session_trigger_surfaces:
  - checked-in-plugin-export
  - integrations-and-control-plane
auto_session_trigger_path_globs:
  - scripts/capability_catalog*.py
  - skills/public/release/**
  - skills/support/**
  - README.md
  - docs/host-packaging.md
