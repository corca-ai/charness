version: 1
repo: charness
language: en
output_dir: charness-artifacts/critique
# Per-host contract (AGENTS.md `Subagent Delegation`, split 2026-07-17): the
# model/effort/fork_turns fields below are the CODEX-host request. Claude Code
# hosts use their own controls (typed `bounded-reviewer`, session-model
# inheritance) and do not apply or report these Codex fields. Claude-host
# reviewer-tier evidence records: requested spawn fields "typed
# `bounded-reviewer`, session-model inheritance (per-host contract)" with host
# exposure state `host-defaulted` — packets rendering the Codex fields on a
# Claude host describe the Codex-scoped request, not this host's ask.
reviewer_tiers:
  high-leverage:
    model: gpt-5.6-terra
    reasoning_effort: medium
    service_tier: priority
    fork_turns: none
  medium:
    model: gpt-5.6-terra
    reasoning_effort: medium
    fork_turns: none
# The default execution path is a Charness-owned file-backed worker. The host
# adapter chooses the concrete CLI; consumers read the worker receipt plus the
# delivery ledger and never infer approval from an output file or exit code.
reviewer_runner:
  mode: file-backed-worker
  backend: codex_exec
  timeout_seconds: 900
# Declared sections opt this repo into the critique prepare-packet
# contract. See skills/public/critique/references/prepare-packet.md.
packet_sections:
  - id: changed-files-and-owning-surfaces
    title: Changed Files And Owning Surfaces
    content_kind: script
    command: "python3 scripts/review/render_critique_section_changed_surfaces.py"
  - id: critique-prepare-non-goals
    title: Non-Goals For This Contract
    content_kind: static
    # Inline content uses a list of strings (one per line) because the
    # repo-local YAML loader does not expand `|` block scalars.
    # See skills/public/critique/references/adapter-contract.md.
    content:
      - "- Charness does not classify section roles (source/derived/audit-only/rewrite). Roles stay consumer-defined."
      - "- Charness does not enforce packet content correctness — the validator owns shape only."
      - "- Retro owns its own prepare-packet slot through retro-adapter.yaml packet_sections; critique packets do not substitute for retro lesson judgment."
  - id: reviewer-packet-semantic-question
    title: Semantic Reviewer Question
    content_kind: static
    content_path: skills/shared/references/reviewer-packet-semantic-question.md
# Repo-owned cross-surface probe for the boundary-ownership checkpoint. When a
# changed path matches one of these globs (or a source/derived path of one of the
# named surfaces in .agents/surfaces.json), the critique validator's
# --changed-ref/--changed-path mode rejects a bare `single-surface` verdict.
# This probe is owned by the explicitly selected critique artifact validation path.
#
# Charness dogfoods its own probe (DBD-4). The set is deliberately NARROW — the
# shared generic-routine surfaces where charness's own #408 failure class
# (caller-specific logic leaking into a shared library) would land: root shared
# libs (scripts/*_lib.py) and the cross-skill shared surface (skills/shared/**).
# Measured hit-rate over the last 60 commits: 5/60 (8%), so it prompts the
# ownership question only when a genuinely-shared surface changes, not on every
# commit. Broader sets were rejected (skills/public/** = 33%). The run-quality.sh
# --changed-ref wiring is what makes the 5b tooth fire in charness CI, not just
# unit fixtures.
boundary_cross_surface_globs:
  - "scripts/*_lib.py"
  - "skills/shared/**"
boundary_cross_surface_surfaces: []
